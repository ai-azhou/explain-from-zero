<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>翻页手稿 · 样张</title>
<!--
风格：翻页手稿 FLIPBOOK
一句话：每一张都是重新画的——同一根线每两帧换一次抖动，墨线有轻重，阴影是排线，像一本速写本的边角页翻起来活了。
擅长表现：让东西自己「演」——蓄力、翻过去、压扁、跟上；一样东西在受力或变化时的那股劲儿，带着手作的温度。
搬到讲解里：
  弹簧圈后仰蓄力 → 前端翻过去 → 落地压扁 → 后半截跟上 → 讲「一个过程分几拍、每拍谁先动谁后动」：用在「它是怎么一步步走过去的」这类题。
  同一个东西两种画法并排（一次描完 / 每两帧重画）→ 讲「做法 A 和做法 B 差在哪」：对比题放中段，左右（竖屏上下）各一格、读数各跳各的。
  镜头拉远露出摊开的速写本、纸角卷起翻页 → 讲完一小段、换下一个问题：当章节转场用，不要每句都翻。
招牌细节：
  材质：方格速写本的纸——淡钴蓝方格、纸斑和纤维，左边一排螺旋装订圈；纸纹最后整层正片叠底，连色块里都透出纸的颗粒。
  光：午后窗光从右边斜进来，在纸上落两块窗格亮斑、左边压一层暗；主体背后只有一团淡青水彩（30 层低透明多边形叠出边缘加深和颗粒）；高光是一笔白，不是渐变。
  主体：弹簧圈一圈一圈画——每圈前半弧粗、后半弧细淡，铜色平涂和墨线错开 2–3 像素；迎光一侧一笔白，背光一侧斜排线；
    台阶的正面整片斜排线、迎光的侧面留白；投影是斜排线，排线会超出影子边一点。
  字：手绘胖字直接写在方格纸上——骨架笔画先用圆珠笔蓝描一圈粗边，再填两层铜色芯，往右下错一层铅笔灰的影；一笔一笔写出来，笔尖是一支圆珠笔。
  动效：一拍二（每秒 12 张），预备后仰、翻过去拉长、落地压扁、跟上回弹；翻转的前端拖弧形速度线；转场是翻页，收尾拉远露出摊开的速写本、螺旋圈、铅笔。
  角落小字：12 fps、# 张数——用自己的笔画字库手写，张数随画面一张张往上跳。
色彩结构（换题保留）：纸 + 墨 + 两种平涂色，最多再加一种水彩晕染色。纸是底（浅、低饱和，带纸纹和本子本来的格线）；墨是所有线和小字；
    主角色（--main）只平涂在主角身上和胖字芯里；强调色（--accent）是写字那支笔的颜色，用来描胖字、写批注、画圈；
    晕染色（--wash）只在主角落脚的地方晕一团，表示「它要去那儿 / 被看着」。平涂不受光：明暗只靠排线和一笔高光；
    饱和度中等，面积小，大面积留给纸。底亮是因为现场是白天桌上的本子；现场在夜里就换深色纸、浅色线。
本例配色（从本例主体「一只铜色弹簧圈走台阶」和它的现场「午后窗边摊开的方格速写本」推出来，换题就换）：
    --paper #f2f2ec 冷白纸 · --grid #a9bedd 淡钴蓝方格 · --ink #2d3035 石墨铅灰 · --main #c47a46 弹簧铜 · --wash #a6dad5 淡青水彩 · --accent #3350a6 圆珠笔蓝 · --board #6c7268 桌面灰绿（只在拉远时出现）。
换题示例（?pal=alt）：假设主角是「一颗橘色乒乓球在横线作业本上弹」、现场是「傍晚的暖光」→ 纸偏暖灰、格线换成浅粉红横线色、墨偏深褐；
    主角色取乒乓球橘，晕染取淡杏；强调色取绿色圆珠笔（描字、批注、圈都用它）；桌面换成深灰褐。
    --paper #f3ede2 · --grid #e2b5ae · --ink #3a2a22 · --main #ec8a3a · --wash #f6caa0 · --accent #2f7a55 · --board #5a4d45（全表见下方 PALS.alt）。
字：显示字用 Canvas 按笔画骨架画（T7，字形自己写在 GLY 里，换字就加笔画）；角落数字和拉丁字母用笔画字库（T8）；
    中文小注用楷体 "Kaiti SC","STKaiti",KaiTi 退到宋体。
动效：所有画面只在「换张」时重画：时间先量化到 1/12 秒（一拍二），动作自然是一格一格的；曲线用预备—过冲—回落；
    每镜开头 0.4 秒翻页转场；最后一镜相机拉远到 0.7。减弱动态时只画最后一张、不沸腾。
做粗了 → 做精：
  SVG 等粗描边 → 多边形笔刷：粗细随笔压、起笔顿、收笔尖、转角出头（T4）。
  线条一动不动 / 每帧都乱抖 → 位移噪声种子每两帧换一次，整根线一起轻轻晃（T3）。
  灰色渐变当阴影 → 斜排线，线有长有短（T6）。
  弹簧画成一摞同心椭圆 → 一根连续螺旋线：圈心在一圈里往前挪，前半弧压后半弧，圈距跟着受力疏密（T10）。
  色块填满边框 → 色块单独抖、错开 2–4 像素，纸纹正片叠底透进色块（T5、T1）。
  补间平滑运动 → 时间量化成 12 张/秒，动作先压后弹，快的地方补速度线（T9）。
手机竖屏：舞台换成 800×1500 的竖版世界：台阶更陡、四级从左上走到右下占满中段，胖字在上；对比镜改成上下两格。
技法目录：
  T1 纸：方格本底色 + 纤维 + 正片叠底颗粒
  T2 水彩晕染（淡青一团）
  T3 线条沸腾（一拍二的种子）
  T4 墨线笔刷：粗细、顿笔、出头
  T5 平涂错位
  T6 排线阴影（椭圆投影 + 多边形面）
  T7 手绘胖字：一笔一笔写出
  T8 手写角注小字（笔画字库，逐张递增）
  T9 挤压拉伸、速度线、落地烟团
  T10 主体：弹簧圈走台阶（换成你的物件）
  T11 翻页转场 + 拉远露出摊开的速写本
-->
<script>
/* ━━ 配色：全片颜色只在这里（CSS 变量 + JS 对象 C）。默认是本例；网址加 ?pal=alt 换成换题示例 ━━ */
// 角色：paper 纸 / note 便签纸 / ink 墨 / main 主角平涂（mainDeep 深一档、mainSoft 淡、mainHi 亮面、mainLo 暗面）/ wash 晕染（washGrain 颜料颗粒）
//      accent 强调色（accentDeep 侧面、accentSoft 高光、shade 胖字暗影）/ hi 一笔高光 / 其余是灯泡、灯座、画板、铅笔这些道具的固有色
//      warm 纸斑、fiber 纤维、tint 纸齿偏色、shadow 投影、vign 暗角、dead 反例灰影（三元组 = RGB）
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALS = {
  base: { paper:'#f2f2ec', note:'#f8f8f3', grid:'#a9bedd', ink:'#2d3035', main:'#c47a46', mainDeep:'#8f4f2a', mainSoft:'#efc9a6', mainHi:'#e6a575', mainLo:'#a5612f',
    wash:'#a6dad5', washGrain:'#5fa8a3', accent:'#3350a6', accentDeep:'#223a80', accentSoft:'#b7c4ea', shade:'#9a9da3', hi:'#ffffff',
    tread:'#e9e9e2', riser:'#f7f7f2', face:'#d9dad3', wire:'#8d939a', hole:'#c9ccc6', tape:'#e6e9e4',
    board:'#6c7268', lead:'#3b3f3a', sheet1:'#dfe0d8', sheet2:'#e8e9e2', pencil:'#4d5560', pencilHi:'#6e7884', pencilLo:'#363c44', wood:'#e8d4b4', ferrule:'#c9ccc8', eraser:'#d99a8a',
    flip:'#f7f7f2', warm:[70, 80, 90], fiber:[70, 85, 110], tint:[.985, .99, 1], shadow:[40, 50, 70], vign:[30, 40, 60], dead:[60, 60, 60] },
  alt: { paper:'#f3ede2', note:'#faf6ee', grid:'#e2b5ae', ink:'#3a2a22', main:'#ec8a3a', mainDeep:'#b5561c', mainSoft:'#f8d3ae', mainHi:'#f6ae6e', mainLo:'#c96a26',
    wash:'#f6caa0', washGrain:'#d08a52', accent:'#2f7a55', accentDeep:'#1f5a3d', accentSoft:'#b4dcc5', shade:'#a99a8e', hi:'#fffdf8',
    tread:'#ece4d6', riser:'#f8f3ea', face:'#ddd2c2', wire:'#9a8f86', hole:'#d3c8b8', tape:'#efe6d6',
    board:'#5a4d45', lead:'#3a302a', sheet1:'#e2d9ca', sheet2:'#ebe3d5', pencil:'#2f6a4c', pencilHi:'#4a8a68', pencilLo:'#225238', wood:'#ead2ad', ferrule:'#cfc9bf', eraser:'#e7a08c',
    flip:'#faf6ee', warm:[110, 80, 50], fiber:[110, 80, 55], tint:[1, .985, .96], shadow:[70, 45, 25], vign:[70, 45, 25], dead:[70, 55, 45] },
};
const PAL = PALS[new URLSearchParams(location.search).get('pal')] || PALS.base;
const rgba = (c, a) => { if (Array.isArray(c)) return `rgba(${c[0]},${c[1]},${c[2]},${a})`; const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
(r => { const v = { paper: PAL.paper, note: PAL.note, ink: PAL.ink, ink2: rgba(PAL.ink, .72), ink22: rgba(PAL.ink, .22), main: PAL.main, mainSoft: PAL.mainSoft,
  accent: PAL.accent, board: PAL.board, tape: rgba(PAL.tape, .82), capsh: rgba(PAL.shadow, .55) }; for (const k in v) r.setProperty('--' + k, v[k]); })(document.documentElement.style);
</script>
<style>
  :root { --hand:"Kaiti SC","STKaiti",KaiTi,"Songti SC","STSong",serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); }
  body { overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

</style>
</head>
<body>
<main id="stage"></main>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const lerp = (a, b, x) => a + (b - a) * x;

/* ━━ 公共：颜色、随机数、画布 ━━ */
const C = PAL;  // 颜色只从顶部 PALS 来
const HAND = '"Kaiti SC","STKaiti",KaiTi,"Songti SC","STSong",serif';
function rng(s) { s |= 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const stage = document.getElementById('stage');
const cv = document.createElement('canvas'); stage.appendChild(cv);
const ctx = cv.getContext('2d');
let DPR = 1, VW = 0, VH = 0, U = 1, OX = 0, OY = 0, PORT = false, WW = 1600, WH = 900, L = null;
let PAPER = null, GRAIN = null, WASH = null;

/* ━━ T1 纸：方格本底色斑驳 + 纤维 + 本子自己的格线 + 正片叠底颗粒（颗粒层最后盖在所有颜色上） ━━ */
// cell/ox/oy：格子边长和起点（像素），让格线跟世界坐标对齐；格线也要「印」得不完美：深浅不一、偶尔断墨
function makePaper(w, h, base = C.paper, seed = 7, cell = 0, ox = 0, oy = 0) {
  const r = rng(seed), b = document.createElement('canvas'); b.width = w; b.height = h;
  const g = b.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 220; i++) {  // 大块斑驳：低透明软圆
    const x = r() * w, y = r() * h, R = (40 + r() * 220) * w / 1400;
    const gr = g.createRadialGradient(x, y, 0, x, y, R);
    const dark = r() < .5, a = .01 + r() * .02;
    gr.addColorStop(0, dark ? rgba(C.warm, a) : `rgba(255,255,255,${a * 1.6})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - R, y - R, R * 2, R * 2);
  }
  if (cell > 2) {  // 方格：细线 + 每 5 格一根略深的线；每根线自己的浓淡
    for (const vert of [true, false]) { const len = vert ? w : h, o0 = vert ? ox : oy;
      for (let k = Math.floor(-o0 / cell); o0 + k * cell < len; k++) { const p = Math.round(o0 + k * cell) + .5, major = k % 5 === 0;
        g.strokeStyle = rgba(C.grid, (major ? .62 : .38) * (.8 + r() * .3)); g.lineWidth = major ? 1.15 : .8;
        g.beginPath(); vert ? (g.moveTo(p, 0), g.lineTo(p, h)) : (g.moveTo(0, p), g.lineTo(w, p)); g.stroke(); } }
  }
  g.lineCap = 'round';
  for (let i = 0; i < 900; i++) {  // 纤维：短弯线，深浅两种
    const x = r() * w, y = r() * h, l = (4 + r() * 16) * w / 1400, a = r() * 6.3;
    g.strokeStyle = r() < .5 ? rgba(C.fiber, .08) : 'rgba(255,255,255,.4)'; g.lineWidth = .6 + r() * .8;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .6 + r() * 3, y + Math.sin(a) * l * .6 + r() * 3, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const gw = Math.ceil(w / 2), gh = Math.ceil(h / 2), gc = document.createElement('canvas'); gc.width = gw; gc.height = gh;
  const gx = gc.getContext('2d'), im = gx.createImageData(gw, gh), d = im.data;
  for (let i = 0; i < d.length; i += 4) {  // 纸齿：近白噪声，正片叠底后只压暗一点
    let v = 255 - r() * 11 - (r() < .25 ? r() * 9 : 0); if (r() < .0015) v -= 45;
    d[i] = v * C.tint[0]; d[i + 1] = v * C.tint[1]; d[i + 2] = v * C.tint[2]; d[i + 3] = 255;
  }
  gx.putImageData(im, 0, 0);
  return { base: b, grain: gc };
}

/* ━━ T2 水彩晕染：底形递归变形，再叠 30 层各自变形的低透明多边形 → 边缘加深 + 颗粒 ━━ */
function makeWash(R, color = C.wash, seed = 3, layers = 32) {
  const r = rng(seed), S = Math.ceil(R * 2.7), c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), gs = () => (r() + r() + r() - 1.5) / 1.5;
  const deform = (poly, depth, v) => { let p = poly;
    for (let k = 0; k < depth; k++) { const q = [];
      p.forEach((a, i) => { const b = p[(i + 1) % p.length], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
        q.push(a, [(a[0] + b[0]) / 2 + gs() * v * l, (a[1] + b[1]) / 2 + gs() * v * l]); });
      p = q; v *= .62; } return p; };
  let base = []; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; base.push([S / 2 + Math.cos(a) * R, S / 2 + Math.sin(a) * R * .94]); }
  base = deform(base, 2, .32);
  g.fillStyle = color;
  for (let k = 0; k < layers; k++) {
    const p = deform(base, 4, .22); g.globalAlpha = .034;
    g.beginPath(); p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill();
    if (k % 4 === 0) { g.globalAlpha = .05; g.lineWidth = 3; g.strokeStyle = color; g.stroke(); }  // 边缘加深
  }
  g.globalAlpha = .07; g.fillStyle = C.washGrain;  // 颜料颗粒
  for (let i = 0; i < 2600; i++) { const a = r() * 6.28, d = Math.sqrt(r()) * R * 1.05;
    g.fillRect(S / 2 + Math.cos(a) * d, S / 2 + Math.sin(a) * d, 1 + r() * 1.6, 1 + r() * 1.6); }
  return c;
}
function wash(x, y, R, img = WASH) { ctx.drawImage(img, x - R * 1.35, y - R * 1.35, R * 2.7, R * 2.7); }

/* ━━ T3 线条沸腾：每两帧（1/12 秒）换一次位移噪声种子；同一根线整根轻轻晃，不是逐点乱抖 ━━ */
const FPS = 12;  // 一拍二：24 帧的片子每张画停两帧 = 每秒 12 张
let BOIL = 0, SID = 0, AMP = 1.8;
function wob(pts, amp, seed) {
  const r = rng(seed), a1 = r() * 6.3, a2 = r() * 6.3, f1 = .045 + r() * .05, f2 = .12 + r() * .1,

function shot1(t, p) {  // 开场：整幅构图就在——方格页、四级台阶、弹簧在顶上；1.1 秒后走下第一级

function shot4(t, p) {  // 收尾：胖字写出来，弹簧走完最后一级，镜头拉远露出摊开的本子，批注圈住张数

    star4(s.latin[0] - tw / 2 - 34, s.latin[1] - 4, 12 + r() * 4, C.accent); star4(s.latin[0] + tw / 2 + 30, s.latin[1] - 18, 10 + r() * 4, C.accent); }

// 每镜一句画面（分镜）：
// 1 午后窗光里摊开的方格速写本，四级台阶从左上走到右下，铜弹簧站在顶上；右上圆珠笔胖字「一笔一画」；弹簧后仰、翻过去、压扁、跟上，走下第一级。
// 2 弹簧再走两级；蓝色批注跟着弹簧拱起的地方，写这一拍叫什么，读数是圈距倍数；右上角「第 N 级」。
// 3 同一只弹簧两种画法并排：左边同心椭圆 + 等粗线 + 灰渐变影一动不动；右边螺旋、排线、错位平涂，抖动次数往上跳。
// 4 胖字「一拍二」一笔一笔写出来，弹簧走下最后一级；相机拉远露出摊开的本子、螺旋圈、左页草稿和铅笔；批注圈住张数，右下纸角卷起。
const SHOTS = [
  // 镜一 · 线条沸腾：每一张都重画。线条每两帧抖一次。
  { dur: 5, draw: shot1 },
  // 镜二 · 挤压拉伸：后仰蓄力，翻过去拉长，落地压扁，后半截跟上。
  { dur: 5.25, draw: shot2 },
  // 镜三 · 排线对比：阴影用排线。左边描一次，右边每张重画。（竖屏：上边描一次，下边每张重画。）
  { dur: 5.2, draw: shot3 },
  // 镜四 · 拉远看：一张画停两帧。一秒十二张画。
  { dur: 4.55, draw: shot4, zoom: true },

/* ━━ 渲染：时间量化到 1/12 秒，只在换张时重画（这就是一拍二） ━━ */

const startOf = i => SHOTS.slice(0, i).reduce((a, s) => a + s.dur, 0);

const S = makePlayer(SHOTS.map(s => ({ ...s, draw: (t, p) => render(SHOTS.indexOf(s), t, p) })), {
