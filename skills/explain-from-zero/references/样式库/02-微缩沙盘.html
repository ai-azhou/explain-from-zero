<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>微缩沙盘 · 样张</title>
<!--
风格：微缩沙盘  MINIATURE
一句话：把东西做成摆在桌上的微缩模型——没有透视，三个面三档亮度；先一格格长出白模，再一件件挂上去，最后整片上色。
擅长表现：空间布局和系统——谁挨着谁、谁连着谁、哪一块在干什么；「先白模、再上色」把结构和分工拆成前后两拍。
搬到讲解里：
  白模从中心一格格落下、整座坡先是一片白 → 先讲结构、只看形状和位置：用在「这个系统由哪几块组成、怎么摆」这类题，颜色先别给。
  索一根根架上、吊椅一把把错峰挂上去 → 讲「按顺序就位、谁连着谁」：用在流程、链路、上下游，读数数「已挂上几把」。
  整片上色 → 吊椅开动、坡上的计数牌跳数 → 讲分工和运转：结构讲完再上色，一种颜色就是一种角色；最后让它动起来、读数说结果。
招牌细节：
  材质：地砖是有厚度、圆角倒边的方块，倒边接住一条高光；雪坡四层台阶；底下三层石台。
  光：顶面最亮、左侧面暗一档、右侧面暗两档（光照算出来）；低太阳略暖、天光冷蓝，雪上的影子是蓝的；软阴影贴地硬、离远虚；云影扫过；雪道上一道冰面闪光。
  主体：一条小缆车——底站、三座塔架、顶站、两根下垂的索、十二把吊椅沿环一直在走；坡脚一间砖红屋顶的木屋，窗是暖的。
  字：现场词做成石台正面的铭牌，贴在等轴竖面上跟着斜（不做躺在地上的大字标）；计数牌立在等轴竖面上，字跟着斜，引线连到顶站。
  动效：白模从中心错峰落下，拉长→压扁→回弹；索一段段延伸、吊椅错峰挂上并晃一下；上色像水波从中心传开，刷到的格子轻跳；吊椅、云、松树一直在动。
  角落小字：ORTHO · EL 30° · AZ 45°、TILE 11×11、R 0.075 这类模型自己的参数，帧号跟着跳。
色彩结构（换题保留）：底是一层上下渐变，亮暗跟现场的光走；地砖 4 种区块色，同一明度带、中低饱和，只用来分功能区；
  1 个深色当墨（字标侧面、读数）；1 组暖强调色只给会动、会亮的东西（吊椅、木屋窗、读数色条）；白模阶段只用一个近白的泥色。
本例配色（从本例主体「小滑雪场」和它的现场「冬天晴朗的早上」推出来，换题就换）：底 bg.top #D8EBFA → bg.bot #8FB9E2；
  地砖 snow #F6F9FC / piste #D3E4F4 / rock #8F9AA8 / deck #B89878；松树 pine #2E5A48；屋顶 roof #B0432D；石台 slab #C9CED4 / #9AA1AA / #767E89；
  暖强调 chair #F0A23A + lamp（木屋窗）#FFC25E；白模 clay #EEF0F4；面板 panel #FFFFFF / 侧面 side #B4C8DE。
换题示例（?pal=alt）：假设主角是「秋天傍晚的梯田茶园」（茶垄、运茶小缆车、晒茶棚）→ 光是低而暖的夕阳、天光发紫：
  底换成杏色 → 陶土色，雪地换成茶垄绿，雪道换成土路，吊椅换成全片唯一的冷色（青绿），屋顶换成灰蓝。
  bg #F8E1C8 → #D39A7C；snow #7FA86A / piste #C9A27A / rock #8C8078 / deck #B89A78；chair #2F8C8C；roof #5B6E7A；panel #FFF8F0 / side #E0BFA4。
字：铭牌和计数牌 = SVG <text> 套等轴竖面矩阵（中文重黑体）；数字等宽；正文系统黑体。
动效：60fps；缓动用 back 和阻尼弹簧；镜头只做正交缩放和平移（推近、拉远），镜间硬切；整片 20 秒一圈，环境动作按 20 秒周期写，循环接得上。
做粗了 → 做精：
  CSS 菱形贴色块 → 有厚度的圆角方块，三个面的明暗由主光 + 半球天光算出。
  没阴影 / 一块黑椭圆 → 阴影贴图 + 按挡光距离变宽的软阴影（PCSS）+ 俯视高度图 AO 压暗砖缝、台阶根、树下。
  所有东西同时出现 → 从中心错峰，先白模、再一件件挂上、最后上色，每样都有拉长—压扁—回弹。
  数据牌是平面浮层 → 牌子立在等轴竖面上、字跟着斜，引线 + 锚点连到具体部件。
  画面静止 → 吊椅、云影、松树一直在动。
手机竖屏：重新取景——石台居中放大，计数牌只在讲解镜出现（右上）；阴影贴图降到 1024。
技法目录：
  T1 等轴正交相机：世界 → 屏幕，WebGL 和 SVG 共用一套投影
  T2 圆角盒 / 圆角圆柱 / 球网格：内盒 ⊕ 球，倒边法线天然平滑
  T3 实例化绘制与管线：一条实例 16 个数；光源深度 → 俯视高度 → 底色 → 接影 → 实体 → 发光
  T4 光照（FS_LIT 里 ①–⑩）：软阴影 PCSS、高度图 AO、半球天光、主光、倒边高光、边缘天光、水面闪光、自发光（木屋窗）、点光、底部雾
  T5 接影地面：只显示阴影和贴地暗角，乘法混进底色
  T6 发光：加色光晕、地面光环、光柱（本例只用光晕给木屋窗；换题有灯时三种都用）
  T7 白模落下 → 压扁 → 回弹（错峰）、索道延伸、吊椅错峰挂上、上色波
  T8 场景表：四层台阶的雪坡分区、道具（松树、木屋、塔架、站房、索道、吊椅、雪堆、石块、云）
  T9 SVG 等轴叠层：石台铭牌（现场词贴在等轴竖面上）、竖面计数牌、引线标注、对比分割线
  T11 退路：拿不到 WebGL2 时 Canvas 2D 画静态等轴图
-->
<script>
/* ━━ 配色：全片颜色只在这里。CSS 变量、着色器 uniform、SVG 叠层、Canvas 退路都从 PAL 取；网址带 ?pal=alt 换成「换题示例」 ━━ */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  base: {  // 本例：小滑雪场（雪坡、缆车、木屋、松树）+ 冬天晴朗的早上
    bg: { top: '#D8EBFA', bot: '#8FB9E2', clayTop: '#EEF1F5', clayBot: '#C9D2DE', glow: '#FFFFFF', floor: '#7F9CBC' },  // 底渐变、主体身后的亮、地面影子（乘法）
    light: { sun: [.66, .6, .52], sky: [.5, .6, .8], gnd: [.62, .66, .74], bulb: '#FFD08A', bulbI: 0, lampGlow: 0 },  // 主光（早上的低太阳，略暖）/ 天光（冷蓝）/ 雪地反光
    scene: { clay: '#EEF0F4', snow: '#F6F9FC', snow2: '#E9F0F7', piste: '#D3E4F4', groom: '#B9D0EA', rock: '#8F9AA8', deck: '#B89878',
      slab1: '#C9CED4', slab2: '#9AA1AA', slab3: '#767E89', pedestal: '#3A4250', metal: '#B8C1CC', cableC: '#3B4554', cloud: '#FFFFFF',
      pine: '#2E5A48', pine2: '#3B6D58', trunk: '#6B4A36', wood: '#8A5E3E', roof: '#B0432D', lamp: '#FFC25E', chair: '#F0A23A', chair2: '#D9762A' },
    fx: { glow: '#FFDEA8', glowCore: '#FFF3D9', ringGlow: '#FFE0B0', beam: '#FFFFFF', glint: '#FFFFFF' },
    ui: { bg1: '#DCEDFA', bg2: '#9DC3E6', ink: '#1C2B40', ink2: '#4D6380', ink3: '#6B809C', panel: '#FFFFFF', side: '#B4C8DE', hl: '#F0A23A',
      sh: 'rgba(20,50,90,.4)', vig: 'rgba(30,70,120,.18)', grid: '#5C8FC4', guide: '#FFFFFF', dot: '#F0A23A', stripe: '#F0A23A', split: '#FFFFFF',
      iconL: '#D3E4F4', iconR: '#A9C2DC', bars: ['#E6EEF6', '#A9CBEA', '#8F9AA8', '#B89878'] },
    mark: { faceTop: '#34557C', faceBot: '#1E3554', edge: '#6F95C2', sideBack: '#0D1A2C', sideFront: '#28405F', shadow: '#1D3A5E', shadowA: .24 },
  },
  alt: {  // 换题示例：秋天傍晚的梯田茶园（茶垄、运茶小缆车、晒茶棚）
    bg: { top: '#F8E1C8', bot: '#D39A7C', clayTop: '#F4EEE8', clayBot: '#DCCDBF', glow: '#FFF1DE', floor: '#B07A62' },
    light: { sun: [.72, .5, .32], sky: [.42, .4, .5], gnd: [.5, .42, .36], bulb: '#FFC27A', bulbI: 0, lampGlow: 0 },
    scene: { clay: '#F3EEE8', snow: '#7FA86A', snow2: '#6E9A5C', piste: '#C9A27A', groom: '#A9845E', rock: '#8C8078', deck: '#B89A78',
      slab1: '#C8B49E', slab2: '#9C8570', slab3: '#7A6553', pedestal: '#3E3028', metal: '#B3A89E', cableC: '#3E3028', cloud: '#FFF4E8',
      pine: '#3F6B3A', pine2: '#4F7E45', trunk: '#5E4232', wood: '#8A6A4E', roof: '#5B6E7A', lamp: '#FFD27A', chair: '#2F8C8C', chair2: '#1F6E70' },
    fx: { glow: '#FFC07A', glowCore: '#FFE9C4', ringGlow: '#FFB35C', beam: '#FFE0B0', glint: '#FFF0DA' },
    ui: { bg1: '#F8E1C8', bg2: '#D39A7C', ink: '#3A2418', ink2: '#73513E', ink3: '#8E6C58', panel: '#FFF8F0', side: '#E0BFA4', hl: '#2F8C8C',
      sh: 'rgba(90,40,20,.35)', vig: 'rgba(120,60,30,.2)', grid: '#A5704F', guide: '#FFF4E8', dot: '#2F8C8C', stripe: '#2F8C8C', split: '#FFF8F0',
      iconL: '#E8D2BC', iconR: '#CFAF94', bars: ['#7FA86A', '#C9A27A', '#8C8078', '#B89A78'] },
    mark: { faceTop: '#5A3A28', faceBot: '#3A2418', edge: '#9C6E52', sideBack: '#1E120B', sideFront: '#4A2E1E', shadow: '#5A2E18', shadowA: .24 },
  },
};
const PAL = PALETTES[/[?&]pal=alt(&|$)/.test(location.search) ? 'alt' : 'base'];
const toRGB = (h, g = 1) => [1, 3, 5].map(i => Math.pow(parseInt(h.substr(i, 2), 16) / 255, g));   // g = 2.2 时转成线性
for (const [k, v] of Object.entries(PAL.ui)) if (typeof v === 'string') document.documentElement.style.setProperty('--' + k, v);
</script>
<style>
  :root {--sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--mono:"SF Mono",Menlo,Consolas,monospace}
  * {box-sizing:border-box;margin:0}
  html,body {height:100%;background:var(--bg1);color:var(--ink);font-family:var(--sans)}
  body {overflow:hidden}
  #stage {position:fixed;inset:0;background:linear-gradient(var(--bg1),var(--bg2))}
  #stage canvas, #ov {position:absolute;inset:0;width:100%;height:100%;display:block}
  .grain {position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .4 0 0 0 0 .4 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig {position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 55% 42%,transparent 58%,var(--vig))}

  /* SVG 叠层里的字 */

  #ov .cf{font:16px var(--sans);fill:var(--ink3)} #ov .kt{font:13px var(--mono);letter-spacing:.04em;fill:var(--ink3)}

    #meta {right:16px;top:16px;font-size:12px;letter-spacing:.12em} #meta svg {display:none} #meta .m2 {display:none}
 }

<body>
<main id="stage">
  <canvas id="gl"></canvas>
  <svg id="ov" aria-hidden="true"></svg>
  <div class="grain"></div><div class="vig"></div>
</main>
<header id="tag">
  <svg viewBox="0 0 34 38"><path d="M17 2 32 10 17 18 2 10Z" style="fill:var(--panel)"/><path d="M2 10 17 18v18L2 28Z" style="fill:var(--iconL)"/><path d="M32 10 17 18v18l15-8Z" style="fill:var(--iconR)"/><path d="M17 2 32 10 17 18 2 10Z" fill="none" style="stroke:var(--ink)" stroke-width="1.2" opacity=".25"/></svg>
  <div><b>北坡缆车 · 模型</b><span>MINIATURE · 1:300</span></div>

<aside id="meta">
  <svg viewBox="0 0 46 42"><g stroke-width="2" stroke-linecap="round" fill="none"><path d="M23 24V4" style="stroke:var(--ax0)"/><path d="M23 24 40 33" style="stroke:var(--ax1)"/><path d="M23 24 6 33" style="stroke:var(--ax2)"/></g><circle cx="23" cy="24" r="2.6" style="fill:var(--ink)"/></svg>
  <div>ORTHO · EL 30° · AZ 45°</div><div class="m2">TILE 11×11 · R 0.075</div><div id="fr">SC.02 · F 0000</div>
</aside>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const lerp = (a, b, k) => a + (b - a) * k;

/* ━━ T1 等轴正交相机：方位 45°、俯角 30°；同一个投影喂给 WebGL 矩阵和 SVG 叠层 ━━ */
const AZ = Math.PI / 4, EL = Math.PI / 6;
const CA = Math.cos(AZ), SA = Math.sin(AZ), CE = Math.cos(EL), SE = Math.sin(EL);
const RX = [CA, 0, -SA], UP = [-SA * SE, CE, -CA * SE], FW = [-SA * CE, -SE, -CA * CE];  // 屏幕右、屏幕上、看进屏幕
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const nrm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
// cam = { W, H 视口；s 每单位像素；cx, cy 目标点 T 的屏幕位置 }
function camMatrix(c) {
  const kx = 2 * c.s / c.W, ky = 2 * c.s / c.H, kz = 1 / 30;
  return new Float32Array([kx * RX[0], ky * UP[0], kz * FW[0], 0, kx * RX[1], ky * UP[1], kz * FW[1], 0, kx * RX[2], ky * UP[2], kz * FW[2], 0,
    -kx * dot(c.T, RX) + 2 * c.cx / c.W - 1, -ky * dot(c.T, UP) + 1 - 2 * c.cy / c.H, -kz * dot(c.T, FW), 1]);
}
const project = (c, p) => { const d = sub(p, c.T); return [c.cx + c.s * dot(d, RX), c.cy - c.s * dot(d, UP)]; };
// 任意方向的正交矩阵：dir 指向光源，half 覆盖半宽，depth 深度半程
function orthoFrom(dir, half, depth) {
  const f = nrm([-dir[0], -dir[1], -dir[2]]), up = Math.abs(f[1]) > .99 ? [0, 0, -1] : [0, 1, 0];
  const r = nrm(crs(f, up)), u = crs(r, f), k = 1 / half, kz = 1 / depth;
  return new Float32Array([k * r[0], k * u[0], kz * f[0], 0, k * r[1], k * u[1], kz * f[1], 0, k * r[2], k * u[2], kz * f[2], 0, 0, 0, 0, 1]);
}

const el = (tag, attrs = {}, parent = ov, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return parent.appendChild(e); };

// 等轴三个面的仿射矩阵（k 缩放，x,y 原点）：地面 u→右上 v→右下；X–Y 竖面 u→右下 v↓；Z–Y 竖面 u→右上 v↓
const mGround = (k, x, y) => `matrix(${.707 * k} ${-.354 * k} ${.707 * k} ${.354 * k} ${x} ${y})`;
const mWall = (k, x, y) => `matrix(${.707 * k} ${.354 * k} 0 ${.866 * k} ${x} ${y})`;
const mSide = (k, x, y) => `matrix(${.707 * k} ${-.354 * k} 0 ${.866 * k} ${x} ${y})`;
el('defs', {}, ov).innerHTML = '<filter id="bl" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>' +
  `<linearGradient id="fc" gradientUnits="userSpaceOnUse" x1="0" y1="-92" x2="0" y2="6"><stop offset="0" stop-color="${PAL.mark.faceTop}"/><stop offset="1" stop-color="${PAL.mark.faceBot}"/></linearGradient>`;
const gGrid = el('g', { fill: 'none', stroke: PAL.ui.grid, 'stroke-width': 1.2, 'stroke-dasharray': '3 5' });
const gridPath = el('path', {}, gGrid);
// 铭牌：现场词印在石台正面（X–Y 竖面，朝 +z）上，像模型底座的铭牌：一块浅色金属牌 + 深色字，跟着等轴斜
const gMark = el('g');
el('rect', { x: 0, y: -40, width: 330, height: 52, rx: 4, fill: PAL.ui.panel, opacity: .9 }, gMark);
el('rect', { x: 0, y: -40, width: 330, height: 52, rx: 4, fill: 'none', stroke: PAL.ui.ink, 'stroke-width': 1.2, opacity: .5 }, gMark);
el('text', { x: 14, y: -6, 'font-size': 26, 'font-weight': 900, 'font-family': SANS, fill: PAL.ui.ink }, gMark, '北坡 3 号道');
el('text', { x: 172, y: -8, class: 'kt' }, gMark, '1:300 · 4 TIERS');
// 数据牌：立在 X–Y 竖面，后面错一层暗色当厚度；色条 + 标签 + 等宽大数字 + 迷你柱图
const gLead = el('g');
const leadLine = el('polyline', { fill: 'none', stroke: PAL.ui.ink, 'stroke-width': 1.4 }, gLead);
const leadRing = el('circle', { r: 9, fill: 'none', stroke: PAL.ui.ink, 'stroke-width': 1.2 }, gLead);
const leadDot = el('circle', { r: 3.6, fill: PAL.ui.ink }, gLead);
const gCard = el('g');
el('rect', { x: 8, y: -5, width: 216, height: 140, rx: 10, fill: PAL.ui.side }, gCard);
el('rect', { width: 216, height: 140, rx: 10, fill: PAL.ui.panel }, gCard);
el('rect', { y: 16, width: 6, height: 108, fill: PAL.ui.stripe }, gCard);
const cLab = el('text', { x: 20, y: 34, class: 'h' }, gCard), cLab2 = el('text', { y: 34, class: 'cm' }, gCard);
const cNum = el('text', { x: 16, y: 97, class: 'cn' }, gCard), cUnit = el('text', { y: 97, class: 'cu' }, gCard);
const cBars = PAL.ui.bars.map((f, i) => el('rect', { x: 176 + i * 9, width: 6, rx: 2, fill: f }, gCard));
el('text', { x: 20, y: 127, class: 'cf' }, gCard, '4 区 · 侧面暗两档');
// 键帽小牌（屏幕对齐）：讲解镜的引线标注、对比镜的两块标签
function keyTag(parent, t1, t2) {
  const g = el('g', {}, parent), b = el('rect', { y: 4, height: 58, rx: 11, fill: PAL.ui.side }, g), f = el('rect', { height: 58, rx: 11, fill: PAL.ui.panel }, g);
  const a = el('text', { x: 14, y: 26, class: 'h' }, g, t1), c = el('text', { x: 14, y: 47, class: 'kt' }, g, t2);
  g.w = Math.ceil(Math.max(a.getComputedTextLength(), c.getComputedTextLength())) + 28 || 190;
  b.setAttribute('width', g.w); f.setAttribute('width', g.w);
  return g;
}
const gTag = el('g');
const tagLine = el('polyline', { fill: 'none', stroke: PAL.ui.ink, 'stroke-width': 1.4 }, gTag);
const tagRing = el('circle', { r: 8, fill: 'none', stroke: PAL.ui.ink, 'stroke-width': 1.2 }, gTag);
const tagDot = el('circle', { r: 3.4, fill: PAL.ui.ink }, gTag);
const tagBox = keyTag(gTag, '圆角倒边', 'R 0.075 · 接住一条高光');
const gSplit = el('g');
const spLine = el('line', { stroke: PAL.ui.split, 'stroke-width': 3 }, gSplit);
const spKnob = el('g', {}, gSplit);
el('circle', { r: 21, cy: 4, fill: PAL.ui.side }, spKnob); el('circle', { r: 21, fill: PAL.ui.panel }, spKnob);
el('path', { d: 'M-7-6-13 0l6 6M7-6l6 6-6 6', fill: 'none', stroke: PAL.ui.ink, 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, spKnob);
const spL = keyTag(gSplit, '平涂', 'FLAT · 只有颜色'), spR = keyTag(gSplit, '打光', 'LIT · 三档 · 蓝影 · 台阶根暗');
const sa = (e, o) => { for (const k in o) e.setAttribute(k, o[k]); };
const show = (g, a) => { g.style.opacity = a; g.style.display = a > .01 ? '' : 'none'; };
const pos = (g, x, y) => g.setAttribute('transform', `translate(${x} ${y})`);

/* ━━ 取景：横屏和竖屏各一套（竖屏不是缩小横屏，是重新构图：字标放上面、模型放中间） ━━ */
const DIAG = N * Math.SQRT2;
function frameFor(name, W, H) {
  const k = Math.min(W, H * 1.55), F = H > W
    ? { poster: { s: W * 1.02 / DIAG, cx: W * .5, cy: H * .55 }, build: { s: W * 1.04 / DIAG, cx: W * .5, cy: H * .42 }, compare: { s: W * 1.1 / DIAG, cx: W * .5, cy: H * .41 } }
    : { poster: { s: k * .64 / DIAG, cx: W * .5, cy: H * .47 }, build: { s: k * .62 / DIAG, cx: W * .53, cy: H * .44 }, compare: { s: k * .68 / DIAG, cx: W * .5, cy: H * .45 } };
  return Object.assign({ W, H, T: [0, .4, 0] }, F[name]);
}
const mixCam = (a, b, k) => ({ W: a.W, H: a.H, T: a.T, s: lerp(a.s, b.s, k), cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k) });
const BG = { clayTop: rgb(PAL.bg.clayTop), clayBot: rgb(PAL.bg.clayBot), top: rgb(PAL.bg.top), bot: rgb(PAL.bg.bot) };

/* ━━ 每一帧：算状态 → WebGL → SVG 叠层 ━━ */
let lastKey = '', lastT = performance.now(), slow = 0;
function render(cam, st, ui) {
  const key = [ui.shot, st.T.toFixed(3), cam.W, cam.H, R.scale, R.ok].join('|');
  if (key === lastKey && !R.dirty) return; lastKey = key; R.dirty = false;
  buildScene(st);
  // 自适应分辨率：连续慢帧就降一点渲染倍率
  const now = performance.now(), dt = now - lastT; lastT = now;
  if (dt > 26 && dt < 200) { if (++slow > 40 && R.scale > .55) { R.scale -= .1; slow = 0; resize(); } } else slow = Math.max(0, slow - 1);
  R.ok ? renderGL(cam, st) : renderFallback(cam);
  overlay(cam, st, ui);
}
function overlay(cam, st, ui) {
  ov.setAttribute('viewBox', `0 0 ${cam.W} ${cam.H}`);
  const P = cam.H > cam.W, s = cam.s, W = cam.W, H = cam.H;
  show(gGrid, ui.grid);
  if (ui.grid > .01) {
    let d = ''; const e = HALF + .5;
    for (let i = 0; i <= N; i++) { const v = -e + i, a = project(cam, [v, 0, -e]), b = project(cam, [v, 0, e]), c = project(cam, [-e, 0, v]), f = project(cam, [e, 0, v]);
      d += `M${a[0]} ${a[1]}L${b[0]} ${b[1]}M${c[0]} ${c[1]}L${f[0]} ${f[1]}`; }
    gridPath.setAttribute('d', d);
  }
  // 铭牌：贴在石台正面左段，世界 1 单位 = 100 个牌面单位
  show(gMark, ui.mark);
  if (ui.mark > .01) { const o = project(cam, [-HALF + .3, -.62, HALF + .5]); gMark.setAttribute('transform', mWall(s / 100, o[0], o[1])); }
  // 数据牌 + 引线：牌子挂在地台右角上方，引线拐一下连到灯泡顶
  show(gCard, ui.card); show(gLead, ui.card);
  if (ui.card > .01) {
    const k = P ? .92 : clamp(s / 50, .95, 1.15), lift = (1 - ease.back(ui.card)) * 40, anchor = project(cam, ui.cardAnchor);
    const rc = project(cam, [HALF + .5, 0, -HALF - .5]), cw = 216 * .707 * k, chh = (140 * .866 + 216 * .354) * k;
    const cx = P ? W - cw - 16 : Math.min(W - cw - 40, rc[0] - cw - 20), cy = P ? H * .09 : Math.max(H * .17, rc[1] - chh - 70);
    gCard.setAttribute('transform', mWall(k, cx, cy + lift));
    const bl = [cx, cy + lift + 140 * .866 * k], ex = anchor[0], ey = anchor[1], yy = bl[1] - 18 * k, mx = Math.max(ex + 20, Math.min(bl[0] - 30, ex + (yy - ey)));
    leadLine.setAttribute('points', `${bl[0] + 9 * k},${yy} ${mx},${yy} ${ex},${ey}`);
    for (const c of [leadDot, leadRing]) sa(c, { cx: ex, cy: ey });
    const ph = (st.T * .8) % 1; sa(leadRing, { r: 7 + 5 * ph, opacity: 1 - ph });
    cLab.textContent = ui.cardLab; cLab2.textContent = ui.cardLab2; sa(cLab2, { x: 30 + ui.cardLab.length * 18 });
    cNum.textContent = ui.cardNum; cUnit.textContent = ui.cardUnit; sa(cUnit, { x: 22 + ui.cardNum.length * 32 });
    cBars.forEach((b, i) => { const h = 14 + 58 * ui.bars[i]; sa(b, { y: 118 - h, height: h }); });
  }
  // 引线标注：锚在前角那块砖的倒边上
  show(gTag, ui.tag);
  if (ui.tag > .01) {
    const a = project(cam, [4.47, -.04, 4.47]), y = a[1] + (P ? 40 : 30), x = P ? Math.max(12, a[0] - tagBox.w - 30) : a[0] + 60;
    for (const c of [tagDot, tagRing]) sa(c, { cx: a[0], cy: a[1] });
    tagLine.setAttribute('points', `${a[0]},${a[1]} ${a[0] + (P ? -14 : 14)},${y + 29} ${P ? x + tagBox.w : x},${y + 29}`);
    pos(tagBox, x, y + (1 - ease.back(ui.tag)) * 16);
  }
  // 对比分割线：左边平涂、右边打光
  show(gSplit, ui.splitUI);
  if (ui.splitUI > .01) {
    const x = st.split * W, y0 = P ? H * .64 : H * .13;
    sa(spLine, { x1: x, x2: x, y1: 0, y2: H });
    pos(spKnob, x, P ? H * .56 : H * .5);
    pos(spL, Math.max(8, x - spL.w - 16), y0); pos(spR, Math.min(W - spR.w - 8, x + 16), y0);
  }
  document.getElementById('fr').textContent = 'SC.0' + (ui.shot + 1) + ' · F ' + String(Math.floor(ui.abs * 60)).padStart(4, '0');
}

/* ━━ 三个镜头 ━━ */
const ALL = () => 1;
const FULL = { tile: ALL, prop: ALL, paint: ALL, cable: ALL, chair: ALL, base: 1, lit: 1, bulbT: 0, paintAll: 1, beam: 0, split: 0 };
const zoneBars = ZONES.map(z => clamp(z.n / 70));
const TOPST = [LT[0], LIFT[4].top + .5, LT[1]];
let VIEW = { W: innerWidth, H: innerHeight };
const run = T => T * LSPEED;   // 吊椅沿环走了多少圈
const arrCard = T => ({ cardAnchor: TOPST, cardLab: '到站', cardLab2: 'ARRIVALS', cardNum: String(arrivals(T)).padStart(3, '0'), cardUnit: '把' });
const SHOTS = [
  // 全景：冬天晴朗的早上，一座摆在石台上的小滑雪场；吊椅沿索道一直在走，坡上的计数牌数到站的吊椅
  { dur: 6.5,
    draw(t, p) {
      const a = frameFor('poster', VIEW.W, VIEW.H), cam = { ...a, s: a.s * (1 + .05 * ease.inOut(p)) };
      render(cam, { ...FULL, T: t, run: run(t + 40), bgTop: BG.top, bgBot: BG.bot }, { ...arrCard(t + 40), shot: 0, abs: t, grid: 0, mark: 1, card: VIEW.H > VIEW.W ? 0 : 1,
        bars: zoneBars.map((v, i) => v * (.9 + .1 * Math.sin(t * 2 + i))), tag: 0, splitUI: 0 });
    } },
  // 白模：坡先一格格落下 → 塔架、木屋、松树弹起 → 两根索一段段架上 → 吊椅一把把挂上 → 整片上色 → 开动
  { dur: 7,
    draw(t, p) {
      const cam = frameFor('build', VIEW.W, VIEW.H); cam.s *= 1 - .03 * seg(t, 0, 3.6) + .13 * ease.inOut(seg(t, 3.9, 7));  // 上色时镜头推近
      const all = seg(t, 4.1, 5.5), tileT = tl => (t - (.15 + tl.d * .17 + tl.sd * .1)) / .6;
      const chairT = i => (t - (3.0 + i * .08)) / .45;
      const st = { T: 6.5 + t, tile: tileT, prop: pr => (t - (1.7 + pr.d * .06 + pr.sd * .3)) / .5, cable: ci => (t - 2.3 - ci * .25) / .6, chair: chairT,
        paint: d => clamp((t - (4.1 + d / 5.2)) / .3), run: .5 * Math.pow(seg(t, 5.3, 7), 2) * 1.7 * LSPEED,
        base: ease.out(seg(t, 1.3, 2.0)), lit: ease.inOut(seg(t, 4.9, 5.6)), bulbT: 0, paintAll: all, split: 0, beam: 0,
        bgTop: BG.clayTop.map((v, i) => lerp(v, BG.top[i], all)), bgBot: BG.clayBot.map((v, i) => lerp(v, BG.bot[i], all)) };
      let landed = 0; for (const tl of TILES) if (tileT(tl) >= .42) landed++;
      let hung = 0; for (let i = 0; i < CHAIRS; i++) if (chairT(i) >= .42) hung++;
      const phase = t > 4.1 ? 2 : t > 2.9 ? 1 : 0;
      render(cam, st, { shot: 1, abs: 6.5 + t, grid: seg(t, 0, .3) * (1 - seg(t, 1.6, 2.3)), mark: 0,
        card: seg(t, .5, 1.1), cardAnchor: phase === 1 ? TOPST : [0, 1.3, 0],
        cardLab: ['已落下', '已挂上', '上色'][phase], cardLab2: ['TILES', 'CHAIRS', 'PAINT'][phase],
        cardNum: phase === 2 ? String(Math.round(all * 100)) : phase === 1 ? String(hung).padStart(2, '0') : String(landed).padStart(3, '0'),
        cardUnit: ['/121', '/12 把', '%'][phase],
        bars: zoneBars.map(v => v * (phase === 2 ? all : phase === 1 ? hung / 12 : landed / 121)), tag: seg(t, 2.0, 2.5) * (1 - seg(t, 3.9, 4.3)), splitUI: 0 });
    } },
  // 打光 + 收尾：左边平涂，右边打光（侧面暗两档、软影、台阶根暗角）；分割线收回，镜头拉远，计数牌数到站的吊椅
  { dur: 6.5,
    draw(t, p) {
      const pull = ease.inOut(seg(t, 4.7, 6.2));
      const cam = mixCam(frameFor('compare', VIEW.W, VIEW.H), frameFor('poster', VIEW.W, VIEW.H), pull);
      const sp = .5 * ease.out(seg(t, .3, 1.3)) * (1 - ease.inOut(seg(t, 4.1, 4.9))), T = 13.5 + t;
      render(cam, { ...FULL, T, run: run(T - 12.9), split: sp, bgTop: BG.top, bgBot: BG.bot }, { shot: 2, abs: T, grid: 0, mark: 1,
        ...arrCard(T - 12.9), card: VIEW.H > VIEW.W ? seg(t, 5.2, 5.8) : seg(t, 5.0, 5.6), bars: zoneBars, tag: 0, splitUI: sp > .005 ? 1 : 0 });
    } },
];

[0, 3, 2].forEach((b, i) => document.documentElement.style.setProperty('--ax' + i, PAL.ui.bars[b]));
function resize() {
  VIEW = { W: innerWidth, H: innerHeight };
  const d = Math.min(devicePixelRatio || 1, 2) * R.scale;
  cv.width = Math.round(VIEW.W * d); cv.height = Math.round(VIEW.H * d); R.dirty = true;
}
const S = makePlayer(SHOTS, {
  onResize() { resize(); },
});
</script>
