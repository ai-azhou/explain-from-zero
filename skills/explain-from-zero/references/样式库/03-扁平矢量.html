<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>扁平矢量 样张</title>
<!--
风格：扁平矢量 FLAT VECTOR
一句话：五种纯色、零阴影，质感全交给动作的节奏：落地压扁、冲过头再回来、一件接一件错开出场。
擅长表现：一件接一件发生的事——落下、压扁、弹起、冒出来、排队升起，轻快地串起一条因果链；把几种做法并排放，比节奏和手感。
招牌细节：
  材质｜零阴影、零渐变；层次只靠色块前后叠，和「底色提亮一档」的背景剪影（圆环、加号、胶囊）慢慢漂。
  光｜不画光；亮暗靠五色本身的明度差（亮色最亮、墨色最暗），高光是一小块亮色。
  主体｜一颗主角色小球：落地压扁、弹起拉长，再变成花心、句号。
  主体｜物件分三级：大形（花盆）→ 中细节（盆沿、色带、叶片）→ 微细节（叶脉、刺点、土面、尘点）。
  字｜字标用粗圆头笔画拼（f l a t + 小球句号）；中文用同色圆角描边加粗成「圆体粗字」；英文小字字距 0.3em 以上。
  动效｜每件东西都过冲回弹；同组错开 0.08 秒；落地有放射线 + 冲击环 + 尘点，旁边的字母跟着下沉（跟随）。
  动效｜转场是 0.36 秒快速横移 + 只模糊水平方向的运动模糊 + 几道速度线。
  角落小字｜右上 FRAME 帧号 · 24 FPS 和四色点标；画面里的计数牌、格子编号「01 匀速」。
色彩结构（换题保留）：五种纯色 + 从底色、亮色里取的三档深浅，不加第六种色相。底（大面积、饱和）一种；主角一种
      （只给那颗球和要看的那一下，和底对比最强）；配角两种（道具、格子，和主角拉开明度）；亮色一种（字、地面、花瓣，全片最亮）；
      墨色 = 底压暗（线、深块）、剪影色 = 底提亮一档（背景几何）、亮色压暗一档（地面边）。全部平涂，零阴影零渐变，
      饱和度统一。底亮底暗由现场的光定；压在每种颜色上的字和线另记一个 on 色（主角是亮色时 on 色就用墨色）。
本例配色（从本例主体「一颗弹跳的小球和窗台上的三盆花」、现场「晴天白昼、刷成电光蓝的墙」推出来，换题就换）：
      bg #2B22F0 电光蓝｜hero #F4555A 珊瑚红｜ac1 #3DF2A6 薄荷绿｜ac2 #FAC72F 向日葵黄｜light #FBF4E6 奶油白｜ink #16123F｜ghost #4A43F7｜light2 #ECE2CA
换题示例（?pal=alt）：假设主角是「一颗网球」、现场是「傍晚的红土球场」→ 底取红土的赭红，主角取网球的荧光黄绿（最亮、和赭红互补），
      两个配角取场边的深绿挡布和深蓝看台（压暗，让球最跳），亮色是粉笔白线，墨色是红土压暗的深褐；主角变成了亮色，所以压在
      主角上的字改用墨色 →
      bg #C4532E｜hero #D8EF3B｜ac1 #1F5C44｜ac2 #1E3566｜light #FFF4E6｜ink #37140A｜ghost #D16A47｜light2 #EEDBC4
字：显示字都在 SVG 里画——拉丁字标是 stroke-linecap:round 的粗笔画；中文 <text> 加同色描边、stroke-linejoin:round、paint-order:stroke。
    正文黑体栈；英文小字 "Arial Rounded MT Bold","Avenir Next",Futura 退到系统无衬线；数字用等宽栈。
动效：画面按 24 帧计数；缓动只用 back（过冲 10–14%）、spring、expo-out，匀速只给转场里的位移；
    落地压扁 0.12 秒、面积守恒 sx·sy=1、支点在接触点；转场横移 0.36 秒，水平模糊随速度 0→36→0。
做粗了 → 做精：
  匀速平移 → 每个动作有预备、过冲、回落（ease.back / spring），停下时压扁一下
  一组东西同时出现 → 每件错开 0.08 秒，按位置从近到远
  球落地就停 → 压扁 + 放射线 + 冲击环 + 尘点，周围的东西跟着震一下
  加投影和渐变显「高级」→ 零阴影；层次靠色块叠放和同色剪影
  颜色越加越多 → 五色封顶，深浅只在蓝和奶油里取
手机竖屏：舞台铺满全屏，字标、花盆、拼格、答案卡改竖排（2×2 变高格，三列变三行）；
    画面里的字按 390 宽不小于 12px（竖屏 viewBox 宽 900，小字不小于 28 单位）。
技法目录：
  T1 缓动：可调过冲 backK、弹簧、expo；popAt 错峰
  T2 挤压拉伸 + 物理弹跳（面积守恒、支点在接触点、速度决定拉长）
  T3 错峰弹出（起点 + 序号 × 间隔，带过冲）
  T4 落地冲击：放射线 + 冲击环 + 尘点 + 字母跟随下沉
  T5 快速横移转场 + 水平运动模糊 + 速度线
  T6 同色剪影层（底色提亮一档的几何，缓慢漂）
  T7 引线标注（锚点 + 折线逐段画出 + 标签弹出）+ 跳数读数牌
  T8 圆形擦出（clipPath 圆从落点扩开）+ 洋葱皮间隔点 + 小曲线图
  T9 圆体粗字与笔画字标
  （配色在 <head> 里的 PALETTES：CSS 变量和 JS 共用，技法函数只认角色名）
-->
<script>
/* ━━ 配色：全片的颜色只在这里（CSS 变量和下面的 JS 共用）。默认 = 本例；网址带 ?pal=alt = 换题示例 ━━
   角色：bg 底｜hero 主角｜ac1 ac2 两个配角｜light 亮色（字、地面）｜light2 亮色压暗一档｜ink 墨色（底压暗）｜ghost 剪影（底提亮）
        onHero onAc1 onAc2 压在这些色上的字和线｜onInk 墨色块上的强调｜mark 地面条上的强调｜tagBg tagFg 风格胶囊里的编号圆
        heroLine 主角落在亮色上时的描边（主角本身够深就是 none） */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  base: { bg: '#2B22F0', hero: '#F4555A', ac1: '#3DF2A6', ac2: '#FAC72F', light: '#FBF4E6', light2: '#ECE2CA', ink: '#16123F', ghost: '#4A43F7',
    onHero: '#FBF4E6', onAc1: '#16123F', onAc2: '#16123F', onInk: '#FAC72F', mark: '#F4555A', tagBg: '#F4555A', tagFg: '#FBF4E6', heroLine: 'none' },
  alt: { bg: '#C4532E', hero: '#D8EF3B', ac1: '#1F5C44', ac2: '#1E3566', light: '#FFF4E6', light2: '#EEDBC4', ink: '#37140A', ghost: '#D16A47',
    onHero: '#37140A', onAc1: '#FFF4E6', onAc2: '#FFF4E6', onInk: '#D8EF3B', mark: '#C4532E', tagBg: '#37140A', tagFg: '#D8EF3B', heroLine: '#37140A' },
};
const C = PALETTES[new URLSearchParams(location.search).get('pal') === 'alt' ? 'alt' : 'base'];
for (const k in C) document.documentElement.style.setProperty('--' + k, C[k]);
</script>
<style>
  :root {   /* 颜色变量由 <head> 里的 PALETTES 写入 */
    --zh:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --rd:"Arial Rounded MT Bold","Avenir Next","Futura","Century Gothic","Segoe UI",Arial,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--light); font-family:var(--zh); }
  body { overflow:hidden; -webkit-font-smoothing:antialiased; }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .zh { font-family:var(--zh); font-weight:800; }
  .rd { font-family:var(--rd); font-weight:700; }
  .mono { font-family:var(--mono); font-weight:700; }
  .round { paint-order:stroke; stroke-linejoin:round; stroke-linecap:round; }

  /* 角落：风格字标 + 帧号 */
  #style-tag { position:fixed; left:clamp(16px,3vw,40px); top:clamp(14px,2.4vw,28px); display:flex; gap:10px; align-items:center; pointer-events:none; }
  #style-tag .pill { display:flex; align-items:center; gap:10px; height:40px; padding:0 18px 0 5px; border-radius:20px; background:var(--light); color:var(--ink); }
  #style-tag .no { width:30px; height:30px; border-radius:50%; background:var(--tagBg); color:var(--tagFg); display:grid; place-items:center; font:800 13px/1 var(--mono); }
  #style-tag .zh { font-size:16px; font-weight:900; }
  #style-tag .en { font:700 11px/1 var(--rd); letter-spacing:.3em; opacity:.6; }
  #frm { position:fixed; right:clamp(16px,3vw,40px); top:clamp(22px,2.9vw,36px); display:flex; gap:14px; align-items:center;
    font:700 12px/1 var(--mono); letter-spacing:.14em; color:color-mix(in srgb, var(--light) 75%, transparent); pointer-events:none; }
  #frm .mark { display:grid; grid-template-columns:8px 8px; gap:3px; }
  #frm .mark b { width:8px; height:8px; border-radius:50%; }

  @media (orientation:portrait), (max-aspect-ratio:4/5) {
    #style-tag .pill { height:34px; padding-right:12px; }
    #style-tag .en, #frm .txt { display:none; }
  }
</style>
</head>
<body>
<main id="stage"><svg id="sv" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg></main>
<header id="style-tag"><div class="pill"><b class="no">03</b><span class="zh">扁平矢量</span><span class="en">FLAT VECTOR</span></div></header>
<div id="frm"><span class="txt" id="frmtxt">FRAME 0000 · 24 FPS</span><span class="mark"><b style="background:var(--hero)"></b><b style="background:var(--ac1)"></b><b style="background:var(--ac2)"></b><b style="background:var(--light)"></b></span></div>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ T1 缓动：过冲量可调、弹簧、expo；全片不用匀速（转场位移除外） ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  backK: k => x => 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2),   // k 越大冲得越远：1.7≈10%，2.2≈14%
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  expo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
// 过冲量：数出来写进读数，标注和动作永远一致
const overshootOf = f => { let m = 0; for (let i = 0; i <= 200; i++) m = Math.max(m, f(i / 200)); return m - 1; };

/* ━━ T3 错峰弹出：第 k 件在 t0 + k·gap 起跳，dur 秒到位，带过冲 ━━ */
function popAt(t, t0, k = 0, gap = .08, dur = .45, kk = 2.2) {
  const x = clamp((t - t0 - k * gap) / dur);
  return x <= 0 ? 0 : ease.backK(kk)(x);
}

/* ━━ 小工具：建 SVG 元素 ━━ */
const NS = 'http://www.w3.org/2000/svg';
function E(tag, at, parent) { const e = document.createElementNS(NS, tag); if (at) for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
function A(e, at) { for (const k in at) e.setAttribute(k, at[k]); return e; }
function T(parent, str, x, y, size, at = {}) { const e = E('text', Object.assign({ x, y, 'font-size': size }, at), parent); e.textContent = str; return e; }
// 颜色对象 C 在 <head> 的 PALETTES 里，这里只按角色取：C.bg C.hero C.ac1 C.ac2 C.light C.ink C.ghost ……
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

/* ━━ T9 圆体粗字：同色描边 + 圆角接头，把系统黑体「吹胖、磨圆」 ━━ */
function roundText(parent, str, x, y, size, color, at = {}) {
  return T(parent, str, x, y, size, Object.assign({ class: 'zh round', fill: color, stroke: color,
    'stroke-width': size * .032, 'text-anchor': 'middle' }, at));
}
// 笔画字标：每个字母是 stroke-linecap:round 的粗笔画，单位 = 字母坐标
const MARK = {
  sw: 54, width: [-75, 640], ball: { x: 700, y: -19, r: 46 },
  letters: [
    { d: 'M0 0V-240A70 70 0 0 1 70-310H100M-48-210H92', px: 22 },
    { d: 'M175-310V0', px: 175 },
    { d: 'M267-105a78 78 0 1 0 156 0a78 78 0 1 0-156 0M423-210V0', px: 345 },
    { d: 'M532-290V-60A60 60 0 0 0 592 0H612M484-210H612', px: 548 },
  ],
};
function drawMark(parent, color) {
  return MARK.letters.map(l => {
    const g = E('g', null, parent);
    E('path', { d: l.d, fill: 'none', stroke: color, 'stroke-width': MARK.sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    return g;
  });
}

/* ━━ T2 挤压拉伸 + 物理弹跳 ━━ */
// 以 (x, y) 为支点压扁 / 拉长：sx·sy = 1，面积不变
const squash = (x, y, sy) => `translate(${x} ${y}) scale(${1 / sy} ${sy}) translate(${-x} ${-y})`;
// 从高 h 落下、重力 g、反弹系数 e：返回离地高度 y、速度 v、接触压扁量 hit（0–1）
function bounce(t, h, g, e, n = 3, contact = .12) {
  const tf = Math.sqrt(2 * h / g); const v0 = g * tf;
  if (t < tf) return { y: h - .5 * g * t * t, v: -g * t, hit: 0, k: -1 };
  t -= tf; let v = v0;
  for (let k = 0; k < n; k++) {
    if (t < contact) return { y: 0, v: 0, hit: Math.sin(Math.PI * t / contact) * (v / v0), k, tk: t };
    t -= contact; v *= e; const air = 2 * v / g;
    if (t < air) return { y: v * t - .5 * g * t * t, v: v - g * t, hit: 0, k };
    t -= air;
  }
  return { y: 0, v: 0, hit: 0, k: n, rest: true };
}
// 速度 → 拉长：越快越细长，最多 1.45 倍
const stretchOf = (v, vmax) => 1 + .45 * clamp(Math.abs(v) / vmax);

/* ━━ T4 落地冲击：放射线 + 冲击环 + 尘点（一次落地 = 一组） ━━ */
function makeImpact(parent, n = 7, color = C.ac2) {
  const g = E('g', null, parent), rays = [], rings = [], dust = [];
  for (let i = 0; i < n; i++) rays.push(E('line', { stroke: i % 2 ? C.light : color, 'stroke-width': 9, 'stroke-linecap': 'round' }, g));
  for (let i = 0; i < 2; i++) rings.push(E('ellipse', { fill: 'none', stroke: color, 'stroke-width': 5 }, g));
  for (let i = 0; i < 6; i++) dust.push(E('circle', { fill: C.light }, g));
  return {
    // u：落地后经过的秒数；amp：力度 0–1；(x,y) 接触点；sc：整体尺寸
    draw(u, amp, x, y, sc = 1) {
      const on = u >= 0 && u < .7 && amp > .05;
      g.style.display = on ? '' : 'none'; if (!on) return;
      const a = ease.out(clamp(u / .32)), b = ease.out(clamp((u - .05) / .3));
      rays.forEach((r, i) => {
        const ang = Math.PI * (-.92 + .84 * i / (n - 1)), r1 = (40 + 120 * b) * sc * amp, r2 = (60 + 90 * a) * sc * amp;
        const len = Math.max(0, r2 - r1 * .6);
        A(r, { x1: x + Math.cos(ang) * r1, y1: y + Math.sin(ang) * r1 * .9, x2: x + Math.cos(ang) * (r1 + len), y2: y + Math.sin(ang) * (r1 + len) * .9,
          opacity: u < .32 ? 1 : 0 });
      });
      rings.forEach((r, i) => {
        const w = clamp((u - i * .08) / .55), rx = (40 + 190 * ease.out(w)) * sc * amp;
        A(r, { cx: x, cy: y, rx, ry: rx * .16, opacity: w > 0 ? 1 - w : 0, 'stroke-width': 6 * (1 - w) + 1 });
      });
      dust.forEach((d, i) => {
        const side = i % 2 ? 1 : -1, sp = (.6 + (i % 3) * .25) * amp, w = clamp(u / .6);
        A(d, { cx: x + side * (30 + 120 * sp * w) * sc, cy: y - (260 * sp * w - 380 * w * w * sp) * sc, r: (7 - i % 3 * 1.5) * (1 - w) * sc });
      });
    },
  };
}

/* ━━ T7 引线标注：锚点 → 折点 → 标签，线逐段画出 ━━ */
function makeLeader(parent, color = C.light, ink = C.ink) {
  const g = E('g', null, parent);
  const line = E('polyline', { fill: 'none', stroke: color, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const ring = E('circle', { fill: 'none', stroke: color, 'stroke-width': 5 }, g);
  const dot = E('circle', { fill: color, r: 7 }, g);
  const tag = E('g', null, g);
  const box = E('rect', { fill: color, rx: 26 }, tag);
  const big = T(tag, '', 0, 0, 40, { class: 'zh', fill: ink });
  const small = T(tag, '', 0, 0, 20, { class: 'rd', fill: ink, opacity: .6, 'letter-spacing': '.3em' });
  return {
    // a 锚点、m 折点、b 标签起点；u 画线进度 0–1；pop 标签弹出量
    draw(a, m, b, u, pop, txt, sub, fs = 40) {

  A(bgRect, { width: L.W, height: L.H });
  buildGhosts(ghostsG, L.W, L.H);
  SC.forEach((s, k) => s.build(scenes[k]));
  SC.forEach((s, k) => { if (k !== cur) s.draw(SHOTS[k].dur); });
}

const P0 = makePlayer(SHOTS, {
  onShot(i, s, S) {
    const prev = cur;
    whipFrom = (prev !== i && !S.reduce && SHOTS.__started) ? prev : -1;
    whipDir = (i === (prev + 1) % SHOTS.length) || i > prev ? 1 : -1;
    if (whipFrom >= 0) SC[prev].draw(SHOTS[prev].dur);   // 旧镜停在最后一帧，跟着甩出去
    cur = i; SHOTS.__started = true;
    base = SHOTS.slice(0, i).reduce((a, x) => a + x.dur, 0);
  },
  onResize() { relayout(); },
});
</script>
