<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三维渲染 · 样张</title>
<!--
风格：3D 渲染 3D RENDER
一句话：在浏览器里装一台小型离线渲染器——成千颗小珠铺地、一个软乎乎的亮面主体、一盏大柔光箱；焦点只给主角，其余交给虚化。
擅长表现：尺度、数量、软硬轻重、一次碰撞引起的连锁——成千上万个小东西直接铺出来，一个有分量的主体落下去、压出坑、涟漪一圈圈传开。
招牌细节：
  材质：珠子是缎面珠光（宽高光、下半边压暗）；主体是亮面充气膜（明暗交界偏红、薄处透光）；旁边一颗铬球做对照。
  光：一盏大柔光箱从左前上方打，亮面上反射出圆角矩形高光；右后一条细灯带补第二道小高光；天光取现场的光色，地面把珠毯色反上来。
  光：接触阴影 + 缝隙暗部——珠缝压到底色最深的一档，主体脚下最暗；落下的主体在半空就先投下一块越来越实的影子。
  主体：充气字「3D」，粗圆管、接头处鼓起；落下先拉长、落地压扁、把珠子压出坑、弹两下停住。
  字：显示字就是画面里这组三维字；界面字用粗黑体 + 字距拉开的英文小标 + 等宽读数。
  动效：涟漪一圈圈外传；颜色波一格格把珠毯翻成第三种色相；镜头一直在缓推或缓绕，从不静止。
  后期：浅景深（前景能糊过焦内）、柔辉光、暗角、细颗粒、几颗前景虚化光斑。
  角落小字：f/1.8 · 85 mm、采样数和步数、帧号、当前渲染倍率。
色彩结构（换题保留）：四种颜色，全部受光、没有平涂。
  底和珠毯：同一族、低饱和，占画面最大，靠明暗出体积；珠缝和 AO 往这族的最深处走（有色暗部），不往灰走。
  主角：全片唯一高饱和色，亮面受光，明暗交界往更暖 / 更深的同色偏（透光感）。
  颜色波：第三种色相，只在答案那一下铺满珠毯；散落的几颗小珠提前用它埋个伏笔。
  光和空气：天光、雾、柔光箱、后期光斑都取现场的光色，略偏底色。
  底亮底暗由现场的光定：亮棚、阴天、暗场侧光都成立（暗场时底压到近黑，只留柔光箱和边光）。
本例配色（从本例主体「充气字 3D 和桃色珠毯」和现场「粉紫柔光摄影棚」推出来，换题就换）：
  珠毯 carpet #faccb3 · 颜色波 wave #a894f7 · 主角 hero #fc4085 · 缝 gap #522930 · 天 horiz #fad9de / zen #e0c2f2 · 雾 haze #f7d9e0
换题示例（?pal=alt）：假设主角是「一只芥黄色雨靴」、现场是「阴天的石板院子」→ 珠毯和底取石板的冷灰蓝、天光和雾是阴天的蓝灰、AO 往深靛走；
  雨靴的芥黄做全片唯一的暖饱和色；颜色波取雨后青苔的青绿。冷底衬暖主角。
  珠毯 #99a6b5 · 颜色波 #389980 · 主角 #f5a117 · 缝 #1a212e · 天 #d6dee6 / #a3b3c7 · 雾 #d1dbe6
字：显示字 = 着色器里的 SDF 充气字（中心线距离 → 圆管）；界面中文用黑体 800；英文小标 "Avenir Next","Helvetica Neue",Arial 字距 .32em；读数用等宽。
动效：落体用二次缓入；落地瞬间压扁 0.7 再弹簧回 1（exp·cos）；压坑 0.07 秒到底并过冲；涟漪速度 4.5 单位/秒（约 7 颗珠）；颜色波 12 格/秒；全程 60 帧连续。
做粗了 → 做精：
  Canvas 画一排排同色圆 → 每颗珠有明暗、宽高光、下半边进缝的暗，缝底是底色最深的一档
  主体浮在地上 → 主体把珠子压出坑、坑沿微微鼓起、脚下接触阴影最暗
  全画面一样清楚 → 按深度算弥散圈，焦外前后都虚，远处入雾
  高光是一个白点 → 反射一块程序化柔光箱，得到圆角矩形高光 + 一道细灯带
  落下只是平移 → 拉长 → 压扁 → 弹两下，同时涟漪外传、读数跳
手机竖屏：相机拉远、视角放宽，用「移轴」把主体抬到上三分之一；读数和标注改到主体上下方；渲染倍率从 0.5 起按帧时自动降。
技法目录：
  T1 相机：基向量 + 移轴，JS 用同一套公式把三维点投到屏幕（引线锚点）
  T2 珠毯：二维网格 DDA 逐格走，每格和本格那颗珠解析求交
  T3 压坑与涟漪：每颗珠的高度 = 主体压坑 + 坑沿隆起 + 衰减涟漪 + 颜色波
  T4 充气字：中心线距离 → 圆管，笔画间 smooth-min 让接头鼓起；挤压按体积守恒
  T5 光照分项：分通道 wrap 漫射 / 半影软阴影 / 法线 5 采样 AO + 珠子解析 AO / 菲涅耳 / 柔光箱反射
  T6 铬球：解析反射 + 第二次 DDA 照出珠毯和字
  T7 雾与弥散圈：距离雾 + 有符号 CoC 写进 alpha
  T8 后期：金角螺旋景深 + mip 辉光 + 光斑 + ACES + 暗角 + 颗粒
  T9 自适应分辨率 + 状态不变不重画
  T10 动画：落下—压扁—回弹、读数（JS 用同一个压坑函数数珠子）
  T12 退路：拿不到 WebGL2 时 Canvas 2D 画一张静态近似
  配色：文件顶部 PALETTES 一处；CSS 变量、着色器 uniform、退路 Canvas 都从它取；?pal=alt 换成换题示例
-->
<script>
/* ━━ 配色：全片颜色只在这一处（换题就换这里）。css → 页面的 CSS 变量；gl → 着色器 uniform（sRGB 0–1，JS 转线性再传）；退路 Canvas 也从 gl 取 ━━ */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  base: {   // 本例：充气字「3D」+ 桃色珠毯，粉紫柔光摄影棚
    css: { bg: '#f3d3da', stage1: '#f8dfe4', stage2: '#e9c3d6', ink: '#3a1730', dim: '#7a5370', accentInk: '#ef3c7e',
      plate1: 'rgba(255,251,252,.78)', plate2: 'rgba(255,236,243,.6)', plateTint: 'rgba(222,122,170,.14)', plateShadow: 'rgba(110,30,74,.38)',
      heroHi: '#ff86b0', hero: '#ff4688', heroLo: '#d61d67', heroShadow: 'rgba(190,40,110,.5)', heroDeep: 'rgba(140,0,60,.4)', onHero: '#ffffff',
      clayHi: '#fff1ea', clay: '#f6cdbd', clayLo: '#d9a294', clayInk: '#8a3f55', clayShadow: 'rgba(150,60,70,.42)',
      chip: 'rgba(255,246,249,.84)', chipShade: 'rgba(160,80,110,.12)' },
    gl: { carpet: [.98, .8, .7], wave: [.66, .58, .97], loose: [.74, .62, .98], gap: [.32, .16, .19], hero: [.99, .25, .52],
      horiz: [.98, .85, .87], zen: [.88, .76, .95], haze: [.97, .85, .88], sky: [.98, .8, .93], bounce: [.95, .62, .55],
      // 下面这些是线性光强 / 系数，不再转换
      aoTint: [.36, .13, .17], key: [1.95, 1.84, 1.72], softbox: [7, 6.7, 6.5], strip: [3.4, 3, 3.8],
      wrap: [.6, .22, .34], sss: [1.2, .35, .5], chrome: [.9, .88, .96], orb: [.9, .78, 1], grade: [1, 1, 1, 1.1] } },
  alt: {    // 换题示例：芥黄雨靴 + 阴天石板院子（冷灰蓝底、唯一暖饱和的主角、青苔青绿做颜色波）
    css: { bg: '#c9d1db', stage1: '#dfe5ec', stage2: '#b7c2cf', ink: '#1b2330', dim: '#4f5b6c', accentInk: '#a8670a',
      plate1: 'rgba(250,252,254,.8)', plate2: 'rgba(230,236,243,.64)', plateTint: 'rgba(90,120,160,.15)', plateShadow: 'rgba(18,30,50,.34)',
      heroHi: '#ffd166', hero: '#f2a516', heroLo: '#b8730a', heroShadow: 'rgba(170,110,10,.48)', heroDeep: 'rgba(120,70,0,.42)', onHero: '#3d2800',
      clayHi: '#f3f6f9', clay: '#c8d1dc', clayLo: '#8d9aab', clayInk: '#2c3746', clayShadow: 'rgba(40,58,84,.4)',
      chip: 'rgba(246,248,251,.86)', chipShade: 'rgba(60,80,110,.14)' },
    gl: { carpet: [.6, .65, .71], wave: [.22, .6, .5], loose: [.28, .66, .56], gap: [.1, .13, .18], hero: [.96, .63, .09],
      horiz: [.84, .87, .9], zen: [.64, .7, .78], haze: [.82, .86, .9], sky: [.8, .85, .92], bounce: [.56, .6, .66],
      aoTint: [.07, .1, .17], key: [1.8, 1.88, 2], softbox: [6.4, 6.7, 7], strip: [2.6, 3.2, 3.7],
      wrap: [.5, .3, .08], sss: [1.1, .45, .08], chrome: [.88, .92, .97], orb: [.78, .88, 1], grade: [.99, 1, 1.02, 1.06] } },
};
const PAL = PALETTES[new URLSearchParams(location.search).get('pal') === 'alt' ? 'alt' : 'base'];
for (const [k, v] of Object.entries(PAL.css)) document.documentElement.style.setProperty('--' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()), v);
</script>
<style>

  :root { --mono:"SF Mono",Menlo,Consolas,monospace; --latin:"Avenir Next","Helvetica Neue",Arial,sans-serif;
    --plate:linear-gradient(180deg,var(--plate1),var(--plate2)); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }

  .fx { opacity:0; transition:opacity .45s, transform .6s cubic-bezier(.2,1.4,.4,1); pointer-events:none; }

  #tag small { display:block; margin-top:4px; font:600 12px/1 var(--latin); letter-spacing:.24em; color:var(--dim); }

    transition:all .45s cubic-bezier(.2,1.6,.4,1); }

    background:radial-gradient(60% 50% at 35% 25%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),radial-gradient(circle at 50% 40%,var(--hero-hi),var(--hero) 70%,var(--hero-lo));
    box-shadow:inset 0 -4px 8px var(--hero-deep), 0 8px 16px -6px var(--hero-shadow); }

  /* 手机竖屏：重排，不是缩小 */

<body>
<main id="stage"><canvas id="gl" aria-hidden="true"></canvas></main>
<div id="brand" class="plate"><b>05</b><span><strong>三维渲染</strong><small>3D RENDER</small></span></div>
<div id="spec"><div><i>●</i> f/1.8 · 85 mm</div><div id="steps">1 SPP · 96 STEPS</div><div id="frm">FRAME 0000</div><div class="x" id="res">RES 0.72×</div></div>
<div id="lock" class="fx on"><small>RAYMARCHED · SOFTBOX · SHALLOW FOCUS</small><span>光线步进 · 柔光箱 · 浅景深</span></div>
<div id="read" class="plate fx"><b id="rn">000</b><span>颗珠子被压下</span><small>PRESSED BEADS</small></div>
<svg id="lead" class="fx" aria-hidden="true"><path id="lp"/><circle id="la" r="4.5"/><circle id="lr" class="ring" r="10"/></svg>
<div id="tag" class="plate fx"><b>接触阴影</b><small>CONTACT SHADOW · AO</small></div>
<ol id="chips" class="fx" aria-label="光照分项">
  <li><em>01</em>漫射</li><li><em>02</em>软阴影</li><li><em>03</em>AO 缝隙暗部</li><li><em>04</em>边光高光</li><li><em>05</em>景深</li>
</ol>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};

/* ━━ 着色器第 1 遍：场景（降分辨率，输出 颜色 + 有符号弥散圈）━━ */
const SCENE_FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform vec3 uCamPos, uCamR, uCamU, uCamF, uLens;  // uLens: x=tan(半视角) y,z=移轴
uniform float uFocus, uAperture, uWave;
uniform vec4 uG3, uGD;      // 两个字：x, 字底 y, 挤压 sy, 压坑 0–1
uniform vec4 uBall;         // 铬球：x, 球底 y, z, 压坑
uniform vec4 uRip[3];       // 涟漪：x, z, 年龄(秒), 振幅
uniform vec4 uTerms;        // 软阴影, AO, 边光高光, 透光（对比镜逐项打开）
uniform int uMaxC;          // DDA 最多走几格（手机少走）

const float CS = 0.6;       // 珠子格距（字高约 8 颗珠）
const float R = 0.276;      // 珠半径，比半格略小，留出缝
const float GND = -0.44;    // 缝底平面，压在最深的坑下面（不然坑里的珠会被切平）
const float RT = 0.5;       // 字的圆管半径
const float RL = 0.98, RU = 0.84, RB = 0.72;
const vec3 LDIR = vec3(-0.4136, 0.7999, -0.4347);   // 主光方向（指向柔光箱）：左前上方，偏高
// 颜色全部由 JS 的 PALETTES 传进来（已转成线性），这里不写任何色相
uniform vec3 uCarpet, uWaveC, uLoose, uGap, uHero;   // 珠毯 / 颜色波目标 / 散落小珠 / 缝底 / 主角
uniform vec3 uHoriz, uZen, uHaze, uSky, uBounce;     // 地平线 / 天顶 / 雾 / 天光 / 地面反光
uniform vec3 uAOc, uKey, uSoftbox, uStrip;           // 有色 AO / 主光 / 柔光箱 / 细灯带（线性强度）
uniform vec3 uWrap, uSss, uChrome;                   // 主角的分通道 wrap / 背光透色 / 铬的染色

float hash2(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.)/k; return min(a, b) - h*h*k*.25; }

/* ━━ T3 压坑与涟漪：每颗珠的高度偏移（JS 里有同一份，用来数珠子）━━ */
float press(vec2 q, float cx, float hw, float amt){
  float dx = max(abs(q.x - cx) - hw, 0.);
  float d = length(vec2(dx, q.y*1.5));
  return amt*(-0.28*exp(-d*d*1.7) + 0.065*exp(-(d - 1.45)*(d - 1.45)*2.2));   // 坑 + 坑沿隆起
}
float disp(vec2 q){
  float h = 0.;
  if (uG3.w > 0.) h += press(q, uG3.x, 0.55, uG3.w);
  if (uGD.w > 0.) h += press(q, uGD.x + 0.6, 0.62, uGD.w);
  if (uBall.w > 0.) { float d = length(q - uBall.xz); h += uBall.w*(-0.3*exp(-d*d*2.4) + 0.055*exp(-(d - 1.2)*(d - 1.2)*3.)); }
  for (int i = 0; i < 3; i++) {
    vec4 r = uRip[i];
    if (r.w <= 0.) continue;
    float x = length(q - r.xy) - r.z*4.5;                 // 波前以 4.5 单位/秒外传
    h += r.w*exp(-r.z*0.8)*sin(x*2.4)*exp(-x*x*0.25)*step(x, 1.3);
  }
  if (uWave > 0.) { float x = length(q) - uWave; h += 0.13*exp(-x*x*0.8); } // 颜色波经过时珠子抬一下
  return max(h, -0.4);
}

/* ━━ T2 珠毯：二维网格 DDA，逐格和本格那颗珠解析求交（成千颗也不靠步进）━━ */
float sphHit(vec3 ro, vec3 rd, vec3 c, float r){
  vec3 oc = ro - c; float b = dot(oc, rd); float h = b*b - dot(oc, oc) + r*r;
  return h < 0. ? -1. : -b - sqrt(h);
}
// kind: 1 珠, 2 缝底, 3 远处平面, 4 散落的小珠
float traceCarpet(vec3 ro, vec3 rd, int maxC, out vec3 cen, out vec2 cell, out float kind){
  kind = 0.; cen = vec3(0.); cell = vec2(0.);
  float yTop = 2.*R + 0.2, t0 = 0.;
  if (ro.y > yTop) { if (rd.y > -1e-4) return -1.; t0 = (yTop - ro.y)/rd.y; }
  if (t0 > 150.) return -1.;                               // 贴着地平线的光线：远到只剩雾，不走了（也避免大数精度炸成 NaN）
  vec3 p = ro + rd*t0;
  vec2 c = floor(p.xz/CS);                                 // 格子编号
  vec2 d = vec2(abs(rd.x) < 1e-5 ? 1e-5 : rd.x, abs(rd.z) < 1e-5 ? 1e-5 : rd.z);
  vec2 st = sign(d), tD = CS/abs(d);
  vec2 tM = t0 + ((c + max(st, 0.))*CS - p.xz)/d;          // 到下一条格线的光线参数
  for (int i = 0; i < 160; i++) {
    if (i >= maxC) break;
    vec2 cc = (c + .5)*CS;
    vec3 ce = vec3(cc.x, R + disp(cc), cc.y);
    float best = sphHit(ro, rd, ce, R); kind = 1.; cen = ce;
    float hs = hash2(c);
    if (hs < 0.012) {                                      // 约 1% 的格子顶上多摆一颗小紫珠
      vec3 c2 = ce + vec3((hs*80. - 0.5)*0.05, R*1.45, 0.);
      float t2 = sphHit(ro, rd, c2, R*0.62);
      if (t2 > 0. && (best < 0. || t2 < best)) { best = t2; kind = 4.; cen = c2; }
    }
    if (best > 0.) { cell = c; return best; }
    float tExit = min(tM.x, tM.y);
    if (ro.y + rd.y*tExit < GND) { kind = 2.; cell = c; return (GND - ro.y)/rd.y; }   // 走到缝底
    if (tM.x < tM.y) { tM.x += tD.x; c.x += st.x; } else { tM.y += tD.y; c.y += st.y; }
  }
  if (rd.y < 0.) { kind = 3.; cell = c; return (R*1.5 - ro.y)/rd.y; }   // 走不完的远处：平面 + 凹凸假珠（见着色）
  kind = 0.; return -1.;
}

/* ━━ T4 充气字「3D」：中心线距离 → 圆管；笔画之间 smooth-min，接头鼓起来 ━━ */
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; return length(pa - ba*clamp(dot(pa, ba)/dot(ba, ba), 0., 1.)); }
float sdArc(vec2 p, vec2 c, float r, float mid, float ap){   // 圆弧：mid 中心角，ap 半张角
  p -= c; float a = 1.5707963 - mid, cs = cos(a), sn = sin(a);
  p = vec2(cs*p.x - sn*p.y, sn*p.x + cs*p.y); p.x = abs(p.x);
  vec2 sc = vec2(sin(ap), cos(ap));
  return (sc.y*p.x > sc.x*p.y) ? length(p - sc*r) : abs(length(p) - r);
}
float tube(float d2, float z){ return length(vec2(d2, z)) - RT; }
float letter(vec3 p, vec4 g, int k){
  vec3 q = p - vec3(g.x, g.y, 0.);
  float sy = g.z, sx = inversesqrt(sy);                    // 压扁时横向胀开，体积不变
  q.y /= sy; q.xz /= sx; q.y -= RT;
  float bs = length(q - vec3(0.9, 1.8, 0.));
  if (bs > 9.) return (bs - 3.6)*min(sy, sx);              // 远处先用包围球粗估，省算（阈值要大：粗估偏小，会让远处软阴影的半影断成一条硬边）
  float d;
  if (k == 0) {
    d = tube(sdArc(q.xy, vec2(0., RL), RL, -0.5236, 2.0944), q.z);
    d = smin(d, tube(sdArc(q.xy, vec2(0., 2.*RL + RU), RU, 0.5236, 2.0944), q.z), 0.3);
    d = smin(d, tube(sdSeg(q.xy, vec2(0., 2.*RL), vec2(-0.28, 2.*RL)), q.z), 0.2);
  } else {
    float H = 2.*(RL + RU);
    d = tube(sdSeg(q.xy, vec2(0.), vec2(0., H)), q.z);
    d = smin(d, tube(sdArc(q.xy, vec2(0.25, H*.5), H*.5, 0., 1.5708), q.z), 0.35);
    d = smin(d, tube(min(sdSeg(q.xy, vec2(0.), vec2(0.25, 0.)), sdSeg(q.xy, vec2(0., H), vec2(0.25, H))), q.z), 0.35);
  }
  return d*min(sy, sx);
}
vec2 mapS(vec3 p){                                          // (距离, 材质 1 字 / 2 铬)
  vec2 r = vec2(letter(p, uG3, 0), 1.);
  float dD = letter(p, uGD, 1); if (dD < r.x) r = vec2(dD, 1.);
  float db = length(p - vec3(uBall.x, uBall.y + RB, uBall.z)) - RB; if (db < r.x) r = vec2(db, 2.);
  return r;
}
float mapD(vec3 p){ return mapS(p).x; }
vec2 boxT(vec3 ro, vec3 rd, vec3 mn, vec3 mx){
  vec3 iv = 1./rd, a = (mn - ro)*iv, b = (mx - ro)*iv, n = min(a, b), f = max(a, b);
  return vec2(max(max(n.x, n.y), n.z), min(min(f.x, f.y), f.z));
}
const vec3 BMIN = vec3(-3.4, -0.3, -2.6), BMAX = vec3(4.9, 19., 0.8);   // 高到能装下还在半空的字（影子才不被切）
float traceS(vec3 ro, vec3 rd, float tmax, out float mat){
  mat = 0.;
  vec2 tb = boxT(ro, rd, BMIN, BMAX);
  if (tb.x > tb.y || tb.y < 0.) return -1.;
  float t = max(tb.x, 0.), tf = min(tb.y, tmax);
  for (int i = 0; i < 96; i++) {
    vec2 h = mapS(ro + rd*t);
    if (h.x < 0.0012*t) { mat = h.y; return t; }
    t += h.x;
    if (t > tf) break;
  }
  return -1.;
}
vec3 nrm(vec3 p){
  const vec2 e = vec2(1., -1.)*0.0015;
  return normalize(e.xyy*mapD(p + e.xyy) + e.yyx*mapD(p + e.yyx) + e.yxy*mapD(p + e.yxy) + e.xxx*mapD(p + e.xxx));
}

/* ━━ T5 光照分项：每一项单独一个函数，对比镜用 uTerms 逐项打开 ━━ */
// T5a 天光：上方粉紫、下方是珠毯反上来的桃色
vec3 hemi(vec3 n, vec3 sky, vec3 bounce){ return mix(bounce*0.5, sky*0.95, n.y*.5 + .5); }
// 有色 AO：被遮住的地方往暖深色走，不往灰走
vec3 aoTint(float ao, vec3 dark){ return mix(dark, vec3(1.), ao); }
// T5b 半影软阴影：朝柔光箱步进主体 SDF，按「离擦边多近」给半影；先用包围盒排除，不碰主体的点直接 1
float softShadow(vec3 ro, vec3 rd){
  vec2 tb = boxT(ro, rd, BMIN, BMAX);
  if (tb.x > tb.y || tb.y < 0.) return 1.;
  float res = 1., t = max(tb.x, 0.02), ph = 1e10;
  for (int i = 0; i < 40; i++) {
    float h = mapD(ro + rd*t);
    float y = h*h/(2.*ph), d = sqrt(max(h*h - y*y, 0.));
    res = min(res, 6.*d/max(t - y, 1e-4));
    ph = h; t += clamp(h, 0.03, 1.2);                      // 步长上限放宽：半空的字也能走到
    if (res < 0.003 || t > tb.y) break;
  }
  res = clamp(res, 0., 1.);
  return res*res*(3. - 2.*res);
}
// T5c AO：沿法线取 5 个点，看离主体和珠毯表面多近（珠毯用高度场近似）
float calcAO(vec3 p, vec3 n){
  float occ = 0., sca = 1.;
  for (int i = 0; i < 5; i++) {
    float h = 0.03 + 0.15*float(i);
    vec3 q = p + n*h;
    float d = min(mapD(q), q.y - (2.*R*0.9 + disp(q.xz)));
    occ += (h - d)*sca; sca *= 0.78;
  }
  return clamp(1. - 1.7*occ, 0., 1.);
}
// T5c'' 珠毯上的点只问主体（字和球）离得多近，珠毯自己的遮蔽交给解析 AO
float aoSubject(vec3 p, vec3 n){
  float occ = 0.;
  for (int i = 0; i < 4; i++) { float h = 0.08 + 0.22*float(i); occ += max(h - mapD(p + n*h), 0.)/h/float(i + 1); }
  return clamp(1. - 0.85*occ, 0., 1.);
}
// T5e 柔光箱环境：反射向量查一间程序化摄影棚——渐变墙 + 主柔光箱（圆角矩形）+ 右后细灯带
vec3 envMap(vec3 d, float rough){
  vec3 col = mix(uHoriz, uZen, smoothstep(0., 0.7, d.y));
  col = mix(col, uCarpet*0.85, smoothstep(0.02, -0.3, d.y));       // 下半球：珠毯反上来的颜色
  float fz = dot(d, LDIR);
  if (fz > 0.) {
    vec3 ax = normalize(cross(vec3(0., 1., 0.), LDIR)), ay = cross(LDIR, ax);
    vec2 q = abs(vec2(dot(d, ax), dot(d, ay))/fz) - vec2(0.5, 0.34);
    float sd = length(max(q, 0.)) + min(max(q.x, q.y), 0.) - 0.1;
    col += (1. - smoothstep(-0.03 - rough, 0.03 + rough, sd))*uSoftbox*(1. - rough*0.7);
  }
  float f2 = dot(d, vec3(0.80, 0.42, 0.43));
  col += smoothstep(0.986 - rough*0.4, 0.997, f2)*uStrip;
  return col;
}
float fresnel(vec3 n, vec3 rd, float f0){ return f0 + (1. - f0)*pow(1. - clamp(dot(n, -rd), 0., 1.), 5.); }

vec3 shadeLetter(vec3 p, vec3 n, vec3 rd, bool full){
  vec3 alb = uHero;
  float ndl = dot(n, LDIR);
  vec3 w = uWrap*uTerms.w;                                  // T5a' 分通道 wrap：暖通道绕得更远 → 交界偏暖偏深，像膜里透着光
  vec3 dif = clamp((ndl + w)/(1. + w), 0., 1.);
  float sh = full ? mix(1., softShadow(p + n*0.02, LDIR), uTerms.x) : 1.;
  float ao = full ? mix(1., calcAO(p, n), uTerms.y) : 1.;
  vec3 col = alb*(uKey*dif*sh*0.9 + hemi(n, uSky, uBounce)*aoTint(ao, uAOc)*0.75);
  // T5d 透光：背光处薄的地方透出更饱和的同色（uSss）
  float back = clamp(dot(-n, LDIR)*0.5 + 0.5, 0., 1.);
  col += alb*alb*uSss*back*back*0.5*uTerms.w*ao;
  // T5e 亮面：菲涅耳 × 柔光箱反射
  vec3 r = reflect(rd, n);
  col += envMap(r, 0.02)*fresnel(n, rd, 0.05)*mix(1., ao, 0.7)*uTerms.z;
  return col;
}
vec3 shadeCarpet(vec3 ro, vec3 rd, float t, vec3 cen, vec2 cell, float kind, bool full){
  vec3 p = ro + rd*t;
  if (kind == 2.) return uGap*(hemi(vec3(0., 1., 0.), uSky, uBounce)*0.32 + uKey*0.06*uTerms.x + 0.12*(1. - uTerms.y));
  float r = kind == 4. ? R*0.62 : R;
  vec3 n = normalize(p - cen);
  if (kind == 3.) {                                         // 远处假珠：平面上按格子算一个球面法线（凹凸贴图式 LOD）
    vec2 l = fract(p.xz/CS) - .5; cell = floor(p.xz/CS);
    n = normalize(vec3(l.x, sqrt(max(0.2 - dot(l, l), 0.02)), l.y));
  }
  float hs = hash2(cell);
  float dw = length((cell + .5)*CS) + hs*1.6;               // 颜色波：按离中心的距离 + 一点随机，前沿毛一点
  float lav = uWave > 0. ? smoothstep(uWave + 0.7, uWave - 0.7, dw) : 0.;
  vec3 alb = mix(uCarpet, uWaveC, lav)*(0.93 + 0.12*hs);
  if (kind == 4.) alb = mix(uLoose, uCarpet, lav*0.6);
  // T5c' 珠子的解析 AO：下半边朝着缝，越往下越暗；被压进坑里的再暗一些
  float aoS = mix(0.08, 1., smoothstep(-0.55, 0.85, n.y));
  aoS *= 1. - 0.6*pow(max(abs(n.x), abs(n.z)), 4.);        // 朝前后左右邻珠的那几面贴得最近，压一道暗缝 → 一串串珠子分得开
  if (kind != 3.) aoS *= 1. - 0.55*clamp(-(cen.y - R)*5., 0., 1.)*(1. - n.y*.5);
  float aoL = 1.;
  if (full && uTerms.y > 0.) { vec2 tb = boxT(p, n, BMIN - 1.2, BMAX + 1.2); if (tb.x < 0.01 && tb.y > 0.) aoL = aoSubject(p, n); }
  float ao = mix(1., aoS*aoL, uTerms.y);
  float dif = clamp((dot(n, LDIR) + 0.12)/1.12, 0., 1.);
  float sh = (full && uTerms.x > 0.) ? mix(1., softShadow(p + n*0.02, LDIR), uTerms.x) : 1.;
  vec3 col = alb*(uKey*dif*sh + hemi(n, uSky, uBounce)*aoTint(ao, uAOc)*0.8);
  col += envMap(reflect(rd, n), 0.12)*fresnel(n, rd, 0.05)*ao*mix(0.35, 1., sh)*uTerms.z;   // 缎面珠光
  col += uKey*pow(max(dot(n, normalize(LDIR - rd)), 0.), 48.)*1.1*sh*uTerms.z;             // 每颗珠上那颗小亮点
  return col;
}
/* ━━ T6 铬球：解析反射；反射光线再走一次 DDA，照出珠毯和字 ━━ */
vec3 shadeChrome(vec3 p, vec3 n, vec3 rd){
  vec3 r = reflect(rd, n), o = p + n*0.03, c = envMap(r, 0.);
  float m, ts = traceS(o, r, 40., m);
  if (ts > 0. && m < 1.5) { vec3 q = o + r*ts; c = shadeLetter(q, nrm(q), r, false); }
  else if (r.y < 0.) {
    vec3 cen; vec2 cell; float kind;
    float tc = traceCarpet(o, r, 24, cen, cell, kind);
    if (tc > 0.) c = shadeCarpet(o, r, tc, cen, cell, kind, false);
  }
  c *= 1. - 0.85*exp(-r.y*r.y*90.);                       // 地平线一圈暗带（摄影棚的黑旗），铬才有轮廓
  c *= 1. - 0.68*smoothstep(0.05, 0.5, r.y)*(1. - smoothstep(0.9, 0.99, dot(r, LDIR)));   // 上半球压暗，只留柔光箱
  c *= 1. - 0.7*smoothstep(0.02, 0., abs(dot(r, normalize(vec3(1., 0.2, -0.4)))));          // 一道竖向暗反光
  float ao = mix(1., calcAO(p, n), uTerms.y);
  c = c*c*1.5;                                              // 线性空间里平方：铬要的是高反差
  return c*uChrome*(0.5 + 0.5*fresnel(n, rd, 0.55))*aoTint(ao, uAOc);
}
vec3 sky(vec3 rd){ return mix(uHoriz, uZen, smoothstep(-0.02, 0.3, rd.y)); }

void main(){
  vec2 ndc = gl_FragCoord.xy/uRes*2. - 1.;
  vec3 rd = normalize(uCamF + (ndc.x*uRes.x/uRes.y*uLens.x + uLens.y)*uCamR + (ndc.y*uLens.x + uLens.z)*uCamU);
  vec3 ro = uCamPos, cen; vec2 cell; float kind, mat;
  float tc = traceCarpet(ro, rd, uMaxC, cen, cell, kind);
  float ts = traceS(ro, rd, tc > 0. ? tc : 300., mat);
  vec3 col; float t;
  if (ts > 0.) { t = ts; vec3 p = ro + rd*t, n = nrm(p); col = mat < 1.5 ? shadeLetter(p, n, rd, true) : shadeChrome(p, n, rd); }
  else if (tc > 0.) { t = tc; col = shadeCarpet(ro, rd, t, cen, cell, kind, true); }
  else { t = 500.; col = sky(rd); }
  /* ━━ T7 雾与弥散圈：远处入粉雾；CoC 带符号（前景负、远景正）写进 alpha ━━ */
  col = mix(col, uHaze, 1. - exp(-max(t - uFocus*1.2, 0.)*0.017));
  float coc = (t - uFocus)/t*uAperture;
  coc = clamp(coc > 0. ? coc*0.6 : coc, -1., 1.);            // 远景虚得温和些，前景虚得狠（长焦近景的观感）
  fragColor = vec4(col/(1. + col), coc*.5 + .5);              // 颜色压进 0–1（解码见后期）
}`;

/* ━━ T8 后期：金角螺旋景深 + mip 辉光 + 前景光斑 + ACES + 暗角 + 颗粒 ━━ */
const POST_FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2 uSrc, uOut;
uniform float uMaxR, uTime;
uniform int uTaps;
uniform vec3 uOrb;          // 前景光斑的颜色
uniform vec4 uGrade;        // 后期调色：rgb 乘色 + 饱和度
vec3 dec(vec3 e){ return e/max(1. - e, 1e-3); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03))/(x*(2.43*x + .59) + .14), 0., 1.); }
void main(){
  vec2 uv = gl_FragCoord.xy/uOut;
  vec4 c0 = texture(uTex, uv);
  float s0 = c0.a*2. - 1., size0 = abs(s0)*uMaxR;
  vec3 col = dec(c0.rgb); float tot = 1.;
  // 景深：等面积金角螺旋取样；样本的弥散圈盖得到这个距离才算数；比中心远的样本最多糊到中心的 2 倍——前景能糊过焦内，焦内不糊进背景
  for (int i = 0; i < 48; i++) {
    if (i >= uTaps) break;
    float fi = float(i), rad = uMaxR*sqrt((fi + .5)/float(uTaps)), ang = fi*2.39996323;
    vec4 s = texture(uTex, uv + vec2(cos(ang), sin(ang))*rad/uSrc);
    float ss = s.a*2. - 1., size = abs(ss)*uMaxR;
    if (ss > s0) size = min(size, size0*2.);
    col += mix(col/tot, dec(s.rgb), smoothstep(rad - .5, rad + .5, size)); tot += 1.;
  }
  col /= tot;
  // 辉光：取低层 mip 当作已经模糊过的图，只留亮部
  vec3 g = dec(textureLod(uTex, uv, 3.).rgb)*.6 + dec(textureLod(uTex, uv, 5.).rgb)*.4;
  col += max(g - 0.85, 0.)*0.4;
  // 前景虚化光斑：几颗很淡的粉紫圆斑慢慢飘
  vec2 a = vec2(uOut.x/uOut.y, 1.);
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    vec2 c = vec2(fract(.13 + fi*.381 + uTime*.004*(1. + fi*.3)), fract(.2 + fi*.517 + uTime*.007*(.6 + fi*.2)));
    float r = .018 + .014*fract(fi*.73), d = length((uv - c)*a);

  col *= 0.95;
  float L = dot(col, vec3(.2126, .7152, .0722));
  vec3 cl = col*aces(vec3(L)).x/max(L, 1e-4);
  col = mix(aces(col), cl/max(1., max(cl.r, max(cl.g, cl.b))), .55);
  col = max(mix(vec3(dot(col, vec3(.2126, .7152, .0722))), col, uGrade.w), 0.)*uGrade.rgb;
  vec2 q = (uv - .5)*a;
  col *= mix(1., .8, smoothstep(.45, 1.15, length(q)));
  col = pow(col, vec3(1./2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime*7.)*91.) - .5)*.025;
  fragColor = vec4(col, 1.);
}`;

/* ━━ T1 相机：基向量 + 移轴；JS 用同一套公式把三维点投到屏幕 ━━ */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const nrmz = a => { const l = Math.hypot(...a); return a.map(v => v / l); };
function camera(tg, dist, yaw, pitch, fovDeg, shiftY) {
  const F = [Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)];
  const Rr = nrmz([F[2], 0, -F[0]]);
  const U = [F[1] * Rr[2] - F[2] * Rr[1], F[2] * Rr[0] - F[0] * Rr[2], F[0] * Rr[1] - F[1] * Rr[0]];
  const tanF = Math.tan(fovDeg * Math.PI / 360);
  return { pos: tg.map((v, k) => v - F[k] * dist), F, R: Rr, U, tanF, sx: 0, sy: shiftY * tanF, focus: dist };
}
function project(c, p, W, H) {               // 和着色器里求光线方向的式子互逆
  const v = sub(p, c.pos), z = dot(v, c.F);
  const nx = (dot(v, c.R) / z - c.sx) / (c.tanF * W / H), ny = (dot(v, c.U) / z - c.sy) / c.tanF;
  return [(nx * .5 + .5) * W, (.5 - ny * .5) * H];
}

/* ━━ T10 动画：落下（预备—拉长—压扁—回弹）+ 读数 ━━ */
const CS = 0.6, REST = 0.4, DROP = 11.5, G3X = -1.75, GDX = 0.5, BALL = [3.95, 0.3, -1.55];
function fall(t, ti, heavy) {
  if (t < ti - 0.5) { const a = Math.sin(Math.PI * seg(t, ti - 0.85, ti - 0.5)); return { y: REST + DROP + .35 * a, sy: 1 + .05 * a, press: 0 }; }
  if (t < ti) { const u = (t - ti + .5) / .5; return { y: REST + DROP * (1 - u * u), sy: 1 + .14 * u * u, press: 0 }; }
  const k = t - ti;
  return { y: REST + (heavy ? .22 : .6) * Math.exp(-5 * k) * Math.abs(Math.sin(7 * k)),
    sy: heavy ? 1 : 1 - .3 * Math.exp(-6.5 * k) * Math.cos(15 * k),
    press: Math.min(1, k / .07) * (1 + .35 * Math.exp(-5 * k) * Math.cos(12 * k)) };
}
const rest = { y: REST, sy: 1, press: 1 };
function pressJS(x, z, cx, hw, a) { const dx = Math.max(Math.abs(x - cx) - hw, 0), d = Math.hypot(dx, z * 1.5); return a * (-.28 * Math.exp(-d * d * 1.7)); }
function countPressed(st) {                  // 和着色器同一个压坑函数：坑深超过半颗珠的 1/4 算「被压下」
  let n = 0;
  for (let x = -14; x < 14; x++) for (let z = -11; z < 8; z++) {
    const cx = (x + .5) * CS, cz = (z + .5) * CS, db = Math.hypot(cx - BALL[0], cz - BALL[2]);
    const h = pressJS(cx, cz, G3X, .55, st.g3.press) + pressJS(cx, cz, GDX + .6, .62, st.gd.press) - st.ball.press * .3 * Math.exp(-db * db * 2.4);
    if (h < -.07) n++;

}
function state(i, t, portrait) {
  const st = { g3: rest, gd: rest, ball: { y: BALL[1], press: 1 }, rip: [], wave: -1, terms: [1, 1, 1, 1], dof: 1 };
  let cam;
  if (i === 0) {
    const k = ease.inOut(clamp(t / 6.7));
    cam = [[.15, 2.1, 0], 21 - 2.2 * k, -.1 + .06 * k, .2];
  } else if (i === 1) {
    st.g3 = fall(t, 1.0); st.gd = fall(t, 1.9);
    const b = fall(t, 2.9, true); st.ball = { y: b.y - REST + BALL[1], press: b.press * 1.2 };
    [[G3X, 0, 1.0, .2], [GDX + .6, 0, 1.9, .2], [BALL[0], BALL[2], 2.9, .26]].forEach(r => { if (t > r[2]) st.rip.push([r[0], r[1], t - r[2], r[3]]); });
    const k = ease.inOut(clamp(t / 6.5));
    cam = [[.4, 1.4, -.3], 23.5, .13 - .07 * k, .3];
  } else {
    st.terms = [seg(t, .6, 1.0), seg(t, 1.3, 1.7), seg(t, 2.0, 2.4), seg(t, 2.0, 2.4)];
    st.dof = seg(t, 2.7, 3.1);
    st.wave = t > 3.4 ? (t - 3.4) * 12 : -1;
    const k = ease.inOut(clamp(t / 6.7));
    cam = [[.2, 2.0, 0], 20.5, -.02 - .16 * k, .23];
  }
  const [tg, dist, yaw, pitch] = cam;
  st.cam = portrait ? camera([tg[0] + .45, tg[1] + .1, tg[2]], dist * 1.36, yaw, pitch + .05, 44, -.3)
                    : camera(tg, dist, yaw, pitch, 30, -.05);
  return st;
}

/* ━━ T9 WebGL 管线：两遍渲染、自适应分辨率、状态不变不重画 ━━ */
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
const strip = s => s.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '');   // 去掉中文注释再编译
function prog(fs) {
  const p = gl.createProgram();
  [[gl.VERTEX_SHADER, '#version 300 es\nin vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}'], [gl.FRAGMENT_SHADER, strip(fs)]].forEach(([ty, src]) => {
    const s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  });
  gl.bindAttribLocation(p, 0, 'aP'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let k = 0; k < n; k++) { const nm = gl.getActiveUniform(p, k).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}
/* 配色 → 着色器 uniform：sRGB 的颜色先转线性；光强和系数原样传 */
const lin = c => c.map(v => Math.pow(v, 2.2));
const G = PAL.gl, GLPAL = { uCarpet: lin(G.carpet), uWaveC: lin(G.wave), uLoose: lin(G.loose), uGap: lin(G.gap), uHero: lin(G.hero),
  uHoriz: lin(G.horiz), uZen: lin(G.zen), uHaze: lin(G.haze), uSky: lin(G.sky), uBounce: lin(G.bounce),
  uAOc: G.aoTint, uKey: G.key, uSoftbox: G.softbox, uStrip: G.strip, uWrap: G.wrap, uSss: G.sss, uChrome: G.chrome };
const R3 = { ok: false, scale: 1, key: '', ema: 16, n: 0, frames: 0 };
try {
  if (!gl) throw new Error('no webgl2');
  R3.scene = prog(SCENE_FS); R3.post = prog(POST_FS);
  R3.half = !!gl.getExtension('EXT_color_buffer_float');
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  R3.tex = gl.createTexture(); R3.fbo = gl.createFramebuffer();
  R3.ok = true;
} catch (e) { R3.ok = false; R3.err = String(e.message || e); }

function sizeTargets(S) {
  const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  if (!R3.ok) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); return; }
  if (!R3.base) { R3.base = S.portrait ? .5 : .72; R3.scale = R3.base; }
  cv.width = Math.round(W * Math.min(dpr, 1.5)); cv.height = Math.round(H * Math.min(dpr, 1.5));
  R3.sw = Math.max(64, Math.round(W * dpr * R3.scale)); R3.sh = Math.max(64, Math.round(H * dpr * R3.scale));
  gl.bindTexture(gl.TEXTURE_2D, R3.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, R3.half ? gl.RGBA16F : gl.RGBA8, R3.sw, R3.sh, 0, gl.RGBA, R3.half ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R3.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, R3.tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  document.getElementById('res').textContent = 'RES ' + R3.scale.toFixed(2) + '×';
}
function renderGL(st, time, S) {
  const s = R3.scene, u = s.u, c = st.cam, mob = S.portrait;
  gl.bindFramebuffer(gl.FRAMEBUFFER, R3.fbo); gl.viewport(0, 0, R3.sw, R3.sh); gl.useProgram(s.p);
  gl.uniform2f(u.uRes, R3.sw, R3.sh);
  gl.uniform3fv(u.uCamPos, c.pos); gl.uniform3fv(u.uCamR, c.R); gl.uniform3fv(u.uCamU, c.U); gl.uniform3fv(u.uCamF, c.F);
  gl.uniform3f(u.uLens, c.tanF, c.sx, c.sy);
  gl.uniform1f(u.uFocus, c.focus); gl.uniform1f(u.uAperture, mob ? 2.0 : 2.4); gl.uniform1f(u.uWave, st.wave);
  gl.uniform4f(u.uG3, G3X, st.g3.y, st.g3.sy, st.g3.press);
  gl.uniform4f(u.uGD, GDX, st.gd.y, st.gd.sy, st.gd.press);
  gl.uniform4f(u.uBall, BALL[0], st.ball.y, BALL[2], st.ball.press);
  const rip = new Float32Array(12); st.rip.forEach((r, k) => rip.set(r, k * 4)); gl.uniform4fv(u.uRip, rip);
  gl.uniform4fv(u.uTerms, st.terms);
  for (const k in GLPAL) gl.uniform3fv(u[k], GLPAL[k]); gl.uniform1i(u.uMaxC, mob ? 84 : 128);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const p = R3.post, v = p.u;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height); gl.useProgram(p.p);
  gl.uniform1i(v.uTex, 0); gl.uniform2f(v.uSrc, R3.sw, R3.sh); gl.uniform2f(v.uOut, cv.width, cv.height);
  const maxR = (mob ? 8 : 13) * R3.scale / .72 * st.dof;
  gl.uniform3fv(v.uOrb, PAL.gl.orb); gl.uniform4fv(v.uGrade, PAL.gl.grade);
  gl.uniform1f(v.uMaxR, maxR); gl.uniform1i(v.uTaps, maxR < .6 ? 0 : (mob ? 24 : 36)); gl.uniform1f(v.uTime, time);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function adapt(S) {                           // 帧时长期超 26ms 就降一档分辨率，很快就升回一点
  const now = performance.now();
  if (R3.lastT) R3.ema = R3.ema * .9 + Math.min(100, now - R3.lastT) * .1;
  R3.lastT = now;
  if (++R3.n < 45) return;
  R3.n = 0;
  if (R3.ema > 26 && R3.scale > .34) { R3.scale *= .85; sizeTargets(S); }
  else if (R3.ema < 13 && R3.scale < R3.base) { R3.scale = Math.min(R3.base, R3.scale * 1.08); sizeTargets(S); }
}

/* ━━ T12 退路：拿不到 WebGL2，用 Canvas 2D 画一张静态近似（天、成排带明暗的珠、粉色亮面字）━━ */
function drawFallback(S) {
  const x = cv.getContext('2d'), W = cv.width, H = cv.height, P = S.portrait;
  const hz = H * (P ? .2 : .2), f = H * (P ? 1.1 : 1.7), camH = 4.2, cx = W * (P ? .5 : .52);
  const C = (c, k = 1, w = 0) => `rgb(${c.map(v => Math.round(255 * Math.min(1, v * k + w * (1 - v * k)))).join(',')})`;   // 配色 → CSS 色：k 压暗，w 往白里提
  const P0 = PAL.gl, cs = getComputedStyle(document.documentElement), cv_ = n => cs.getPropertyValue('--' + n).trim();
  let g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C(P0.zen)); g.addColorStop(hz / H, C(P0.horiz)); g.addColorStop(1, C(P0.carpet, .95));
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const row = (z) => {                                  // 一排珠：越远越小、越淡（雾）
    const r = .276 * f / z, y = hz + camH * f / z - r, sp = .6 * f / z, fog = Math.min(1, z / 50);
    x.globalAlpha = 1 - fog * .8;
    for (let px = cx - Math.ceil(cx / sp + 1) * sp; px < W + sp; px += sp) {
      const rg = x.createRadialGradient(px - r * .3, y - r * .4, r * .05, px, y, r);
      rg.addColorStop(0, C(P0.carpet, 1, .8)); rg.addColorStop(.35, C(P0.carpet)); rg.addColorStop(.8, C(P0.carpet, .8)); rg.addColorStop(1, C(P0.carpet, .6));
      x.fillStyle = rg; x.beginPath(); x.arc(px, y, r, 0, 7); x.fill();
    }
  };
  const zL = 24;
  for (let z = 70; z > zL; z -= .6) row(z);
  const fs = P ? W * .48 : H * .36, ty = hz + camH * f / zL - fs * .02;   // 字：粉色渐变 + 深描边 + 两道高光 + 接触阴影
  x.globalAlpha = .45; x.fillStyle = C(P0.gap); x.beginPath(); x.ellipse(cx, ty, fs * .78, fs * .06, 0, 0, 7); x.fill(); x.globalAlpha = 1;
  x.font = `900 ${fs}px "Arial Rounded MT Bold","Arial Black",sans-serif`; x.textAlign = 'center'; x.lineJoin = 'round';
  g = x.createLinearGradient(0, ty - fs * .75, 0, ty); g.addColorStop(0, cv_('hero-hi')); g.addColorStop(.55, cv_('hero')); g.addColorStop(1, cv_('hero-lo'));
  x.lineWidth = fs * .05; x.strokeStyle = cv_('hero-lo'); x.strokeText('3D', cx, ty); x.fillStyle = g; x.fillText('3D', cx, ty);
  x.fillStyle = 'rgba(255,255,255,.6)';
  [[-.42, -.6, .11], [.18, -.62, .09]].forEach(([a, b, w]) => { x.beginPath(); x.ellipse(cx + fs * a, ty + fs * b, fs * w, fs * .035, -.5, 0, 7); x.fill(); });
  for (let z = zL; z > 8; z -= .6) row(z);
  x.globalAlpha = 1;
}

/* ━━ T11' 引线标注、读数、分项胶囊：跟着镜头和状态走 ━━ */
const $ = id => document.getElementById(id);
const el = { lock: $('lock'), read: $('read'), rn: $('rn'), lead: $('lead'), lp: $('lp'), la: $('la'), lr: $('lr'), tag: $('tag'), chips: $('chips'), frm: $('frm') };
function overlay(i, t, st, S) {
  const W = innerWidth, H = innerHeight;
  el.lock.classList.toggle('on', i === 0);
  const showRead = i === 1 && t > 1.0;
  el.read.classList.toggle('on', showRead);
  if (i === 1) el.rn.textContent = String(countPressed(st)).padStart(3, '0');
  const showTag = i === 1 && t > 1.35;
  el.lead.classList.toggle('on', showTag); el.tag.classList.toggle('on', showTag);
  if (i === 1) {
    const a = project(st.cam, [G3X - .35, .8, -.55], W, H);
    const tw = el.tag.offsetWidth || 190, th = el.tag.offsetHeight || 60;
    const lx = clamp(a[0] - (S.portrait ? 60 : 230), 12, W - tw - 12), ly = clamp(a[1] + (S.portrait ? 70 : 64), 70, H - th - (S.portrait ? 150 : 28));
    const k = ease.out(seg(t, 1.35, 1.85)), ex = lx + tw / 2, ey = ly;
    const mx = a[0] + (ex - a[0]) * .35, my = ey;
    el.lp.setAttribute('d', `M${a[0]},${a[1]} L${a[0] + (mx - a[0]) * Math.min(1, k * 2)},${a[1] + (my - a[1]) * Math.min(1, k * 2)}` + (k > .5 ? ` L${mx + (ex - mx) * (k * 2 - 1)},${my}` : ''));
    el.la.setAttribute('cx', a[0]); el.la.setAttribute('cy', a[1]);
    el.lr.setAttribute('cx', a[0]); el.lr.setAttribute('cy', a[1]); el.lr.setAttribute('r', 6 + 8 * ((t * 1.2) % 1)); el.lr.style.opacity = 1 - (t * 1.2) % 1;
    el.tag.style.transform = `translate(${lx}px,${ly}px)`;
  }
  el.chips.classList.toggle('on', i === 2);
  if (i === 2) [...el.chips.children].forEach((c, k) => c.classList.toggle('on', k === 0 || (k === 4 ? st.dof : st.terms[k - 1]) > .5));
}

/* ━━ 镜头：三镜循环；每镜一句画面写在 draw 前 ━━ */
let startOf = [0, 6.7, 13.2];
function draw(i) {
  return (t, p, S) => {
    const st = state(i, t, S.portrait), time = startOf[i] + t;
    el.frm.textContent = 'FRAME ' + String(Math.floor(time * 24)).padStart(4, '0');
    overlay(i, t, st, S);
    if (!R3.ok) return;
    const key = i + '|' + t.toFixed(3) + '|' + cv.width + 'x' + cv.height + '|' + R3.sw;
    if (key === R3.key) return;               // 暂停时不重画
    R3.key = key; renderGL(st, time, S);
    if (!S.reduce) adapt(S);
  };
}
const SHOTS = [
  // 镜1 海报：低机位，「3D」充气字立在桃色珠毯上，铬球在右前，前后都虚；镜头缓推
  // SHOT 01 / 03 · 海报 POSTER：三维渲染：软而有分量。低机位，前后虚，只有字是实的。
  { dur: 6.7, draw: draw(0) },
  // 镜2 讲解：字一个个落下——预备、拉长、压扁、压出坑、涟漪外传、回弹；读数跳；引线指向接触阴影
  // SHOT 02 / 03 · 落地 IMPACT：落下、压陷、回弹。字把珠子压出坑，涟漪一圈圈传开。
  { dur: 6.5, draw: draw(1) },
  // 镜3 对比：先只剩漫射，再逐项加软阴影、AO、边光高光、景深；最后颜色波把珠毯翻成薰衣草紫
  // SHOT 03 / 03 · 分层 LAYERS：光一层层叠上去。阴影、AO、边光、景深，少一层就假。
  { dur: 6.7, draw: draw(2) },
];
startOf = SHOTS.map((s, k) => SHOTS.slice(0, k).reduce((a, b) => a + b.dur, 0));

makePlayer(SHOTS, {
  onResize(S) { sizeTargets(S); if (!R3.ok) drawFallback(S); },
});
if (!R3.ok) document.getElementById('steps').textContent = 'STATIC · NO WEBGL2';
</script>
