<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拆解图鉴 · 样张</title>
<!--
风格：拆解图鉴 TEARDOWN GUIDE
一句话：把物件画成有质感的「照片」，膨胀出一圈粗白边、垫一层柔投影，像贴在淡薄荷绿的切割垫上；
        相机在一张超大画布上推拉平移，一路把东西拆开、标注、数清楚。
擅长表现：一件东西拆开以后「由什么组成、各有多少」——零件沿一根竖轴一层层弹开、每层拉一根引线说清是什么，
        再把每层的材质变成方块数一遍、按类别排成条；一个总数从 0 跳到答案。
搬到讲解里：
  ① 整只先立着、再沿竖轴一层层炸开 → 先给整体、再给结构：用在「这个东西由哪几层 / 几块组成」这类题
  ② 每层拉一根引线，中文 + 英文 + 材质方块三层标签 → 逐件说明「这一块是什么、干什么」：用在每个部分都要交代的题
  ③ 方块一个个亮、再按类别飞成横向条 → 给总数和占比：用在「一共有多少、哪类最多」的收尾
招牌细节：
  材质  淡薄荷绿切割垫 + 世界坐标里的刻线网格和刻度（相机动，刻线跟着动）+ 极淡噪点 + 四角十字套准标
  光    窗光从左上来：一片斜光带在垫子上慢慢漂；物件统一顶光，顶边一条高光、底边压暗；白边外两层投影（贴地一层、柔一层）
  主体  每层都有大形—中细节—微细节：网布孔眼的明暗、泡棉气孔的凹光、橡胶大底的菱纹、金属鞋眼的环、缝线
  字    松针黑粗大标题（系统黑体 + 同色描边加粗）+ 钴蓝马克笔下划线（毛边多边形）
  标注  引线三层：物件上白心圆点 → 折线 → 中文粗体 / 字距拉开的英文小字 / 钴蓝胶带条小标 + 条下中文小字
  动效  零件错峰弹出（过冲回落）、方块逐个点亮 + 大数字逐个跳、方块按类别飞成横向条形图
  相机  超大画布上推拉平移，快移加运动模糊；中途拉远露出整张画布
  角落  ■ 钴蓝小方块、NO.07、FIG.01、切割垫刻度和坐标小字
色彩结构（换题保留）：四个角色。
  底 = 一种低饱和的垫子 / 纸色，上面一层同色系的刻线；和白边要拉开明度：浅底比白暗一档，暗底越深越好。
  主角 = 物件自己的材质色，全部受光（顶光渐变 + 一条高光 + 底部压暗），是画面里唯一色彩丰富的东西；配色里只给底色，
         明暗由「受光配方」ramp() 生成，所以换色不丢光。
  线和字 = 一种和底反差最大的中性墨色。
  强调 = 一种高饱和色，只用在：马克笔下划线、胶带条小标、■ 小标、答案数字变贴纸那一下。
  白边永远是白（或暖白）；投影用底色的最暗一档。底亮底暗不写死，由现场的光定：白天桌面浅底，夜里台灯下深底。
本例配色（从本例主体「橙色网布跑鞋，白泡棉中底，深灰橡胶大底」和它的现场「白天的薄荷绿切割垫」推出来，换题就换）：
  paper #d3ebdf 薄荷切割垫 / ink #12332d 松针墨 / accent #2a4fd6 钴蓝（胶带条、下划线）
  upper #f07a2e 橙网布 / foam #f4efe3 泡棉 / rubber #262c36 橡胶 / lace #f6f1e6 鞋带 / metal #aeb7c0 鞋眼
换题示例（?pal=alt）：假设主角是「一顶黄色安全帽」、现场是「夜里台灯下的深蓝灰垫板」→ 底取垫板的深蓝灰、刻线取浅蓝；
  帽壳 = 受光的黄、衬垫 = 米白泡棉、帽带 = 黑橡胶；台灯的琥珀色是唯一强调色；字和胶带条用暖白，投影加深。
  paper #1f2b3a / ink #eef2f6 / accent #ffb020 / upper #f4c542 帽壳 / foam #e8dfcc 衬垫 / rubber #20242c 帽带
字：标题 = 系统黑体 600 + 同色 stroke 加粗（paint-order:stroke）；大数字 = "Avenir Next" 800 退 "Arial Black"；
    英文小标 = 同字体 600、letter-spacing .2em；正文 = 系统黑体；坐标 = 等宽
动效：back 过冲 + inOut；错峰 0.1–0.3 秒；相机移动 1–1.6 秒；60 帧连续
做粗了 → 做精：
  扁平图标贴白边 → 物件每层先画出材质（渐变 + 孔眼 / 气孔 / 菱纹 + 高光），再贴白边
  白边用 stroke 描 → feMorphology 膨胀整个剪影，任何形状一圈等宽，外加一道浅灰切边
  标签只有一行中文 → 中文粗体 + 英文小字 + 胶带条小标三层，引线有锚点和折角
  图表用默认柱子 → 柱子就是方块本身，从上一镜飞过来排队
  画面切换用淡入 → 在同一张大画布上移动相机，快移有运动模糊
手机竖屏：同一张画布换一套坐标：封面上字下物；拆解轴竖放，标签左右交替；网格 9 列、条形图标签在上
技法目录：
  T1 纸面：薄荷切割垫 + 世界刻线网格 + 十字套准 + 噪点暗角
  T2 贴纸滤镜：feMorphology 膨胀白边 + 切边 + 两层投影
  T3 写实物件：网布孔眼 / 泡棉气孔 / 橡胶菱纹 / 金属鞋眼 / 缝线的画法
  T4 标题：粗黑字 + 马克笔下划线
  T5 引线标注：锚点 → 折线 → 三层标签
  T6 相机：超大画布推拉平移 + 运动模糊 + 拉远揭示
  T7 方块计数：逐个点亮 + 大数字跳数 + 答案变钴蓝贴纸
  T8 重排成条形图：方块按类别飞位
  T0 配色：全片颜色只在下面 PALETTES 一处；?pal=alt 切换
-->
<script>
/* ━━ T0 配色：全片颜色只在这里（main 本例；?pal=alt 换题示例）。角色见文件头「色彩结构」；
   材质只给底色，明暗由下面的 ramp() 按顶光生成 ━━ */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体（跑鞋），不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  main: { paper: '#d3ebdf', dot: '#3f8b72', dotA: .26, ink: '#12332d', ink2: '#3c5e55', mute: '#6f9688', mute2: '#86aa9c', mark: '#5b8f7d', dash: '#7fb09e',
    accent: '#2a4fd6', accentInk: '#ffffff', tag: '#2a4fd6', tagAlt: '#12332d', tagInk: '#ffffff', under: '#46695f', anchor: '#ffffff',
    edge: '#ffffff', cut: '#b3cdc1', shadow: '#0f2b25', shadowK: 1, card: '#ffffff', cardInk: '#12332d', cardInk2: '#3c5e55', cardMute: '#6f9688',
    slot: '#e8f5ee', slotLine: '#9cc2b2', grainBlend: 'multiply', vig: .12,
    upper: '#f07a2e', trim: '#2b3340', foam: '#f4efe3', rubber: '#262c36', lace: '#f6f1e6', metal: '#aeb7c0', ins: '#8fb8c9', gel: '#6fd6e0', sun: '#ffffff' },
  alt: { paper: '#1f2b3a', dot: '#9db8d6', dotA: .2, ink: '#eef2f6', ink2: '#bdc9d6', mute: '#7f93a8', mute2: '#5f7389', mark: '#8ba3bd', dash: '#4f6680',
    accent: '#ffb020', accentInk: '#2a1a00', tag: '#ffb020', tagAlt: '#eef2f6', tagInk: '#2a1a00', under: '#9fb1c4', anchor: '#1f2b3a',
    edge: '#fbf8f0', cut: '#cfc8b8', shadow: '#05080d', shadowK: 2.4, card: '#f4f6f9', cardInk: '#1f2b3a', cardInk2: '#4a5a6c', cardMute: '#8696a8',
    slot: '#26354a', slotLine: '#3f5672', grainBlend: 'screen', vig: .45,
    upper: '#f4c542', trim: '#3a4250', foam: '#e8dfcc', rubber: '#20242c', lace: '#e7e1d2', metal: '#9aa6b4', ins: '#7fa6c9', gel: '#ffb020', sun: '#cfe4ff' },
};
const C = PALETTES[/[?&]pal=alt\b/.test(location.search) ? 'alt' : 'main'];
(() => {                                   // 把配色写进 CSS 变量，样式表里只引用变量
  const st = document.documentElement.style, rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(' ');
  const v = { paper: C.paper, ink: C.ink, shadow: rgb(C.shadow),
    'grain-blend': C.grainBlend, vig: C.vig };
  for (const k in v) st.setProperty('--' + k, v[k]);
})();
</script>
<style>
  :root { --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --disp:"Avenir Next","Helvetica Neue","Arial Black",Arial,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); }
  body { overflow:hidden; -webkit-font-smoothing:antialiased; }
  #stage { position:fixed; inset:0; }
  #stage > svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* ━━ T1 纸面：噪点和暗角放在不动的图层上，只渲染一次 ━━ */
  .grain, .vig { position:absolute; inset:0; pointer-events:none; will-change:transform; }
  .grain { opacity:.5; mix-blend-mode:var(--grain-blend); background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .52  0 0 0 0 .55  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vig { background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgb(var(--shadow) / var(--vig)) 100%); }

</style>
</head>
<body>
<main id="stage"></main>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const lerp = (a, b, e) => a + (b - a) * e;
const $ = (id, r = document) => r.querySelector('#' + id);
const set = (el, k, v) => { if (el && el.__c !== undefined && el.__c[k] === v) return; (el.__c = el.__c || {})[k] = v; el.setAttribute(k, v); };
const tr = (el, x, y, r = 0, s = 1) => set(el, 'transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`);

/* ━━ T2 贴纸滤镜：膨胀 SourceAlpha 出白边，外圈一道浅灰切边，下面两层投影 ━━
   参数：r 白边宽（物件自己的坐标单位）、soft 柔投影、lift 投影下移。任何形状都能套。 */
function stickerFilter(id, r = 8, soft = 14, lift = 12) {
  return `<filter id="${id}" x="-25%" y="-35%" width="150%" height="180%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="${r}" result="d"/>
    <feMorphology in="SourceAlpha" operator="dilate" radius="${r + 1.4}" result="d2"/>
    <feFlood flood-color="${C.cut}"/><feComposite in2="d2" operator="in" result="cut"/>
    <feFlood flood-color="${C.edge}"/><feComposite in2="d" operator="in" result="edge"/>
    <feGaussianBlur in="d2" stdDeviation="${soft}"/><feOffset dy="${lift}" result="b1"/>
    <feFlood flood-color="${C.shadow}" flood-opacity="${Math.min(.8, .20 * C.shadowK)}"/><feComposite in2="b1" operator="in" result="sh1"/>
    <feGaussianBlur in="d2" stdDeviation="${soft * .2}"/><feOffset dy="${lift * .25}" result="b2"/>
    <feFlood flood-color="${C.shadow}" flood-opacity="${Math.min(.8, .22 * C.shadowK)}"/><feComposite in2="b2" operator="in" result="sh2"/>
    <feMerge><feMergeNode in="sh1"/><feMergeNode in="sh2"/><feMergeNode in="cut"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>`;
}

const stops = a => a.map(([o, c, op]) => `<stop offset="${o}" stop-color="${c}"${op != null ? ` stop-opacity="${op}"` : ''}/>`).join('');
const lin = (id, a, v = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${v ? 0 : 1}" y2="${v ? 1 : 0}">${stops(a)}</linearGradient>`;
const rad = (id, a, fx = .5, fy = .5) => `<radialGradient id="${id}" fx="${fx}" fy="${fy}">${stops(a)}</radialGradient>`;
/* 受光配方：只给一个底色，按顶光位置生成明暗（HSL 里只动亮度，色相、饱和度跟底色走）。f > 0 提亮，f < 0 压暗 */
const hsl = h => { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l]; const d = mx - mn, s2 = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  return [(mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) / 6, s2, l]; };
const hex = (h, s2, l) => '#' + [0, 8, 4].map(n => { const k = (n + h * 12) % 12, a = s2 * Math.min(l, 1 - l);
  return Math.round((l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255).toString(16).padStart(2, '0'); }).join('');
const tone = (c, f) => { const [h, s2, l] = hsl(c); return hex(h, s2, f >= 0 ? l + (1 - l) * f : l * (1 + f)); };
const ramp = (c, a) => a.map(([o, f, op]) => [o, tone(c, f), op]);
/* ━━ T3 写实物件：渐变配方 + 材质图案 + 气孔 ━━
   跑鞋侧视，鞋头朝右，顶光。每一层先铺「受光渐变」，再叠一层材质图案（网布孔眼 / 菱纹 / 打孔），
   泡棉的气孔是程序撒的随机椭圆（带凹光），最后才贴白边。 */
/* 受光配方：只给一个底色，按顶光位置生成明暗（HSL 里只动亮度，色相、饱和度跟底色走）。f > 0 提亮，f < 0 压暗 */
const SLAB = [[0, .3], [.08, .14], [.35, 0], [.8, -.2], [1, -.34]];            // 侧面厚片：顶边亮、底边压暗
/* 形状（局部坐标，鞋头朝右，原点在鞋身中部） */
const UP = 'M-372 20L-376 -88Q-374 -136 -330 -139L-282 -140Q-205 -134 -158 -104Q-116 -92 -76 -128Q-52 -150 -22 -148Q68 -112 150 -62Q250 -34 330 -22Q386 -14 388 8L386 20Z';
const INS = 'M-352 14Q-362 -14 -300 -22L190 -30Q372 -30 376 8Q374 36 190 40L-296 42Q-350 42 -352 14Z';
const MID = 'M-382 66Q-386 44 -348 42L330 36Q398 38 404 84Q406 120 372 128L-300 134Q-384 136 -382 66Z';
const OUT = (() => { let d = 'M-382 140L376 132Q405 132 407 152L401 172', i = 0;
  for (let x = 372; x >= -330; x -= 18, i++) d += `L${x} ${i % 2 ? 173 : 181}`;   // 大底下沿的锯齿抓地纹
  return d + 'L-374 176Q-384 168 -382 140Z'; })();
const HEEL = 'M-372 20L-376 -88Q-374 -136 -330 -139L-282 -140Q-296 -60 -290 20Z';
const TOE = 'M298 -26Q350 -22 386 4Q390 20 386 20L292 20Q300 -4 298 -26Z';
const clipOf = (id, d) => `<clipPath id="${id}"><path d="${d}"/></clipPath>`;
/* 泡棉气孔：随机椭圆，一圈暗的凹 + 一道亮边，大小不一；seed 固定所以每次画面一样 */
function pores(clip, x0, y0, x1, y1, n, seed, big = 1) {
  let r = seed; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280; let s = '';
  for (let i = 0; i < n; i++) {
    const cx = lerp(x0, x1, rnd()), cy = lerp(y0, y1, rnd()), rx = (1.1 + rnd() * rnd() * 4.2) * big, ry = rx * (.55 + rnd() * .3);
    s += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="#3b2f22" fill-opacity="${(.14 + rnd() * .16).toFixed(2)}"/>` +
      `<ellipse cx="${(cx + rx * .3).toFixed(1)}" cy="${(cy + ry * .55).toFixed(1)}" rx="${(rx * .8).toFixed(1)}" ry="${(ry * .45).toFixed(1)}" fill="#fff" fill-opacity=".55"/>`;
  }
  return `<g clip-path="url(#${clip})">${s}</g>`;
}
const MATERIALS = [
  lin('gUp', ramp(C.upper, SLAB)), lin('gTrim', ramp(C.trim, SLAB)), lin('gFoam', ramp(C.foam, [[0, .3], [.1, .1], [.4, 0], [.85, -.14], [1, -.28]])),
  lin('gRub', ramp(C.rubber, [[0, .2], [.12, .1], [.4, 0], [1, -.3]])), lin('gIns', ramp(C.ins, [[0, .3], [.5, 0], [1, -.2]])),
  lin('gGel', ramp(C.gel, [[0, .5, .9], [.5, 0, .85], [1, -.2, .9]])),

      set(G.ulR, 'x', G.ulX[0]); set(G.ulR, 'width', (G.ulX[1] - G.ulX[0]) * ease.out(seg(t, .1, .6)));
      G.sl.forEach((s, i) => { const e = seg(t, 1.1 + i * .2, 1.5 + i * .2); set(s, 'opacity', e > 0 ? 1 : 0);
        const tt = LY.t, cx = tt.x + i * (tt.slotS + 10) + tt.slotS / 2, cy = tt.slot + tt.slotS / 2;
        set(s, 'transform', `translate(${cx} ${cy - 40 * (1 - ease.back(e))}) scale(${ease.back(e).toFixed(3)}) rotate(${((1 - e) * 15).toFixed(1)}) translate(${-cx} ${-cy})`); });
      drawCallouts(-9, 0, 99); hideCount(); drawBoard3(-9, 0, 1, 50, 60);
    } },
  // 镜2 · 02 拆开 / TEAR-DOWN · 一层一根引线：标签分三层：中文、英文、胶带条。
  { dur: 6.5,
    draw(t) {
      camAt(2 - 1, t);
      const e = ease.inOut(seg(t, .1, 1.2)), pose = flPose(e);
      const n = drawShoe(pose, 1.15, t, t > 2.3 ? t : null);
      set(G.sun, 'transform', `translate(${(Math.sin(t * .5 + 1) * 40).toFixed(1)} 0)`);
      drawCallouts(t, 2.35, 1.15); set(G.gl0, 'opacity', 0);
      set(G.axis, 'opacity', (.6 * ease.out(seg(t, 1.2, 2.2))).toFixed(3)); glint(G.gl1, 'outsole', 330, 176, t, 2.15);
      // 读数：一张贴纸 → 五张
      set(G.cnt, 'opacity', ease.out(seg(t, .9, 1.3)).toFixed(3));
      const v = String(1 + Math.min(4, n)); if (G.cntN.textContent !== v) { G.cntN.textContent = v; G.cntN.__bt = t; }
      const bt = t - (G.cntN.__bt || 0); set(G.cntN, 'transform', `translate(0 ${(-8 * Math.max(0, 1 - bt * 6)).toFixed(1)})`);
      drawBoard3(-9, 0, 1, 50, 60); posterFinal();
    } },
  // 镜3 · 03 数层 / COUNT · 方块逐个点亮，再排成条：计数跟着跳，换个排法就是图表。
  { dur: 6.8,
    draw(t) {
      camAt(2, t);
      drawShoe(flPose(1), -9, 0, t); posterFinal(); set(G.axis, 'opacity', .6); set(G.gl0, 'opacity', 0);
      set(G.sun, 'transform', 'translate(0 0)');
      drawCallouts(9, 0, -9);
      set(G.cnt, 'opacity', 1); G.cntN.textContent = '5'; set(G.cntN, 'transform', '');
      drawBoard3(t, 1.45, 3.25, 3.5, 5.0);
      glint(G.gl1, 'outsole', 330, 176, t, 2.2);
    } },
];
/* 闪光：四角星在零件边缘一闪（放在贴纸滤镜外面，不然会被膨胀出白边） */
function glint(el, part, lx, ly, t, at) {
  const def = PARTS.find(p => p[0] === part), dy = exploded ? def[1] * LY.ek : 0, e = seg(t, at, at + .55);
  set(el, 'opacity', e > 0 && e < 1 ? 1 : 0);
  if (e > 0 && e < 1) set(el, 'transform', `translate(${lx} ${ly + dy}) rotate(${(e * 70).toFixed(1)}) scale(${Math.sin(Math.PI * e).toFixed(3)})`);
}
function hideCount() { set(G.cnt, 'opacity', 0); }
function posterFinal() { set(G.ulR, 'x', G.ulX[0]); set(G.ulR, 'width', G.ulX[1] - G.ulX[0]); G.sl.forEach(s => { set(s, 'opacity', 1); set(s, 'transform', ''); }); }

S0 = makePlayer(SHOTS, {
  onResize(S) { exploded = null; build(S); F = frames(); },
});
</script>
