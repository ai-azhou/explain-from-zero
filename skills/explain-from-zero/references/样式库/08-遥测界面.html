<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>遥测界面 · 样张</title>
<!--
风格：遥测界面  TELEMETRY UI
一句话：潜艇里的声呐屏，暗室只开红灯——近黑底上一层单一的信号红：下半屏一个半圆扇形声呐，扫描线左右来回摆，
        回波点一个个亮起；右边一条瀑布图往下滚；四周密而小的遥测数据只为衬出一个大读数。范围一步步收窄，
        锁定那一下整屏从红切成冷白青，海底一只沉锚的线框被括号框住。
擅长表现：定位、识别、测量——一个数从大跳到准，系统一步步缩小范围、最后锁定；状态一变整屏换色，看的人立刻知道「找到了」。
搬到讲解里：
  扫描线来回扫、回波点一个个亮、回波次数一格格跳 → 讲「证据一点点攒起来」：用在要先收集信号、再下结论的题
  扇区从 120° 收到 12°、距离门一起收 → 讲「排除法，一步步缩小范围」：用在排查、筛选、二分查找这类题
  锁定一下整屏换色 + 括号收拢 + 引线标出目标 → 讲「找到了，就是它」：用在揭晓答案、定位到具体那一个的时候
招牌细节：
  材质  近黑底（只带一点主色的偏色）+ 极淡蜂窝网格 + 细扫描线 + 暗角；四角括号框住整屏。
  光    所有亮线、亮字都有辉光（整帧缩小再放大叠回去）；同一画面至少三档亮度：近白 > 主色 > 暗主色；回波点按「上次被扫到」衰减余辉。
  主体  半圆扇形：四道距离弧、181 道方位刻度（每 30° 一个方位数字）、分段弧沿弧慢滑、内圈虚线快滑；扫描线左右摆，身后拖一片余辉。
  主体  海底一只沉锚：线框（锚环、锚杆、横杆、两只弯臂和锚爪），3D 慢转 + 透视、远处的线更暗；扫描线经过时线框被点亮。
  字    密而小：编号小节头中英双语「01 SYS BOOT 声呐自检」、[OK] 列表逐行打出、十六进制数据流、回波剖面、回波直方；
        只有一个大读数（DIN 粗体 + 单位 + 点状进度条），其余全是 12px 等宽。
  动效  CRT 开机：一条横线展开再上下撑开；扇区两条边线往中间收；锁定时括号从大收到小、整屏闪两下切到状态色、
        斜纹警示横幅弹开再收回、坐标后光标闪。瀑布图每 1/15 秒下滚一行（刻意的低帧率）。
  角落小字  ● REC、T+ 时间码、F 帧号 · 60P、顶部方位刻度带。
色彩结构（换题保留）：颜色是这种画面语言的一部分。
  ① 底必须接近黑、只带一点主色的偏色：发光界面的亮度全靠「发光」表达，底一亮，辉光和三档亮度就没了，所以这一条不随题目变。
  ② 一种主发光色，管所有线、刻度、字、波形，靠透明度分三档（近白 > 主色 > 暗主色）；近白只给最亮的点和字。
  ③ 一种状态色，只在状态改变（锁定）那一下整屏替换主色——底、网格、面板一起换，不和主色同屏混用。
  ④ 一个极小的指示灯（REC），取和主色、状态色都不同的一种色。全片高饱和、单色相，不用渐变色。
  可以随题目换的是两种发光色的色相：主色取主角或现场光源的颜色；状态色和主色拉开色相（冷暖相对或互补），切换一眼可见。
本例配色（从本例主体「海底一只沉锚」和它的现场「潜艇里只开红色作战灯的声呐舱」推出来，换题就换）：
  主色 search #ff3a2a（信号红），近白 #ffe4de；状态色 lock #aaf0ff（冷白青），近白 #f2fcff；
  底 #1c0504 → #030101（锁定后 #04131a → #010305）；面板实底 #0e0302 / #020a0e；REC #ffc850。
换题示例（?pal=alt）：假设主角是「温室里一只萤火虫」、现场是「夜里只开紫色补光灯的温室」→ 主色取补光灯的紫；
  锁定那一下换成萤火虫的黄绿（和紫互补，切换最醒目）；底是带一点紫的近黑，锁定后带一点黄绿 →
  主色 search #b882ff，近白 #f3ecff；状态色 lock #d2ff5a，近白 #fbffe8；底 #120a1e → #030106（锁定后 #0e1404 → #020301）；面板 #08040e / #070a02。
字：大读数用 "DIN Alternate","DIN Condensed",Bahnschrift,"Arial Narrow" 粗体；其余等宽 "SF Mono",Menlo,Consolas；
  中文小标用黑体组 12px；横幅里的中文用黑体粗体。全部在 Canvas 里画，换色只改一个主色变量。
动效：60fps；扫描线一次摆过约 1.4 秒；分段弧 : 虚线弧的滑速 1 : -4；读数用 floor 跳数，不补间；状态切换在 0.3 秒里两种发光色
  交替闪两下再定住（不交叉淡化）；横幅 back 过冲展开；括号收拢用 ease.out；数据流、瀑布图都是刻意的低帧率。
做粗了 → 做精：
  一个发光扇形 → 距离弧 + 方位刻度 + 方位数字 + 分段弧 + 虚线弧，各层滑速不同，扫描线身后有余辉。
  回波点一直亮着 → 每个点只在被扫到那一下最亮，然后按时间衰减，等下一次扫过再亮。
  字大而少 → 密而小的次要信息（12px）铺满两侧，只留一个大读数。
  只有一档亮度、没有辉光 → 近白 / 主色 / 暗主色三档 + 整帧辉光。
  状态变化只换文字 → 整屏换色 + 横幅 + 括号收拢 + 光标闪。
  目标是一个点 → 真的做线框体的透视投影，远处线暗、近处线亮，被扫到的边点亮。
手机竖屏：扇形放在屏幕中段占满宽；上面是大读数和瀑布图并排，下面是回波剖面、两块小面板和数据流；所有画面字 ≥ 12px；
  横幅改窄，中文 26px。
技法目录：
  T0 配色：两种发光色 + 各自的底、面板，集中在文件头一个对象里，?pal=alt 切换；状态切换时整套 CSS 变量一起换
  T1 底：近黑渐变 + 蜂窝网格（预渲染平铺）+ 扫描线 + 暗角
  T2 CRT 开机：横线展开再撑开（CSS 变换 + 亮度）
  T3 扇形刻度：距离弧、方位刻度、方位数字、分段弧、虚线弧，各层不同滑速
  T4 线框体：沉锚，3D 旋转 + 透视 + 按深度调亮度
  T5 扫描线 + 余辉 + 回波点（按上次被扫到的时间衰减）；扇区收窄
  T6 遥测面板：编号双语小节头、[OK] 列表、大读数、带小进度条的数值、候选列表
  T7 数据装饰：十六进制流、回波剖面、回波直方、瀑布图、方位刻度带、顶部状态胶囊
  T8 锁定：括号收拢、整屏换色闪烁、斜纹警示横幅、闪烁光标
  T9 辉光后期：整帧缩小 1/4 再放大，用 lighter 叠回
-->
<script>
/* ━━ T0 配色：全片的颜色只在这里。search = 搜索态主发光色，lock = 锁定态状态色；默认本例配色，网址带 ?pal=alt 换成换题示例 ━━ */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体（声呐舱里找海底沉锚），不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  base: {   // 本例：红灯声呐舱 → 信号红；锁定 = 冷白青
    search: { glow: [255, 58, 42], white: [255, 228, 222], field: ['#1c0504', '#0c0202', '#030101'], panel: [14, 3, 2], hex: .045 },
    lock:   { glow: [170, 240, 255], white: [242, 252, 255], field: ['#04131a', '#020a0f', '#010305'], panel: [2, 10, 14], hex: .035 },
    rec: [255, 200, 80],
  },
  alt: {    // 换题示例：紫色补光灯下的温室，找一只萤火虫 → 补光紫；锁定 = 萤火虫黄绿
    search: { glow: [184, 130, 255], white: [243, 236, 255], field: ['#120a1e', '#07040c', '#030106'], panel: [8, 4, 14], hex: .045 },
    lock:   { glow: [210, 255, 90], white: [251, 255, 232], field: ['#0e1404', '#060902', '#020301'], panel: [7, 10, 2], hex: .035 },
    rec: [255, 120, 90],
  },
};
const PAL = PALETTES[new URLSearchParams(location.search).get('pal') === 'alt' ? 'alt' : 'base'];
</script><style>
  :root { /* 颜色变量由 T0 写入（--c 主色、--c-dim、--c-faint、--w 近白、--panel-rgb、--field-0..2、--hex） */
    --mono:"SF Mono",Menlo,Consolas,"Roboto Mono","Liberation Mono",monospace;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--field-2); color:var(--w); font-family:var(--sans); }
  body { overflow:hidden; }
  #stage { position:fixed; inset:0; }
  /* ━━ T2 CRT 开机：画面先压成一条横线，再上下撑开 ━━ */
  #screen { position:absolute; inset:0; transform-origin:50% 50%; }
  #hud { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* ━━ T1 底：近黑渐变 + 蜂窝网格（CSS 层，辉光不吃它） ━━ */
  #bgl { position:absolute; inset:0; background-color:var(--field-2); background-size:21px 36px, auto;
    background-image:var(--hex), radial-gradient(ellipse 70% 70% at 50% 70%, var(--field-0) 0%, var(--field-1) 55%, var(--field-2) 100%); }
  /* ━━ T1 扫描线 + 暗角（CSS 叠层，便宜） ━━ */
  #scan { position:fixed; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
  #vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse 80% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<main id="stage"><div id="screen"><div id="bgl"></div><canvas id="hud"></canvas></div></main>
<div id="scan"></div><div id="vig"></div>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
};
const lerp = (a, b, k) => a + (b - a) * k;
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const MONO = '"SF Mono",Menlo,Consolas,"Roboto Mono","Liberation Mono",monospace';
const DIN = '"DIN Alternate","DIN Condensed",Bahnschrift,"Arial Narrow","Roboto Condensed",sans-serif';
const SANS = '-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const CLK = { t: 0, last: performance.now() };
function tick(S) {
  const n = performance.now(), dt = Math.min(.1, (n - CLK.last) / 1000); CLK.last = n;
  if (S.playing && !S.reduce) CLK.t += dt;
  return CLK.t;
}
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ━━ T0 调色：主色、近白、面板随状态在 search ↔ lock 之间换；CSS 变量跟着整套换 ━━ */
let PC = PAL.search.glow, WC = PAL.search.white, PN = PAL.search.panel, STATE_ON = null;
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const rgbs = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const C = a => rgbs(PC, a);        // 主色
const Wt = a => rgbs(WC, a);       // 最亮的近白
const Pn = a => rgbs(PN, a);       // 实底面板
function cssState(st) {
  const r = document.documentElement.style, c = st.glow.join(',');
  r.setProperty('--c', `rgb(${c})`); r.setProperty('--c-dim', `rgba(${c},.4)`); r.setProperty('--c-faint', `rgba(${c},.14)`);
  r.setProperty('--w', `rgb(${st.white.join(',')})`); r.setProperty('--panel-rgb', st.panel.join(','));
  st.field.forEach((f, i) => r.setProperty('--field-' + i, f)); r.setProperty('--hex', st.hexImg);
}
function setTheme(k) {
  PC = mixc(PAL.search.glow, PAL.lock.glow, k); WC = mixc(PAL.search.white, PAL.lock.white, k); PN = mixc(PAL.search.panel, PAL.lock.panel, k);
  const on = k > .5; if (on !== STATE_ON) { STATE_ON = on; cssState(on ? PAL.lock : PAL.search); }
}

/* ━━ T9 辉光后期：整帧缩到 1/4，再放大用 lighter 叠回（含画布初始化） ━━ */
const cv = $('#hud'), g = cv.getContext('2d');
const bloom = document.createElement('canvas'), bg2 = bloom.getContext('2d');
const canFilter = 'filter' in bg2;
let W = 0, H = 0, DPR = 1, LY = {};
function applyBloom(strength = .85) {
  const bw = Math.max(1, Math.round(cv.width / 4)), bh = Math.max(1, Math.round(cv.height / 4));
  if (bloom.width !== bw) { bloom.width = bw; bloom.height = bh; }
  bg2.globalCompositeOperation = 'copy';
  if (canFilter) bg2.filter = 'blur(3px)';
  bg2.drawImage(cv, 0, 0, bw, bh);
  if (canFilter) bg2.filter = 'none';
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = strength; g.imageSmoothingEnabled = true;
  g.drawImage(bloom, 0, 0, cv.width, cv.height);
  g.globalAlpha = strength * .5; g.drawImage(bloom, -cv.width * .01, -cv.height * .01, cv.width * 1.02, cv.height * 1.02);
  g.restore();
}

/* ━━ T1 底：蜂窝网格预渲染一块，转成 CSS 平铺图 ━━ */
function hexTile(col) {
  const r = 12, w = r * Math.sqrt(3), c = document.createElement('canvas'); c.width = Math.round(w * 2); c.height = r * 6;
  const x = c.getContext('2d'); x.strokeStyle = col; x.lineWidth = 2; x.scale(2, 2);
  const hex = (cx, cy) => { x.beginPath(); for (let i = 0; i <= 6; i++) { const a = Math.PI / 6 + i * TAU / 6; x.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); } x.stroke(); };
  hex(w / 2, r); hex(0, r * 2.5); hex(w, r * 2.5); hex(0, -r * .5); hex(w, -r * .5);
  return `url(${c.toDataURL()})`;
}
for (const st of [PAL.search, PAL.lock]) st.hexImg = hexTile(`rgba(${st.glow.join(',')},${st.hex})`);
setTheme(0);
function line(x1, y1, x2, y2, col, w = 1) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function arc(x, y, r, a0, a1, col, w = 1) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); }
function txt(s, x, y, size, col, o = {}) {
  g.font = `${o.w || 400} ${size}px ${o.f || MONO}`; g.fillStyle = col; g.textAlign = o.a || 'left'; g.textBaseline = o.b || 'alphabetic';
  g.fillText(s, x, y);
}
/* 方位（0° = 正前方 = 屏幕正上，左负右正）→ 屏幕角 / 屏幕坐标 */
const ang = b => (-90 + b) * DEG;
const polar = (b, r) => [LY.cx + Math.cos(ang(b)) * r * LY.R, LY.cy + Math.sin(ang(b)) * r * LY.R];

/* ━━ T3 扇形刻度：距离弧、方位刻度、方位数字、分段弧、虚线弧，各层不同滑速 ━━ */
function fan(T, k = 1) {
  const { cx, cy, R } = LY, a0 = ang(-90), a1 = ang(-90 + 180 * k);
  // 扇面底：一层很淡的主色
  const fg = g.createRadialGradient(cx, cy, 0, cx, cy, R); fg.addColorStop(0, C(.10)); fg.addColorStop(.85, C(.03)); fg.addColorStop(1, C(.07));
  g.fillStyle = fg; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a0, a1); g.closePath(); g.fill();
  // 距离弧：四道，外圈最亮；每道左端标距离
  [.25, .5, .75, 1].forEach((f, i) => { arc(cx, cy, R * f, a0, a1, C(i === 3 ? .75 : .22), i === 3 ? 1.5 : 1);
    if (k >= 1) txt(String((i + 1) * 50).padStart(3, '0'), cx - R * f + 4, cy - 6, 12, C(.5)); });
  // 径向线：每 30°
  for (let b = -60; b <= 60; b += 30) { const [x, y] = polar(b, 1); line(cx, cy, x, y, C(b === 0 ? .3 : .14)); }
  // 方位刻度：181 道，10° 长、5° 中
  g.strokeStyle = C(.55); g.lineWidth = 1; g.beginPath();
  for (let b = -90; b <= -90 + 180 * k; b++) {
    const L = b % 10 === 0 ? 12 : b % 5 === 0 ? 7 : 3, c = Math.cos(ang(b)), s = Math.sin(ang(b));

  const rs = big ? 32 : 21;

  brackets(cx, cy, rs, 1, C(1)); arc(cx, cy, rs * .55, 0, TAU, Wt(.9), 1.2);
  line(cx - rs * .9, cy, cx - rs * .25, cy, Wt(.9)); line(cx + rs * .25, cy, cx + rs * .9, cy, Wt(.9));
  line(cx, cy - rs * .9, cx, cy - rs * .25, Wt(.9)); line(cx, cy + rs * .25, cx, cy + rs * .9, Wt(.9));
  g.fillStyle = Wt(1); g.fillRect(cx - 1.5, cy - 1.5, 3, 3);
  if (k < .6) return;
  const a = seg(k, .6, 1), fz = big ? 44 : 26, off = big ? 150 : 76;
  g.globalAlpha = a;
  txt('回波 · ECHO ' + String(ECHO.n).padStart(2, '0'), cx - off, y + (big ? 19 : 14), 12, C(.8), { a: 'center', f: SANS });
  txt('C O N T A C T', cx + off, y + (big ? 19 : 14), 12, C(.8), { a: 'center', w: 600 });
  txt(big ? '目标锁定' : '锁定', cx - off, y + h - (big ? 14 : 10), fz, Wt(1), { a: 'center', w: 800, f: SANS });
  txt('LOCKED', cx + off, y + h - (big ? 14 : 10), fz, Wt(1), { a: 'center', w: 700, f: DIN });
  g.globalAlpha = 1;
}
function callout(ax, ay, ex, ey, a, t1, t2) {
  if (a <= 0) return;
  const k = ease.out(a), fx = lerp(ax, ex, k), fy = lerp(ay, ey, k), left = ex < ax;
  g.globalAlpha = a; arc(ax, ay, 6, 0, TAU, Wt(.95), 1.2); g.fillStyle = Wt(1); g.fillRect(ax - 1.5, ay - 1.5, 3, 3);
  g.strokeStyle = Wt(.85); g.lineWidth = 1; g.beginPath(); g.moveTo(ax, ay - 6 * Math.sign(ay - fy || 1)); g.lineTo(ax, fy); g.lineTo(fx, fy); g.stroke();
  g.font = `600 12px ${SANS}`; const bw = Math.max(g.measureText(t1).width, g.measureText(t2).width) + 16, tx = left ? fx - bw : fx;
  g.fillStyle = Pn(.88); g.fillRect(tx, fy - 40, bw, 38); g.fillStyle = Wt(1); g.fillRect(left ? tx + bw - 2 : tx, fy - 40, 2, 38);
  txt(t1, tx + 8, fy - 25, 12, Wt(1), { w: 600, f: SANS }); txt(t2, tx + 8, fy - 8, 12, C(.95));
  g.globalAlpha = 1;
}

/* ━━ 布局：横屏扇形压在下半屏、两侧面板；竖屏扇形在中段、面板上下排 ━━ */
function layout(S) {
  DPR = Math.min(2, devicePixelRatio || 1); W = S.w; H = S.h;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const portrait = S.portrait;
  if (!portrait) { const R = Math.min(W * .34, H * .56); LY = { portrait, m: 22, cx: W / 2, cy: H - 46, R, colW: Math.min(250, W * .17) }; }
  else { const R = W * .44; LY = { portrait, m: 14, cx: W / 2, cy: 300 + R, R, colW: (W - 42) / 2 }; }
}

/* ━━ 一帧：把三镜的状态合进一个画面 ━━ */
function render(S, st) {
  const T = tick(S);
  setTheme(st.tone);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  const { cx, cy, R } = LY, P = LY.portrait;
  frameCorners(LY.m, P ? 18 : 26);
  topBar(T, st.status, st.statusZh, Math.floor(T * 60));
  fan(T, st.ringK);
  if (st.ringK >= 1) sweepAt(T, st.sb, st.win);
  // 沉锚：落在目标回波的位置；锁定时放大
  const [tx, ty] = polar(TGT.b, TGT.r), zs = R * lerp(.12, .2, ease.out(st.lock));
  const near = Math.exp(-Math.pow((st.sb - TGT.b) / 6, 2));
  const wf = wire(tx, ty - zs * .1, zs, st.rotY, -.35, st.tone > .5 ? 1 : near, -.35 + .06 * Math.sin(T * .7), clamp(.25 + ECHO.n * .12 + st.lock));
  const tgt = wf.P[MESH.target];
  // 距离门：扫描范围收窄时画两道弧
  if (st.gate < 1) { const r0 = TGT.r - .5 * st.gate * .9, r1 = TGT.r + .5 * st.gate * .9;
    for (const r of [r0, r1]) arc(cx, cy, Math.max(.02, r) * R, ang(st.win[0]), ang(st.win[1]), Wt(.7), 1.2); }
  // 扇形上方：方位带 + 回波剖面 + 回波直方
  if (!P) {
    const top = 110, w = Math.min(560, W * .38);
    tape(cx, top, w, st.sb);
    head(cx - w / 2, top + 52, w, '03', 'A-SCAN · RANGE', '回波剖面'); ascan(cx - w / 2, top + 66, w, 54, T, near);
    txt('▲ ' + (st.sb + 360 >= 360 ? st.sb : st.sb + 360).toFixed(1).padStart(5, '0') + '°', cx + w / 2, top + 140, 12, Wt(.85), { a: 'right' });
    hist(cx - w / 2, top + 128, w * .6, 26, T, (TGT.b + 90) / 180);
  }
  // 锁定：括号收拢 + 次要目标
  if (st.lock > 0) {
    const k = ease.out(st.lock), s = lerp(160, 30, k);
    brackets(tgt[0], tgt[1], s, clamp(st.lock * 3), st.tone > .5 ? Wt(1) : C(1));
    if (st.tone > .5) arc(tgt[0], tgt[1], 40 + 4 * Math.sin(T * 6), 0, TAU, C(.6), 1);
  }
  if (st.callout > 0) {
    const [rx, ry] = wf.P[MESH.marks[0]];
    if (P) { callout(rx, ry, rx - 70, ry - 70, st.callout, '锚环 · 回波最弱', 'ECHO 0.31'); callout(tgt[0], tgt[1], tgt[0] + 30, tgt[1] - 120, st.callout2, '锚爪 · 回波最强', 'ECHO ×' + ECHO.n); }
    else { callout(rx, ry, rx - 190, ry - 70, st.callout, '锚环 · 回波最弱', 'ECHO 0.31'); callout(tgt[0], tgt[1], tgt[0] + 200, tgt[1] - 110, st.callout2, '锚爪 · 回波最强', 'ECHO ×' + String(ECHO.n).padStart(2, '0')); }
  }
  // 两侧面板
  if (!P) {
    const x0 = LY.m + 22, w = LY.colW, top = 92;
    head(x0, top, w, '01', 'SYS BOOT', '声呐自检'); bootList(x0, top + 30, w, st.bootList, T);
    bigReadout(x0, top + 188, w, st.ro.label, st.ro.zh, st.ro.value, st.ro.unit, st.ro.frac);
    head(x0, top + 306, w, '02', 'SWEEP TELEMETRY', '扫描遥测');
    bars(x0, top + 336, w, [['SECTOR', String(Math.round(st.win[1] - st.win[0])).padStart(3, '0'), '°', (st.win[1] - st.win[0]) / 160],
      ['GATE', st.gate.toFixed(2), '', st.gate], ['SWEEP', '1.40', 'S', .7], ['GAIN', (.62 + .04 * Math.sin(T * 3)).toFixed(2), '', .62]]);
    hexStream(x0, top + 432, w, 2, T);
    const x1 = W - LY.m - 22 - w;
    head(x1, top, w, '04', 'WATERFALL', '瀑布图'); waterfall(x1, top + 18, w, 196, T, clamp(.2 + ECHO.n * .1));
    head(x1, top + 262, w, '05', 'CONTACTS', '候选'); contacts(x1, top + 292, w, st);
    head(x1, top + 392, w, '06', 'ECHO HIST', '回波直方'); hist(x1, top + 404, w, 36, T, (TGT.b + 90) / 180);
  } else {
    const x0 = 14, w = LY.colW, x1 = x0 + w + 14, y0 = 112;
    bigReadout(x0, y0, w, st.ro.label, st.ro.zh, st.ro.value, st.ro.unit, st.ro.frac);
    head(x0, y0 + 112, w, '01', 'BOOT', '自检'); txt('> SEARCH MODE', x0, y0 + 138, 12, C(.8)); txt('! CONTACT 022°', x0, y0 + 156, 12, Wt(.9));
    head(x1, y0, w, '04', 'WATERFALL', '瀑布'); waterfall(x1, y0 + 14, w, 136, T, clamp(.2 + ECHO.n * .1));
    const y1 = cy + 30;
    head(x0, y1 + 12, W - 28, '03', 'A-SCAN', '回波剖面'); ascan(x0, y1 + 26, W - 28, 44, T, near);
    head(x0, y1 + 108, w, '02', 'SWEEP', '扫描'); bars(x0, y1 + 136, w, [['SECT', String(Math.round(st.win[1] - st.win[0])).padStart(3, '0'), '', (st.win[1] - st.win[0]) / 160], ['GATE', st.gate.toFixed(2), '', st.gate]]);
    head(x1, y1 + 108, w, '05', 'CONTACT', '候选'); contacts(x1, y1 + 136, w, st);
    hexStream(x0, H - 40, W - 28, 1, T);
  }
  // 锁定横幅 + 坐标 + 闪烁光标
  if (st.bannerK > 0) banner(cx, P ? cy - R * .62 : cy - R * .5, P ? W - 24 : R * 2.2, st.bannerK, T, !P);
  if (st.coordK > 0) {
    const s = 'BRG 022.4°   RNG 0.58', n = Math.floor(st.coordK * s.length), y = P ? cy - 10 : cy - R * .2;
    g.font = `600 ${P ? 15 : 18}px ${MONO}`; const tw = g.measureText(s).width;
    g.fillStyle = Pn(.9); g.fillRect(cx - tw / 2 - 18, y - 22, tw + 40, 34); g.strokeStyle = C(.6); g.lineWidth = 1; g.strokeRect(cx - tw / 2 - 18, y - 22, tw + 40, 34);
    g.fillStyle = Pn(.9); g.fillRect(cx - 44, y - 40, 88, 17);
    txt('COORD · 坐标', cx, y - 27, 12, C(.8), { a: 'center', f: SANS });
    txt(s.slice(0, n), cx - tw / 2, y + 1, P ? 15 : 18, Wt(1), { w: 600 });
    if (Math.floor(T * 2.5) % 2) { g.fillStyle = Wt(1); g.fillRect(cx - tw / 2 + g.measureText(s.slice(0, n)).width + 4, y - 14, 9, 17); }
  }
  applyBloom(P ? .7 : .8);
}

/* ━━ T2 CRT 开机 / 关机（只动 CSS，画面照常画） ━━ */
const screenEl = $('#screen');
function crt(k) {
  if (k >= 1) { screenEl.style.transform = ''; screenEl.style.filter = ''; return; }
  const a = seg(k, 0, .45), b = seg(k, .45, 1);
  const sx = ease.out(a), sy = b > 0 ? lerp(.006, 1, ease.out(b)) : .006;
  screenEl.style.transform = `scale(${Math.max(.002, sx).toFixed(3)},${sy.toFixed(3)})`;
  screenEl.style.filter = `brightness(${lerp(4, 1, b).toFixed(2)}) saturate(${lerp(.3, 1, b).toFixed(2)})`;
}

/* ━━ 镜头 ━━ */
const BASE = { bootList: 1, lock: 0, tone: 0, bannerK: 0, coordK: 0, callout: 0, callout2: 0, match: 0, gate: 1, win: [-80, 80] };
const swing = (T, c, half) => c + half * Math.sin(T * 2.24);
const SHOTS = [
  // 镜1 · 开机：扇形一道道画出来，扫描线左右摆，海床和杂波一个个亮，目标那几点每扫一次回波次数跳一格
  { status: 'SEARCH', zh: '全扇区搜索', dur: 6.5,
    enter() { ECHO.n = 0; ECHO.prev = null; BLIPS.forEach(p => p.hit = -99); },
    draw(t, p, S) {
      crt(S.reduce ? 1 : seg(t, 0, .5));
      const ringK = ease.out(seg(t, .3, 1.2));
      render(S, { ...BASE, status: this.status, statusZh: this.zh, ringK, bootList: lerp(.3, 1, seg(t, .3, 2.6)), sb: swing(CLK.t, 0, 80), rotY: CLK.t * .35,
        ro: { label: 'ECHO', zh: '回波次数', value: String(ECHO.n).padStart(2, '0'), unit: '/ 12', frac: ECHO.n / 12 } });
    } },
  // 镜2 · 收窄：扇区两条边线从 ±80° 往目标方位收到 ±6°，距离门一起收；扇区读数一格格跳
  { status: 'NARROWING', zh: '收窄范围', dur: 6.5,
    draw(t, p, S) {
      crt(1);
      const k = ease.inOut(seg(p, .1, .85)), c = lerp(0, TGT.b, k), half = lerp(80, 6, k);
      const win = [c - half, c + half], wdeg = Math.round(half * 2);
      render(S, { ...BASE, status: this.status, statusZh: this.zh, ringK: 1, sb: swing(CLK.t, c, half), win, gate: lerp(1, .14, k), rotY: CLK.t * .35,
        ro: { label: 'SECTOR', zh: '扇区宽度', value: String(Math.floor(wdeg / 2) * 2).padStart(3, '0'), unit: '°', frac: 1 - (wdeg - 12) / 148 } });
    } },
  // 镜3 · 锁定：扫描线停在目标上，括号收拢，整屏从信号红闪两下切成冷白青；横幅弹开再收回，引线标出锚环和锚爪
  { status: 'CONTACT LOCKED', zh: '目标锁定', dur: 7,
    enter() { this._rot0 = CLK.t * .35; },
    draw(t, p, S) {
      const lockAt = .18, flick = seg(p, lockAt, lockAt + .05);
      const tone = p < lockAt ? 0 : flick >= 1 ? 1 : [1, 0, 1, 0, 1][Math.floor(flick * 5)];
      crt(!S.reduce && p > .95 ? 1 - seg(p, .95, 1) : 1);
      const lockK = seg(p, 0, lockAt), sb = lerp(swing(CLK.t, TGT.b, 6), TGT.b, ease.out(lockK)), err = lerp(64, .3, ease.out(seg(p, 0, lockAt + .1)));
      render(S, { ...BASE, status: p < lockAt ? 'ACQUIRING' : this.status, statusZh: p < lockAt ? '捕获中' : this.zh, ringK: 1, sb, win: [TGT.b - 6, TGT.b + 6], gate: .14,
        rotY: (this._rot0 ?? 0) + .6 * (1 - Math.pow(1 - seg(p, 0, .9), 2)), lock: lockK, tone,
        bannerK: seg(p, lockAt + .02, lockAt + .12) * (1 - seg(p, .5, .58)), coordK: seg(p, .58, .74), callout: seg(p, .6, .72), callout2: seg(p, .66, .78),
        match: lerp(96.8, 99.6, ease.out(seg(p, lockAt, .7))),
        ro: { label: 'ERROR', zh: '对准误差', value: err.toFixed(1).padStart(4, '0'), unit: 'PX', frac: 1 - err / 64 } });
    } },
];

makePlayer(SHOTS, { onResize(S) { layout(S); } });
</script>
