<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拼贴剪报 · 样张</title>
<!--
风格：拼贴剪报 COLLAGE · CUT-OUT
一句话：所有东西都是从旧报纸上剪下来、带着白边和影子贴在一张底纸上的；网点印刷的质感，一秒只换 12 格，卡顿是故意的。
擅长表现：把一样东西剪开、拆散、再拼回去看——一句话的哪几个字、一张单据的哪一栏、一个物件里头藏着什么；也擅长「凑出来的」「拼起来的」这类意思。
招牌细节：
  材质：卡纸底（长短纤维 + 斑驳）；报纸碎片是新闻纸 + 分栏小字 + 粗标题。
  光：没有灯光，只有「贴上去」的投影：每块剪纸下面一层偏移的柔影；最外圈一层暗角。
  主体：程序画的灰度物件 → 45° 网点滤镜 → 刻线描边 → 外扩一圈不均匀白边，像从老版画上剪下来；背后一块强调色纸圆。
  字：勒索信式字块（墨底 / 强调色底 / 白底 / 报纸底轮换，宋黑混排、各自歪一点）；斜贴的墨色横幅配粗体英文；强调色印章「Nº 12」。
  动效：全程 12 格/秒步进，动的东西每格手放一次（带 1–2 像素的抖）；剪刀沿虚线一张一合地剪开；剪开的上半截先往下一沉再翘起。
  角落小字：打字机等宽小字（SHEET 编号、12 FPS、PASTED ON KRAFT），格数计数器一格一跳。
色彩结构（换题保留）：五个角色。底纸（--kraft，中明度、低饱和、有纤维，占画面最大）；印刷纸（--news，浅、近中性，报纸和网点的纸色）；
    墨（--ink，近黑，网点、字、横幅都用它）；一个高饱和强调色（--accent，只用在纸圆光环、印章、一两个字块、答案镜的整张封面）；
    半透明胶带。全是平涂 + 投影，不受光；除强调色外都是低饱和。强调色上的字用 --onAccent，浅纸上的批注用 --mark。
    底是中明度纸：既压得住白边剪纸，也托得住墨色网点；现场再暗也别用纯黑底，剪纸的投影会看不见。
本例配色（从本例主体「一把老茶壶（黑白版画）」和它的现场「旧报纸铺在牛皮纸上的剪贴本」推出来，换题就换）：
    --kraft #a08a72 牛皮纸 · --news #ebe3cf 米黄新闻纸 · --ink #1c1a18 油墨黑 · --accent #c3212b 印刷红 · --tape 米黄半透明。
换题示例（?pal=alt）：假设主角是「一把明黄的雨伞」、现场是「阴雨天的街边」→ 阴天把底纸压成湿的灰蓝卡纸、印刷纸偏冷白、墨偏蓝黑；
    强调色只留给雨伞的明黄；黄底上写字改用墨色，浅纸上的批注用深一档的赭黄。
    --kraft #7d8a91 · --news #e3e7e5 · --ink #141c24 · --accent #f2c41b · --onAccent #141c24 · --mark #a87a00（全表见下方 PALS.alt）。
字：中文显示字用系统宋体/黑体加粗，切成一块块字块（T7）；英文横幅用 Impact /"Arial Black"/"Helvetica Neue" 退到 sans-serif 900；
    小字用 "Courier New",Courier,monospace。
动效：时间先量化到 1/12 秒，只在换格时重画（T11）；入场 = 从画外分 3–6 格滑进来、最后一格过冲再退回；转场 = 新纸一格一格盖过来。
做粗了 → 做精：
  规则锯齿当撕边 → 分形中点位移的撕边 + 内缩一圈不均匀的白色纤维边（T4）。
  平涂灰色剪影 → 灰度明暗 → 网点滤镜 → 刻线 → 不均匀白边 → 投影，五层叠出来（T2、T3）。
  流畅补间 → 12 格步进，每格位置带一点手放的抖（T11）。
  字直接打在纸上 → 每个字一块剪下来的字块，底色字体轮换、各自歪（T7）。
  干净纯色底 → 卡纸纤维 + 斑驳 + 暗角（T1）。
手机竖屏：换成 800×1500 竖版世界：字块标题在上、纸圆和主体居中、报纸碎片压两角；对比镜改上下两格。
技法目录：
  T1 卡纸底（牛皮纸、灰卡纸……）
  T2 网点滤镜（任意灰度图 → 网点）
  T3 主体：网点茶壶（换成你的物件，只要先画灰度明暗）
  T4 撕边纸 + 新闻纸分栏小字
  T5 剪下来：不均匀白边 + 投影
  T6 胶带、图钉
  T7 勒索信字块
  T8 斜贴横幅、印章、圆徽章
  T9 剪刀 + 虚线 + 剪开
  T10 打字机小字和格数计数
  T11 12 格步进 + 手放的抖
-->
<script>
/* ━━ 配色：全片颜色只在这里（CSS 变量 + JS 对象 C）。默认是本例；网址加 ?pal=alt 换成换题示例 ━━ */
// 角色：kraft 底纸（kraftDark/kraftLight 斑驳和纤维）/ news 印刷纸（newsInk 报纸字、newsFaint 反例的灰字、stain 纸上灰斑）/ paper 白边和标签纸
//      cut 剪纸白边 / rim 撕口纤维 / ink 墨 / accent 强调色（accentHi/accentLo 封面的亮暗）/ onAccent 强调色上的字 / mark 浅纸上的批注
//      tape 胶带（tapeEdge 边线）/ pin 图钉三档 / steel 剪刀刃三档 / flat 反例平涂灰 / hole 剪开后壶里的暗 / shadow 投影 / vign 暗角 / page 页面底
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALS = {
  base: { kraft:'#a08a72', kraftDark:[65, 42, 19], kraftLight:[245, 225, 190], news:'#ebe3cf', newsInk:'#2a2622', newsFaint:'#77726a', stain:[90, 70, 40],
    paper:'#f6f1e4', cut:'#f8f4ea', rim:'#f3efe4', ink:'#1c1a18', accent:'#c3212b', accentHi:[255, 90, 70], accentLo:[60, 0, 0], onAccent:'#ffffff', mark:'#c3212b',
    tape:'#e4d4a8', tapeEdge:[120, 95, 50], pin:['#fff6cf', '#c9a24a', '#5a4310'], steel:['#f2f2ee', '#9a9a96', '#4a4a46'], flat:'#8d8a84', hole:'#231e1a',
    shadow:[25, 14, 4], vign:[30, 15, 5], page:'#3a2f25' },
  alt: { kraft:'#7d8a91', kraftDark:[18, 32, 42], kraftLight:[205, 218, 226], news:'#e3e7e5', newsInk:'#1d2830', newsFaint:'#6f7a80', stain:[30, 50, 62],
    paper:'#f2f5f4', cut:'#f4f7f6', rim:'#eef2f1', ink:'#141c24', accent:'#f2c41b', accentHi:[255, 240, 140], accentLo:[130, 85, 0], onAccent:'#141c24', mark:'#a87a00',
    tape:'#d6e0e4', tapeEdge:[60, 80, 92], pin:['#ffffff', '#b8c4cc', '#3f4a52'], steel:['#f4f6f7', '#98a1a7', '#454d53'], flat:'#8a9399', hole:'#121a22',
    shadow:[4, 14, 24], vign:[4, 14, 24], page:'#1e272d' },
};
const PAL = PALS[new URLSearchParams(location.search).get('pal')] || PALS.base;
const rgba = (c, a) => { if (Array.isArray(c)) return `rgba(${c[0]},${c[1]},${c[2]},${a})`; const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
(r => { r.setProperty('--page', PAL.page); r.setProperty('--ink', PAL.ink); })(document.documentElement.style);
</script>
<style>
  :root { --song:"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif; --mono:"Courier New",Courier,monospace;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--page); color:var(--ink); font-family:var(--sans); }
  body { overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

</style>
</head>
<body>
<main id="stage"></main>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const lerp = (a, b, x) => a + (b - a) * x;

/* ━━ 公共：颜色、随机数、离屏画布 ━━ */
const C = PAL;                                   // 颜色只从顶部 PALS 来
const SONG = '"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif', HEI = '-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const IMPACT = 'Impact,"Arial Black","Helvetica Neue",sans-serif', MONO = '"Courier New",Courier,monospace', TIMES = 'Georgia,"Times New Roman",serif';
function rng(s) { s |= 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const stage = document.getElementById('stage'), cv = document.createElement('canvas'); stage.appendChild(cv);
const ctx = cv.getContext('2d');
let DPR = 1, VW = 0, VH = 0, U = 1, OX = 0, OY = 0, PORT = false, L = null, K = 1, STEP = 0, SPR = {};
const poly = (g, pts) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); };

/* ━━ T1 卡纸底：底色 + 斑驳 + 长短纤维（深浅两种）+ 细颗粒 ━━ */
function kraft(w, h, base = C.kraft, seed = 5) {
  const c = mk(w, h), g = c.getContext('2d'), r = rng(seed); g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 180; i++) { const x = r() * w, y = r() * h, R = (60 + r() * 260) * w / 1500, gr = g.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, r() < .5 ? rgba(C.kraftDark, .06) : rgba(C.kraftLight, .07)); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - R, y - R, 2 * R, 2 * R); }
  g.lineCap = 'round';
  for (let i = 0; i < w * h / 380; i++) { const x = r() * w, y = r() * h, l = 3 + r() * r() * 26, a = r() * 6.28;
    g.strokeStyle = r() < .5 ? rgba(C.kraftDark, .12 + r() * .16) : rgba(C.kraftLight, .1 + r() * .18); g.lineWidth = .5 + r() * .9;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .4) * l / 2, y + Math.sin(a + .4) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  g.putImageData(im, 0, 0); return c;
}

/* ━━ T2 网点滤镜：灰度图 → 45° 网点；暗处点大、亮处点小，最暗处点连成片。返回画布 + 每颗点的 y（给计数用） ━━ */
function halftone(src, cell = 7, angle = .785, ink = C.ink, paper = C.news) {
  const w = src.width, h = src.height, data = src.getContext('2d').getImageData(0, 0, w, h).data;
  const out = mk(w, h), g = out.getContext('2d'), ys = [];
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = paper; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = ink;
  const ca = Math.cos(angle), sa = Math.sin(angle), R = Math.hypot(w, h) / 2;
  for (let v = -R; v < R; v += cell) for (let u = -R; u < R; u += cell) {
    const x = w / 2 + u * ca - v * sa, y = h / 2 + u * sa + v * ca; if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const i = ((y | 0) * w + (x | 0)) * 4; if (data[i + 3] < 40) continue;
    const lum = (data[i] * .3 + data[i + 1] * .59 + data[i + 2] * .11) / 255, rr = cell * .66 * Math.sqrt(1 - lum);
    if (rr < .4) continue; g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill(); ys.push(y);
  }
  g.globalCompositeOperation = 'source-atop'; const r = rng(77);                       // 新闻纸的灰斑
  for (let i = 0; i < w * h / 90; i++) { g.fillStyle = r() < .5 ? rgba(C.stain, .12) : 'rgba(255,255,255,.18)'; g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2); }
  out.dots = ys.sort((a, b) => a - b); return out;
}

/* ━━ T3 主体：网点茶壶。先在灰度里画明暗（左上来光），再交给 T2 出网点，最后补刻线 ━━ */
// 本地坐标：壶身中心为原点，大约 640×470。换物件时只改 teapotShapes 和 shade。
const TP = { w: 660, h: 500, ox: 330, oy: 250 };
function teapotPaths(g) {
  const P = {};
  P.body = new Path2D(); P.body.ellipse(0, 30, 190, 150, 0, 0, 7);
  P.foot = new Path2D(); P.foot.moveTo(-112, 150); P.foot.lineTo(112, 150); P.foot.lineTo(124, 190); P.foot.lineTo(-124, 190); P.foot.closePath();
  P.lid = new Path2D(); P.lid.ellipse(0, -108, 100, 62, 0, Math.PI, 0); P.lid.lineTo(100, -100); P.lid.lineTo(-100, -100); P.lid.closePath();
  P.rim = new Path2D(); P.rim.ellipse(0, -104, 112, 20, 0, 0, 7);
  P.knob = new Path2D(); P.knob.arc(0, -190, 24, 0, 7); P.knob.rect(-10, -172, 20, 16);
  P.spout = new Path2D(); P.spout.moveTo(160, 100); P.spout.bezierCurveTo(250, 80, 260, -40, 312, -112); P.spout.lineTo(326, -100);
  P.spout.bezierCurveTo(300, -60, 290, 20, 182, -10); P.spout.closePath();
  P.handle = new Path2D(); P.handle.moveTo(-170, -60); P.handle.bezierCurveTo(-320, -110, -340, 80, -176, 112);
  return P;
}
function teapotGray(s) {                          // s：像素/单位
  const c = mk(TP.w * s, TP.h * s), g = c.getContext('2d'), P = teapotPaths(g);
  g.setTransform(s, 0, 0, s, TP.ox * s, TP.oy * s);
  const rad = (x, y, r0, x1, y1, r1, a, b) => { const q = g.createRadialGradient(x, y, r0, x1, y1, r1); q.addColorStop(0, a); q.addColorStop(1, b); return q; };
  g.lineCap = 'round'; g.lineWidth = 36; g.strokeStyle = '#555'; g.stroke(P.handle); g.lineWidth = 22; g.strokeStyle = '#9a9a9a'; g.stroke(P.handle);
  g.fillStyle = (() => { const q = g.createLinearGradient(160, 0, 320, -100); q.addColorStop(0, '#444'); q.addColorStop(.5, '#c8c8c8'); q.addColorStop(1, '#666'); return q; })(); g.fill(P.spout);
  g.fillStyle = rad(-80, -20, 10, 10, 40, 236, '#fbfbfb', '#3c3c3c'); g.fill(P.body);
  g.fillStyle = '#5a5a5a'; g.fill(P.foot); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(-100, 158, 200, 8);
  g.save(); g.clip(P.body); g.fillStyle = 'rgba(30,30,30,.55)'; g.fillRect(-200, -12, 400, 26); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(-200, -8, 400, 5);   // 腰线
  g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(60, 130, 200, 70, 0, 0, 7); g.fill(); g.restore();
  g.fillStyle = rad(-34, -146, 4, 0, -110, 120, '#f6f6f6', '#4a4a4a'); g.fill(P.lid);
  g.fillStyle = '#6a6a6a'; g.fill(P.rim); g.fillStyle = rad(-8, -198, 2, 0, -190, 26, '#ffffff', '#3a3a3a'); g.fill(P.knob);
  g.fillStyle = 'rgba(255,255,255,.95)'; g.beginPath(); g.ellipse(-95, -30, 38, 16, -.7, 0, 7); g.fill();                         // 高光
  return { c, P };
}
function engrave(spr, P, s, gray) {               // 刻线：外轮廓 + 顺着形体的弧线排线（只在暗面）
  const g = spr.getContext('2d'); g.save(); g.setTransform(s, 0, 0, s, TP.ox * s, TP.oy * s);
  g.strokeStyle = C.ink; g.lineJoin = g.lineCap = 'round';
  if (!gray) { g.save(); g.clip(P.body); g.lineWidth = 1.6;
    for (let k = 0; k < 9; k++) { g.beginPath(); g.ellipse(0, 30, 190 - k * 4, 150 - k * 3, 0, .15 + k * .02, 1.45 - k * .05); g.stroke(); }
    g.globalAlpha = .9; for (let a = -2.6; a < .5; a += .16) { g.beginPath(); g.arc(Math.cos(a) * 160, -10 + Math.sin(a) * 18 + 4, 3.2, 0, 7); g.fillStyle = C.ink; g.fill(); }   // 腰线上一圈小珠

// 1 底纸上：强调色纸圆 + 网点茶壶剪纸居中；左上勒索信字块「拼贴剪报」；两块报纸碎片压角、胶带、图钉；斜贴墨色横幅；印章。

function shot2(t, p) {

function shot4(t, p) {
