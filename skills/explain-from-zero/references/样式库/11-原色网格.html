<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>原色网格 样张</title>
<!--
风格：原色网格 PRIMARY GRID
一句话：圆、方、三角加黑，全部压在网格上、踩在拍子上，一拍一块搭起来；这一版用印刷四色，色块叠在一起会「叠印」出第二种色。
擅长表现：几样东西怎么拼成一个——每一块落在哪、占多大、和谁对齐，一拍一块看得清清楚楚；比例、规则、对比；
    也擅长把一个整体打散成纹样，让人看出它的规律。
搬到讲解里：
  先画辅助线和圆规圆，再一拍一块滑进来、咔哒对齐 → 讲一个东西由哪几块拼成、各块的比例和位置：用在「这个结构由哪几部分、怎么对齐」这类题；每落一块闪一个网格坐标。
  青色圆盘和黄色三角叠在一起，叠出绿（正片叠底）→ 讲两个因素叠加会出现第三种结果：用在「A 和 B 同时作用会怎样」这类题；引线标出「青 + 黄 = 绿」。
  整台自行车一拍打散成瓷砖、每拍一半转 90° → 讲同一套规则能铺成纹样：用在「这个规律放大了长什么样」；收尾的超大拍号数字把节奏收成一个数。
招牌细节：
  材质｜浅灰新闻纸 + 极淡网格线（一格 = 九分之一屏高）+ 细颗粒；四角裁切线、上下中线套准十字、页脚 CMYK 色标条。
  光｜不打光；色块用正片叠底压在纸上（mix-blend-mode: multiply），重叠的地方自然变暗变色，像四块印版先后印上去。
  主体｜一辆自行车：两个圆当轮子（青、品红）、黄色三角车架、品红半圆车座、青色四分之一圆车把、黄色方块车筐、黑色细条做骨架——每块都对齐网格交点。
  主体｜先画构成辅助线和圆规圆，再让形状一拍一块滑入、旋转 90°、咔哒对齐；落点闪一个坐标 (4, 6)。
  字｜只有小字和一个大数：字距拉开的 Futura 小字、等宽拍号；收尾一个横跨画面的超大拍号数字（空心描边，逐拍往上数）。
  动效｜120 BPM，一拍 0.5 秒：每个动作都从拍点开始、0.22 秒内到位，带一点点过冲再咔哒停住；移动时沿方向模糊。
  动效｜高潮：整辆车一拍打散成四分之一圆瓷砖，之后每拍有一半瓷砖转 90°；下一镜的黑底色版插页从纹样上推过去。
  角落小字｜页眉「拍 07 / 40」「四色套印 · 120 BPM」，页脚「构成 —— 自行车 40 拍」+ 已出场颜色的色标，越拍越多。
色彩结构（换题保留）：这一类的颜色本身就是语言。不能丢的：纸底 + 三个高饱和纯色 + 黑；三个纯色在色轮上大致等距
    （互相不像、谁也不混），明度一浅一中一深、面积相当；黑只管骨架（细条、轮毂、大数字）；纯色全部平涂，
    不加渐变、透明度和明暗，重叠的地方只靠 multiply 自然叠出。可以随题目换的：三个色相具体是哪三个（印刷四色、专色，
    或从主角推出来的一组等距色），以及哪个当主角（压在最上的色）、哪个当亮色、哪个当冷色。插页里的色名跟着配色走。
本例配色（从本例主体「一辆自行车」、现场「一张新闻纸上的四色套印」推出来，换题就换）：
    paper #E3E1D9 新闻纸灰｜hero #E5237F 品红｜bright #FFD400 黄｜cool #00A3E0 青｜black #1B1B1B；网格线 = 黑 7%
换题示例（?pal=alt，保留结构、换色相）：假设主角是「一把撑开的伞」、现场是「雨天街口的专色海报」→ 荧光粉当主角，
    柠檬黄当光，湖青当底，纸换成冷灰，黑换成墨；三个专色互相错开，「三个等距纯色 + 黑 + 纸」原样成立 →
    paper #DDE3E0｜hero #FF4F8B｜bright #FFE04A｜cool #25B5A5｜black #232A2E
字：小字 SVG <text>，拉丁小字 Futura → "Avenir Next" → "Century Gothic" → 无衬线；拍号等宽栈；超大数字用 Futura 粗体空心描边（fill none、stroke、miter 接头）。
动效：全部按拍：beat(t) = t / 0.5；snap(t, 拍, 时长) 给出 0→1（backK 1.2 的小过冲）；落地后 0.1 秒 2 单位的咔哒抖动；
    滑入时加单向运动模糊；高潮段每拍整个画面轻推 1.5%（镜头随拍子顶一下）。
做粗了 → 做精：
  形状随手摆 → 每块的端点都落在网格交点上，落点闪坐标
  动作软绵绵的淡入 → 从拍点起跳，0.22 秒到位，过冲一点再咔哒停
  颜色偏粉偏暗、互相太像 → 三个等距纯色 + 黑 + 纸；重叠处用 multiply，不手填「第四种颜色」，不加渐变、不加透明度
  一张静态海报 → 先画辅助线，一拍一块搭起来；高潮打散成纹样，黑底插页推过去
  页面只有图 → 页眉页脚的印刷小字、裁切线、套准十字、色标，海报才像印出来的
手机竖屏：网格改 9 列，自行车缩到上半部，超大数字和拍号放下半，色标放右下。
技法目录：
  T1 节拍时钟：beat / snap / 咔哒抖动
  T2 网格坐标系：grid → 舞台单位，横竖屏两套映射
  T3 形状库：半圆、四分之一圆、三角、方块、圆、粗细条，全部用网格单位描述；每块 mix-blend-mode: multiply（叠印）
  T4 构成辅助线 + 圆规圆（虚线逐段画出，带圆规针）
  T5 按拍滑入 / 旋转 / 弹出 + 单向运动模糊 + 落点坐标闪烁 + 叠印引线
  T6 瓷砖打散：按网格取色，四分之一圆瓷砖，每拍半数转 90°
  T7 黑底色版插页（旧「黑底色名插页」→ 四块印版：色、叠印算式、压在第几版）
  T8 超大拍号数字 + 印刷小字（裁切线、套准十字、色标）（旧「竖排超粗字」→ 空心大数字）
  T9 纸纹颗粒
  （配色在 <head> 里的 PALETTES：CSS 变量和 JS 共用，技法函数只认角色名）
-->
<script>
/* ━━ 配色：全片的颜色只在这里（CSS 变量和下面的 JS 共用）。默认 = 本例；网址带 ?pal=alt = 换题示例 ━━
   角色：paper 纸｜hero 主角色（压在最上的色、强调、当前拍）｜bright 亮色（黄）｜cool 冷色（青）｜black 骨架；names 是插页里的色名 */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  base: { paper: '#E3E1D9', hero: '#E5237F', bright: '#FFD400', cool: '#00A3E0', black: '#1B1B1B',
    names: { hero: ['品红', 'MAGENTA'], bright: ['黄', 'YELLOW'], cool: ['青', 'CYAN'], black: ['黑', 'KEY'] } },
  alt: { paper: '#DDE3E0', hero: '#FF4F8B', bright: '#FFE04A', cool: '#25B5A5', black: '#232A2E',
    names: { hero: ['荧光粉', 'PINK'], bright: ['柠檬黄', 'LEMON'], cool: ['湖青', 'TEAL'], black: ['墨', 'INK'] } },
};
const C = PALETTES[new URLSearchParams(location.search).get('pal') === 'alt' ? 'alt' : 'base'];
for (const k in C) if (typeof C[k] === 'string') document.documentElement.style.setProperty('--' + k, C[k]);
</script>
<style>
  :root {   /* 颜色变量由 <head> 里的 PALETTES 写入 */
    --zh:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --fu:Futura,"Avenir Next","Century Gothic","Trebuchet MS","Segoe UI",sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--paper); color:var(--black); font-family:var(--zh); }
  body { overflow:hidden; -webkit-font-smoothing:antialiased; }
  #stage { position:fixed; inset:0; }
  #stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .zh { font-family:var(--zh); font-weight:800; }
  .fu { font-family:var(--fu); font-weight:700; }
  .mono { font-family:var(--mono); font-weight:600; }
  #grain { position:fixed; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.7; background-size:256px 256px; }
</style>
</head>
<body>
<main id="stage"><svg id="sv" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg></main>
<div id="grain"></div>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ T1 节拍时钟：120 BPM，一拍 0.5 秒；动作从拍点起跳、0.22 秒到位 ━━ */
const BEAT = .5;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const backK = k => x => 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2);
const snapE = backK(1.2);                                   // 小过冲：冲 4% 再停
const beatOf = t => t / BEAT;
// 第 b 拍开始的动作，dur 秒走完：返回 0→1（带过冲）
function snap(t, b, dur = .22) { const x = clamp((t - b * BEAT) / dur); return x <= 0 ? 0 : snapE(x); }
const raw = (t, b, dur = .22) => clamp((t - b * BEAT) / dur);
// 咔哒：到位后 0.1 秒内抖 2 单位
const click = (t, b, dur = .22) => { const u = t - b * BEAT - dur; return u > 0 && u < .1 ? Math.sin(u * 90) * 2.2 * (1 - u / .1) : 0; };

const NS = 'http://www.w3.org/2000/svg';
function E(tag, at, parent) { const e = document.createElementNS(NS, tag); if (at) for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
function A(e, at) { for (const k in at) e.setAttribute(k, at[k]); return e; }
function T(parent, str, x, y, size, at = {}) { const e = E('text', Object.assign({ x, y, 'font-size': size }, at), parent); e.textContent = str; return e; }
// 颜色对象 C 在 <head> 的 PALETTES 里，这里只按角色取：C.paper C.hero C.bright C.cool C.black；色名在 C.names
const NM = k => C.names[k][0], NE = k => C.names[k][1];
function rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }

/* ━━ T2 网格坐标系：一格 100 单位。横屏 16×9 的构图居中；竖屏 9 列，自行车按比例缩进 9 列放上半 ━━ */
let L = { W: 2000, H: 1000, P: false, gx: 200, gy: 50, cols: 16, rows: 9 };
const U = 100;
// 自行车在横屏网格里的坐标 → 当前舞台单位
function gp(x, y) {
  if (!L.P) return [L.gx + x * U, L.gy + y * U];
  return [L.gx + ((x - 2) * .73 + .3) * U, L.gy + ((y - .5) * .73 + 4.9) * U];
}
const gs = v => v * U * (L.P ? .73 : 1);   // 网格长度 → 舞台长度

/* ━━ T3 形状库：都用网格单位描述，出 SVG path ━━ */
const PIECES = [
  { id: 'rw', k: 'circ', cx: 5, cy: 6, r: 2, c: C.cool, in: { b: 1, from: [-9, 0], blur: 'x' } },
  { id: 'fw', k: 'circ', cx: 12, cy: 6, r: 2, c: C.hero, in: { b: 2, from: [9, 0], blur: 'x' } },
  { id: 'ch', k: 'bar', p: [[5, 6], [7, 6]], w: .22, c: C.black, in: { b: 3, from: [0, 6], blur: 'y' } },
  { id: 'fk', k: 'bar', p: [[10, 3], [12, 6]], w: .22, c: C.black, in: { b: 3, from: [0, 6], blur: 'y' } },
  { id: 'tri', k: 'tri', p: [[5, 3], [10, 3], [7, 6]], c: C.bright, in: { b: 4, from: [0, -6], blur: 'y' } },
  { id: 'basket', k: 'rect', x: 11, y: 3, w: 2, h: 1.5, c: C.bright, in: { b: 6, from: [6, 0], blur: 'x' } },
  { id: 'post', k: 'bar', p: [[5, 3], [5, 2]], w: .2, c: C.black, in: { b: 8, from: [0, -5], blur: 'y' } },
  { id: 'stem', k: 'bar', p: [[10, 3], [10, 2]], w: .2, c: C.black, in: { b: 8, from: [0, -5], blur: 'y' } },
  { id: 'saddle', k: 'semi', cx: 5, cy: 3.5, r: 1, c: C.hero, in: { b: 5, from: [0, -7], rot: 90, blur: 'y' } },
  { id: 'quad', k: 'quad', cx: 10, cy: 2, r: 1, c: C.cool, in: { b: 7, from: [3, -3], rot: 90, blur: 'x' } },
  { id: 'hubR', k: 'circ', cx: 5, cy: 6, r: .5, c: C.paper, nm: 1, in: { b: 9, pop: 1 } },
  { id: 'hubF', k: 'circ', cx: 12, cy: 6, r: .5, c: C.paper, nm: 1, in: { b: 9, pop: 1 } },
  { id: 'crank', k: 'circ', cx: 7, cy: 6, r: .4, c: C.black, in: { b: 9, pop: 1 } },
  { id: 'dot', k: 'circ', cx: 9.5, cy: 2.4, r: .22, c: C.hero, in: { b: 9, pop: 1 } },
];
const pieceById = id => PIECES.find(p => p.id === id);
function pathOf(p) {
  const f = n => n.toFixed(1);
  if (p.k === 'rect') { const [x, y] = gp(p.x, p.y); return `M${f(x)} ${f(y)}h${f(gs(p.w))}v${f(gs(p.h))}h${f(-gs(p.w))}Z`; }
  if (p.k === 'tri') return 'M' + p.p.map(q => gp(...q).map(f).join(' ')).join('L') + 'Z';
  if (p.k === 'bar') {                                                       // 粗细条：两个端点 + 宽度，方头
    const [a, b] = p.p.map(q => gp(...q)), dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy), w = gs(p.w) / 2, nx = -dy / n * w, ny = dx / n * w;
    return `M${f(a[0] + nx)} ${f(a[1] + ny)}L${f(b[0] + nx)} ${f(b[1] + ny)}L${f(b[0] - nx)} ${f(b[1] - ny)}L${f(a[0] - nx)} ${f(a[1] - ny)}Z`;
  }
  const [cx, cy] = gp(p.cx, p.cy), r = gs(p.r);
  if (p.k === 'circ') return `M${f(cx - r)} ${f(cy)}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0Z`;
  if (p.k === 'semi') return `M${f(cx - r)} ${f(cy)}A${f(r)} ${f(r)} 0 0 1 ${f(cx + r)} ${f(cy)}Z`;          // 平边朝下的半圆
  if (p.k === 'quad') return `M${f(cx)} ${f(cy)}V${f(cy - r)}A${f(r)} ${f(r)} 0 0 1 ${f(cx + r)} ${f(cy)}Z`;  // 右上四分之一圆
}
const centerOf = p => p.k === 'rect' ? gp(p.x + p.w / 2, p.y + p.h / 2) : p.k === 'tri' ? gp(7.3, 4) : p.k === 'bar' ? gp((p.p[0][0] + p.p[1][0]) / 2, (p.p[0][1] + p.p[1][1]) / 2) : gp(p.cx, p.cy);
// 瓷砖色区：[x, y, 地盘大小, 颜色]；不在任何形状上的格子取最近色区的颜色
const ZONE = [[5, 6, 3, C.cool], [12, 6, 3, C.hero], [7.5, 3.6, 2.2, C.bright], [7, 8.6, 1.6, C.black], [2, 9, 2.4, C.cool], [13, 9.5, 2.4, C.hero], [1, 1, 2.2, C.hero], [15, 1.2, 2, C.cool], [14.8, 8.4, 2, C.bright], [8, 1, 1.5, C.black]];
// 点 (x, y)（横屏网格坐标）落在哪块形状上：瓷砖取色用
function hit(x, y) {
  for (let i = PIECES.length - 1; i >= 0; i--) {
    const p = PIECES[i];
    if (p.k === 'rect' && x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return p.c;
    if ((p.k === 'circ') && Math.hypot(x - p.cx, y - p.cy) <= p.r) return p.c;
    if (p.k === 'semi' && y <= p.cy && Math.hypot(x - p.cx, y - p.cy) <= p.r) return p.c;
    if (p.k === 'quad' && y <= p.cy && x >= p.cx && Math.hypot(x - p.cx, y - p.cy) <= p.r) return p.c;
    if (p.k === 'tri') { const [A0, B0, C0] = p.p, sg = (a, b, c) => (a[0] - c[0]) * (b[1] - c[1]) - (b[0] - c[0]) * (a[1] - c[1]), q = [x, y], d1 = sg(q, A0, B0), d2 = sg(q, B0, C0), d3 = sg(q, C0, A0);
      if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) return p.c; }
    if (p.k === 'bar') { const [a, b] = p.p, dx = b[0] - a[0], dy = b[1] - a[1], u = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy)); if (Math.hypot(x - a[0] - dx * u, y - a[1] - dy * u) <= p.w / 2) return p.c; }
  }
  return null;
}

/* ━━ 舞台图层 ━━ */
const sv = document.getElementById('sv');

  // 镜3 · 打散成瓷砖：每格转 90° 的倍数。
  { beats: 9 },
  // 镜4 · 四块印版，一版一拍；数字数到 40。
  { beats: 10 },
];
SHOTS.forEach(s => s.dur = s.beats * BEAT);
const beat0 = k => SHOTS.slice(0, k).reduce((a, s) => a + s.beats, 0);
function common(t, k) {
  const gb = beat0(k) + Math.floor(beatOf(t)) + 1;
  pr.beat.textContent = `拍 ${String(Math.min(40, gb)).padStart(2, '0')} / 40`;
  // 色标：颜色出场一种亮一块
  const shown = k === 0 || k >= 2 ? 4 : t >= 3.5 ? 4 : t >= 2.5 ? 3 : t >= 1 ? 2 : 0;
  pr.sw.forEach((r, i) => A(r, { opacity: i < shown ? 1 : .12 }));
}
// 镜 1：完整海报。之后每拍后轮轮毂外圈闪一下、车铃轻晃
SHOTS[0].draw = t => {
  common(t, 0); drawCons(0, 0); drawTiles(0, false); A(pc.info, { opacity: 1 });
  // 从上一轮的插页循环回来：黑板在第 0 拍往右推开，露出海报
  drawInsert(99, fromLoop && t < .3, t);
  compAll(true); typeG.style.display = ''; typeG.style.opacity = 1;
  const b = Math.floor(beatOf(t)), ph = beatOf(t) - b;
  A(pc.ring, { r: gs(.8) + gs(.7) * ph, opacity: (1 - ph) * .9 });
  const side = b % 2 ? 1 : -1, sw = snap(t, b, .18);
  A(pc.dot.g, { transform: `translate(${gs(.12) * (b === 0 ? 0 : side * (2 * sw - 1))} 0)` });
  A(an.lead, { opacity: 0 }); A(an.flash, { opacity: 0 }); drawBeatReadout(t, 0, 10, false);
  A(cam, { transform: '' });
};
// 镜 2：辅助线（第 0 拍），然后 1–9 拍一块一块落位；落点闪坐标；黄三角叠上青轮时拉叠印引线
SHOTS[1].draw = t => {
  common(t, 1); drawTiles(0, false); drawInsert(0, false); typeG.style.display = ''; A(pc.info, { opacity: 0 });
  const cu = clamp(t / 1.0), fade = t < 5 ? 1 - .75 * clamp((t - 4.6) / .4) : .25;
  drawCons(cu, Math.max(.25, fade));
  drawAssembly(t, 0, true);
  A(pc.ring, { opacity: 0 }); typeG.style.opacity = 1;
  // 当前拍落下的那块：在它的锚点闪一个十字 + 坐标
  const b = Math.floor(beatOf(t)), cand = PIECES.filter(p => p.in.b === b && p.id !== 'dot');
  const ph = beatOf(t) - b;
  if (cand.length && ph > .44) {
    const p = cand[0], g = p.k === 'rect' ? [p.x, p.y] : p.k === 'tri' || p.k === 'bar' ? p.p[0] : [p.cx, p.cy];
    const [x, y] = gp(...g);
    A(an.flash, { transform: `translate(${x} ${y})`, opacity: ph < .95 ? 1 : 0 });
    an.ftxt.textContent = `(${g[0]}, ${g[1]})`;
  } else A(an.flash, { opacity: 0 });
  const lv = clamp((t - 2.45) / .25), [sx, sy] = gp(6.5, 5.2);
  const mid = [sx, L.gy + (L.P ? 3.2 : .8) * U], end = [Math.min(mid[0] + 40, L.W - an.tw - 50), mid[1]];
  A(an.lead, { opacity: lv > 0 ? 1 : 0 });
  A(an.lline, { points: [[sx, sy], mid, end].map(p => p.join(',')).join(' '), 'stroke-dasharray': 600, 'stroke-dashoffset': 600 * (1 - lv) });
  A(an.ldot, { cx: sx, cy: sy });
  const ts = snap(t, 5.5, .2);
  A(an.ltag, { transform: `translate(${end[0]} ${end[1] - (L.P ? 42 : 32) * ts}) scale(${ts})` });
  drawBeatReadout(t, 0, 11, true);
  A(cam, { transform: '' });
};
// 镜 3：高潮。整辆车一拍打散成瓷砖，1–5 拍转，第 6 拍收回；镜头随拍顶一下
SHOTS[2].draw = t => {
  common(t, 2); drawCons(0, 0); drawInsert(0, false); typeG.style.display = ''; A(pc.info, { opacity: 1 });
  // 打散后就停在纹样上，下一镜的黑板从它上面推过去
  compAll(t < .02);
  drawTiles(t, true);
  typeG.style.opacity = t < .1 ? 1 : 0;
  A(pc.ring, { opacity: 0 }); A(an.lead, { opacity: 0 }); A(an.flash, { opacity: 0 }); drawBeatReadout(t, 0, 9, false);
  const ph = beatOf(t) % 1, kick = 1 + .015 * Math.exp(-ph * 9);
  A(cam, { transform: `translate(${L.W / 2} ${L.H / 2}) scale(${kick}) translate(${-L.W / 2} ${-L.H / 2})` });
};
// 镜 4：黑底色版插页，四块印版一拍一块，停在插页上；超大拍号数字逐拍往上数；下一轮镜 1 的第 0 拍把它推开
SHOTS[3].draw = t => {
  common(t, 3); drawCons(0, 0); A(pc.info, { opacity: 1 });
  // 黑板没盖满之前，底下还是上一镜的瓷砖；盖满后换成关着灯的海报，等下一轮第一镜推开黑板时露出来
  const covered = raw(t, 0, .24) >= 1;
  drawTiles(SHOTS[2].dur, !covered);
  compAll(covered); typeG.style.display = ''; typeG.style.opacity = covered ? 1 : 0;
  drawInsert(t, true); ins.num.textContent = String(Math.min(40, beat0(3) + Math.floor(beatOf(t)) + 1));
  A(pc.ring, { opacity: 0 }); A(an.lead, { opacity: 0 }); A(an.flash, { opacity: 0 }); drawBeatReadout(t, 0, 10, false);
  A(cam, { transform: '' });
};

function relayout() {
  const r = document.getElementById('stage').getBoundingClientRect();
  const P = r.height > r.width * 1.02;
  if (P) { const W = 980; L = { W, H: W * r.height / r.width, P, gx: 40, gy: 66, cols: 9 }; }
  else { const H = 1000, W = H * r.width / r.height; L = { W, H, P, gx: (W - 1600) / 2, gy: 50, cols: 16 }; }
  sv.setAttribute('viewBox', `0 0 ${L.W} ${L.H}`);
  A(paperR, { width: L.W, height: L.H });
  buildPrint(); buildCons(); buildComp(); buildTiles(); buildType(); buildInsert(); buildAnn();
}

const P0 = makePlayer(SHOTS, {
  onShot(i, s) {
    fromLoop = cur === SHOTS.length - 1 && i === 0 && SHOTS.__started; SHOTS.__started = true; cur = i;
  },
  onResize() { relayout(); },
});
</script>
