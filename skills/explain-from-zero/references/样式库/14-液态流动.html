<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态流动样张</title>
<!--
风格：液态流动 LIQUID MOTION
一句话：画面里的一切都是会粘、会拉丝、会融回去的果冻；光能透进去，边缘发深，表面挂着两道高光，脚下有一块会反光的地面。
擅长表现：溶解、扩散、融合和分裂——一样东西怎么粘上、拉开、化进另一样里，「一点点」怎么引起一串连锁变化。
招牌细节：
  材质｜果冻：厚处颜色浓、薄边透亮（厚度吸收）；边缘发深（菲涅耳）；体内有缓慢流动的色斑和小气泡。
  光　｜一条贴着上缘的弧形长高光 + 一个小硬光点；下缘有透过来的光（内部透光）；透过水滴看到后面被挤歪的光柱（折射）。
  主体｜水滴不是圆：先拉长再断开、落下时被拉长、落地压扁成水洼、溅出小滴、小滴之间先长出桥再融回去（smooth-min 融球）。
  现场｜一面墙 + 斜光柱 + 会反光的地面：倒影越远越淡越糊，贴地一层雾，落点起水波纹。
  字　｜显示字就是果冻字：和水滴共用一张距离场、一套光，所以水滴能长成字、字下缘能挂滴垂。
  动效｜预备（拉长）→ 动作 → 挤压回弹；溅出的小滴错峰落地、错峰被拉回；镜头切换的节拍上背景闪一下强调色。
  角落小字｜VISC. / IOR / k 这类参数。
色彩结构（换题保留）：
  底　｜一个色相的墙（上下两档明度）+ 地面（再压一档）+ 同色相更亮的斜光柱和贴地雾；低饱和，只当舞台。
        暗底不是这种做法离不开的：透光、折射、倒影在亮底上照样成立，底亮底暗由现场的光定。亮底时三处跟着换：
        外溢的光改成透过果冻落下的有色影子，阴影和暗角用底色相的深色（不用灰黑），字和底带改成深字 + 浅色半透明带。
  主角｜果冻三色：三个相邻色相排成左→右渐变，全片饱和度最高的只有它；受光不平涂——厚处同色自乘变浓、边缘压成同色深一档、下缘透出同色亮光。
  线　｜高光、气泡、引线、水波纹：接近白、带一点光源色。字按底的明暗取反。
  强调｜主角中间色的浅色：只用在切镜和落地那一下的闪光，和读数的大数字。
本例配色（从本例主体「一滴会变色的果冻」和它的现场「夜里一间梅紫色小屋，顶上斜进几束光」推出来，换题就换）：
  wallTop #120416 · wallLow #300b33 · floor #130416 · beam #a82b85 · fog #9e3385 · jelly #ff752b → #ff3d8a → #a34dff
  spec #fff0f7 · lip #ff8ccc · flash #ff61ad · ink #fff3fb（全表见下方 PALETTES.main）
换题示例（?pal=alt）：假设主角是「一滴蜂蜜」、现场是「清晨窗边的白瓷台面」→ 晨光暖、瓷面偏冷白，底取暖白墙 + 冷白瓷台，
  光柱是更亮的暖光；蜂蜜自己的蜜黄 → 琥珀 → 深琥珀当主角渐变，暗边自乘成深琥珀；亮底，所以影子和暗角用暖棕、字用深棕：
  wallTop #dccfbd · wallLow #f5ede2 · floor #d9dcdc · beam #4d3a1f（亮底上加光要少）· jelly #f7b52c → #e3851c → #b9531a
  shadow #8c5a26 · flash #ffe2a0 · ink #2b1a0b
字：显示字用 Canvas 2D 按系统粗黑体画出 → CPU 上做精确距离变换（Felzenszwalb）→ RG16F 距离场纹理（锐利 + 糊过两个通道）→ 着色器里加粗、晃动、和水滴 smooth-min、上果冻光。
    系统没有粗体也不怕：加粗靠距离场减一个常数。
    取舍：SVG 滤镜（feGaussianBlur + feSpecularLighting）也能做果冻字，但做动画在手机 Safari 上掉帧、光像塑料，也没法和水滴真正融合；
    距离场纹理开场算一次（约 30–80ms），每帧只采样，手机上更稳。
    正文黑体栈；参数、读数用等宽栈。
动效：落体用真实重力（y = y0 − g·t²/2），速度越快拉得越长；落地压扁有过冲和两三下回弹（e^-t·sin）；
      小滴按离中心远近错峰 0.26s 被拉回；切镜时背景闪粉 0.15s；整片 60fps 连续（所有动画都是镜头时间的函数）。
做粗了 → 做精：
  · 两个 CSS 圆角色块叠在一起 → 距离场 smooth-min，靠近时先长出桥（第三镜左右对比）
  · 一层径向渐变当水滴 → 圆顶法线 + 折射 + 厚度吸收 + 边缘深 + 两道高光 + 下缘透光 + 气泡
  · 水滴匀速落下、落地就停 → 预备拉长、按重力加速、压扁过冲、回弹、溅出小滴
  · 地面一条线 → 镜像倒影（越远越淡越糊）+ 贴地雾 + 落点水波推动倒影
手机竖屏：相机改成按宽度取景，字和地面放到上方 60% 处，倒影在中段；
      对比镜的两个标签上下错开；读数挪到画面右上。
技法目录（颜色一律从顶部 PALETTES 传入：CSS 变量 + 着色器 uniform）：
  T1 距离场字（Canvas 画字 → 精确距离变换 → 滴垂锚点和气泡位置）
  T2 融球场（椭圆 / 锥形胶囊 / 字 → smooth-min，k 参数化，带混色；k<0 走硬 min 平涂）
  T3 果冻光（圆顶法线 → 折射、厚度吸收、边缘深、内部透光、体内色流、弧形高光、点高光、底边反光、气泡）
  T4 现场（墙、光柱、地面倒影、水波、贴地雾、闪粉）
  T5 后期（光晕外溢、暗角、颗粒）
  T6 编排（悬垂断开、重力落体、压扁回弹、溅射、拉回融合、分裂、长成字）
  T7 引线标注与跳动读数（世界坐标 → 屏幕坐标）
  T9 WebGL 外壳（全屏三角形、只在变化时重画、按帧时降分辨率）
  T10 退路（拿不到 WebGL2 时 Canvas 2D 静态画面）
-->
<script>
/* ━━ 配色：全片颜色只在这一处。换题只换这张表；网址带 ?pal=alt 切到换题示例 ━━
   着色器颜色走 uniform、页面走 CSS 变量、退路画面走 JS，三处都从这里取。 */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  main: {  // 主体「一滴会变色的果冻」· 现场「夜里一间梅紫色小屋，顶上斜进几束光」
    wallTop: '#120416', wallLow: '#300b33', floor: '#130416', halo: '#57124d', beam: '#a82b85', fog: '#9e3385',
    jelly: ['#ff752b', '#ff3d8a', '#a34dff'], spec: '#fff0f7', lip: '#ff8ccc', edgeTint: '#ffffff', edgeDepth: .46,
    flash: '#ff61ad', shadow: '#000000', vignette: '#000000', vigAmt: .95, lift: '#000000', grain: .035,
    glow: .11, wallTex: .2, floorTex: .24,
    ink: '#fff3fb', panelHi: '#ffd7f0', line: '#ffaae1', accent: '#ffb6da',
    drop: '#08000a', tag: '#1e0622', sigShadow: '#140014', jellyDeep: '#540a3c',
    num: ['#ffffff', '#ffb0d6', '#ff4f97'], ring: '#ffc6e4', lead: '#ffd2ea', anchor: '#ffffff',
  },
  alt: {  // 主体「一滴蜂蜜」· 现场「清晨窗边的白瓷台面」
    wallTop: '#dccfbd', wallLow: '#f5ede2', floor: '#d9dcdc', halo: '#1a1206', beam: '#4d3a1f', fog: '#3a2c18',
    jelly: ['#f7b52c', '#e3851c', '#b9531a'], spec: '#fffaf0', lip: '#ffd47a', edgeTint: '#ffe8cc', edgeDepth: .5,
    flash: '#ffe2a0', shadow: '#8c5a26', vignette: '#b8a07e', vigAmt: .5, lift: '#000000', grain: .022,
    glow: .07, wallTex: .07, floorTex: .08,
    ink: '#2b1a0b', panelHi: '#ffffff', line: '#b07a3a', accent: '#a4500e',
    drop: '#5a3712', tag: '#fffaf3', sigShadow: '#ffffff', jellyDeep: '#6e3506',
    num: ['#a4500e', '#d07418', '#f2a826'], ring: '#b9792f', lead: '#8a4a12', anchor: '#6e3506',
  },
};
const PALETTE = PALETTES[new URLSearchParams(location.search).get('pal')] || PALETTES.main;
const hex01 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const rgba = (h, a) => `rgba(${hex01(h).map(v => Math.round(v * 255)).join(',')},${a})`;
const lum = h => { const [r, g, b] = hex01(h); return .3 * r + .59 * g + .11 * b; };
(function applyPalette(P) {  // 页面用的 CSS 变量：透明度这类结构值写在这里，色相全来自 P
  const v = { '--bg': P.wallTop, '--ink': P.ink, '--dim': rgba(P.ink, .72), '--faint': rgba(P.ink, .5), '--line': rgba(P.line, .22),
    '--accent': P.accent, '--bandHi': rgba(P.panelHi, .24),
    '--drop': rgba(P.drop, .5), '--tagBg': rgba(P.tag, .78), '--tagLine': rgba(P.line, .32),
    '--numGlow': rgba(P.jelly[1], .45), '--sigShadow': rgba(P.sigShadow, .9),
    '--ring': P.ring, '--lead': P.lead, '--anchor': P.anchor,
    '--stageBg': `radial-gradient(60% 45% at 50% 38%,${rgba(P.beam, .3)} 0%,${rgba(P.beam, 0)} 70%),linear-gradient(180deg,${P.wallTop} 0%,${P.wallLow} 66%,${P.floor} 66.5%,${P.floor} 100%)` };
  P.num.forEach((c, i) => v['--n' + i] = c);
  for (const k in v) document.documentElement.style.setProperty(k, v[k]);
})(PALETTE);
</script>
<style>
  :root { /* 颜色变量由顶部 applyPalette 写入；这里只放字体 */
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  body { overflow:hidden; -webkit-font-smoothing:antialiased; }
  #stage { position:fixed; inset:0;    /* 画布出第一帧之前先垫一张同色的 CSS 底，不会黑一下 */

  }
</style>

<body>
<main id="stage">
  <canvas id="gl"></canvas>
  <svg id="ov" aria-hidden="true">
    <g id="rings" fill="none" style="stroke:var(--ring)"></g>
    <path id="ld" fill="none" style="stroke:var(--lead)" stroke-width="1.5" opacity="0"/>
    <circle id="la" r="5" style="fill:var(--anchor)" opacity="0"/><circle id="la2" r="11" fill="none" style="stroke:var(--anchor)" stroke-width="1" opacity="0"/>
  </svg>
  <div id="tag" class="fl tag"><b>拉丝桥</b><code>smin · k 0.08</code></div>

  <div id="cmpL" class="fl tag"><b>两个圆叠在一起</b><code>min(a, b)</code></div>
  <div id="cmpR" class="fl tag"><b>先拉出桥，再融成一个</b><code>smin(a, b, k)</code></div>
  <div id="sig" class="fl"><b>果冻字 · 距离场融球</b><small>JELLY TYPE · SDF METABALLS</small></div>
</main>
<aside id="meta"><span>VISC. 0.82 · IOR 1.33</span><span>k <b id="kv">0.08</b> · B 0.12</span></aside>

<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const mix = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];

/* ━━ T1 距离场字：Canvas 画字 → 精确距离变换（Felzenszwalb）→ 世界单位的距离 ━━ */
// 一维平方距离变换（下包络抛物线），先按列、再按行各跑一遍就是二维精确欧氏距离
function edt1d(g, off, step, n, f, v, z) {
  for (let q = 0; q < n; q++) f[q] = g[off + q * step];
  v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1, k = 0, s = 0; q < n; q++) {
    do { const r = v[k]; s = (f[q] - f[r] + q * q - r * r) / (q - r) / 2; } while (s <= z[k] && --k > -1);
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  for (let q = 0, k = 0; q < n; q++) { while (z[k + 1] < q) k++; const r = v[k]; g[off + q * step] = f[r] + (q - r) * (q - r); }
}
function edt(g, W, H) {
  const n = Math.max(W, H), f = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < W; x++) edt1d(g, x, W, H, f, v, z);
  for (let y = 0; y < H; y++) edt1d(g, y * W, 1, W, f, v, z);
}
function blur3(src, W, H, r) {  // 三遍横 + 三遍竖的滑动平均
  let a = Float32Array.from(src), b = new Float32Array(src.length);
  const pass = (s, d, n, m, st, ln) => { for (let j = 0; j < m; j++) { const o = j * ln; let acc = 0;
    for (let k = -r; k <= r; k++) acc += s[o + clamp(k, 0, n - 1) * st];
    for (let q = 0; q < n; q++) { d[o + q * st] = acc / (2 * r + 1); acc += s[o + Math.min(q + r + 1, n - 1) * st] - s[o + Math.max(q - r, 0) * st]; } } };
  for (let it = 0; it < 3; it++) { pass(a, b, W, H, 1, W); [a, b] = [b, a]; }
  for (let it = 0; it < 3; it++) { pass(a, b, H, W, W, 1); [a, b] = [b, a]; }
  return a;
}
// 参数：text 字、worldW 字框在世界里的宽、W×H 纹理大小（宽高比 2:1）
function makeWordSDF(text, worldW, W = 1024, H = 512) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  const fam = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif';
  let fs = H * .76; g.font = `900 ${fs}px ${fam}`;
  const mw = g.measureText(text).width; if (mw > W * .86) { fs *= W * .86 / mw; g.font = `900 ${fs}px ${fam}`; }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText(text, W / 2, H / 2 + fs * .02);
  const a = g.getImageData(0, 0, W, H).data, N = W * H, o = new Float64Array(N), n = new Float64Array(N);
  for (let i = 0; i < N; i++) {  // 半透明边缘按覆盖率给亚像素初值，字边才不起锯齿
    const v = a[i * 4 + 3] / 255;

  const toW = (x, y) => ({ x: (x / W - .5) * worldW, y: (.5 - y / H) * worldW * H / W });

  const bub = []; let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let k = 0; k < 6000 && bub.length < 15; k++) {
    const x = rnd() * W | 0, y = rnd() * H | 0, si = inner[y * W + x];
    if (si < 11) continue;
    const r = Math.min(si * .4, 4 + rnd() * 7);

    drips: drips.map(d => toW(d.x, d.y - 6)),
    bubbles: bub.map(b => Object.assign(toW(b.x, b.y), { r: b.r * px })) };
}

function makeGL(canvas) {
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; };
  const v = sh(gl.VERTEX_SHADER, VS), f = sh(gl.FRAGMENT_SHADER, FS);
  if (!v || !f) return null;
  const pr = gl.createProgram(); gl.attachShader(pr, v); gl.attachShader(pr, f); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); return null; }
  gl.useProgram(pr);
  const U = new Proxy({}, { get: (o, k) => k in o ? o[k] : (o[k] = gl.getUniformLocation(pr, k)) });
  return { gl, U };
}

/* ━━ 场景常量（世界单位：横屏画面高 2.0） ━━ */
const FLOOR = -.44, WORD = { x: 0, y: .15, w: .84, h: .42 }, G = 4.2;

const BUILD = [shot1, shot2, shot3];
SHOTS.forEach((s, i) => s.draw = (t, p, S) => {
  if (S.reduce) t = s.still;  // 减弱动态：每镜只画一张代表帧
  const T = SHOTS.slice(0, i).reduce((a, q) => a + q.dur, 0) + t;
  const key = i + '|' + t.toFixed(4) + '|' + view.W + 'x' + view.H;
  if (key === lastKey) return; lastKey = key;
  reset(); st.T = T; BUILD[i](t, view);
  const z = st.zoom, ay = WORD.y - .1;  // 推镜以主体为锚
  view.cam = { x: view.cx, y: ay + (view.cy - ay) * z + st.dy, u: view.u * z };
  if (G2) render(T); else if (!cv.dataset.fb) { cv.dataset.fb = 1; drawFallback(); }
  cv.classList.add('on');
  overlay(i, t);
});
makePlayer(SHOTS, {
  onShot(i, s) {
    lastKey = ''; shownCount = -1;
  },
  onResize(S) { layout(S); if (!G2) { delete cv.dataset.fb; } },
});
</script>
</body>
