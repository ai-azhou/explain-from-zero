<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数据特稿样张</title>
<!--
风格：数据特稿 DATA FEATURE
一句话：报纸数据版的做法——一张纸、一种墨、只有一种颜色；线和字都很细，颜色只给要读的那一条，话直接写在数据旁边。
擅长表现：从一群数据里让一条线、一根柱自己跳出来——随时间怎么走、谁比谁大、多了多少；话写在数据旁边，读者不用来回对图例。
招牌细节：
  材质  新闻纸：feTurbulence 纤维 + 低频斑驳 + 四角压暗；墨不是纯黑（纯白），带一点纸的色温。
  光    几乎没有光，只有纸面左上一层很淡的环境光；层次全靠墨色深浅：墨 / 深灰 / 中灰 / 发丝灰。
  主体  图表本身：1px 墨色基线、发丝网格、5px 短刻度；高亮线下垫一条纸色描边（把灰线「切开」）。
  主体  注释 = 锚点小圆 + 一条引线 + 一句话，文字带纸色描边压住底下的线；不用图例。
  字    大号宋体标题 + 黑体正文 + 等宽数字；超大关键数字用 Didot / Bodoni 一类高反差衬线。
  动效  线从左往右揭开（clipPath 矩形，不用 dasharray，头点按 x 插值）；柱子从基线长、错峰 60ms。
  动效  聚焦：其余元素退成浅灰并淡出读数；数字逐位滚动（里程表式进位）。
  角落  报头双线、版号 A16、「示例数据」框、来源行 12px 灰字。
色彩结构（换题保留）：一张底（纸）+ 一种墨（字、轴、基线）+ 由墨和底调出的四级灰（深灰正文 / 说明字 /
  灰线 / 发丝网格）+ 一种强调色。全部平涂、不受光；灰低饱和、和底同一个色温。强调色只给「要读的那一个」：
  高亮线、聚焦的柱、结论大数字；其余一律退成灰。底亮底暗由现场定：白天的纸是浅底深墨，
  夜里的现场就深底浅墨，结构不变。所有颜色在文件顶部 PALETTES 里，技法代码只读变量。
本例配色（从本例主体「早报数据版上的一条示例走势」和它的现场「暖白新闻纸、油墨、红笔圈重点」推出来，换题就换）：
  --paper #f3eee3 / --ink #161513 / --ink2 #3a3732 / --grey #8a847a / --grey2 #b9b2a6 / --hair #dcd4c6 / --accent #d23f29
换题示例（?pal=alt）：假设主角是「港口夜里的一盏航标灯」、现场是「起雾的深夜海港」→ 底取夜色的深海军蓝，
  墨取雾的冷白，四级灰全部往蓝灰走，唯一的颜色留给灯的琥珀。
  --paper #0f1820 / --ink #e8edef / --ink2 #b3bec4 / --grey #7f8d96 / --grey2 #3e4c56 / --hair #1f2b34 / --accent #f2a23c
字：标题 "Songti SC","STSong","Noto Serif CJK SC",SimSun,Georgia,serif 加粗；
    正文 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif；
    数字 "SF Mono",Menlo,Consolas,monospace + tabular-nums；大数字 Didot,"Bodoni 72","Times New Roman",serif。
动效：干净的 ease-out 和 inOut，不过冲、不弹；一镜 6 秒左右；切镜直接换图，新图 0.35 秒淡入上浮 6px。
做粗了 → 做精：
  默认图表库样式（粗网格、图例、彩虹色）→ 发丝网格、去图例、只有一种强调色，其余全灰。
  线用 dasharray 画（速度忽快忽慢、头点跟不上）→ clipPath 按 x 揭开，头点读数同步。
  数字直接跳到终值 → 逐位滚动，带上下渐隐遮罩。
  注释压在灰线上读不清 → 文字加纸色描边（paint-order: stroke）。
  标题用系统黑体加粗 → 宋体大标题 + 字距收紧，配 1px 和 2px 的双线。
手机竖屏：报头缩成一行；标题一行、去掉导语；图表占满宽度、标题以下到底边的高度；
          字号：标注 16px，刻度 12px。
技法目录：
  T1 纸纹：feTurbulence 生成一次做成背景图
  T2 发丝坐标轴：半像素对齐的 1px 轴、网格、短刻度
  T3 线从左往右画出：clipPath 揭开 + 头点插值 + 读数
  T4 注释：锚点 + 引线（dash 画出）+ 纸色描边文字
  T5 数字滚动：里程表式逐位进位
  T6 柱子从基线长出 + 聚焦淡出
  T7 小多图对比：一条条退成灰，计数跟着减
-->
<script>
/* ━━ 配色：全片颜色只在这里。默认 = 本例；网址带 ?pal=alt = 换题示例。技法代码只读 PAL / CSS 变量 ━━ */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  main: { paper: '#f3eee3', ink: '#161513', ink2: '#3a3732', grey: '#8a847a', grey2: '#b9b2a6', hair: '#dcd4c6',
    band: '#e6dfd1', dim: '#d9d1c3', fade: '#c9c1b4', accent: '#d23f29',
    light: 'rgba(255,252,244,.55)', vig: 'rgba(70,52,28,.13)', tex: '70,55,30', texA: 1 },
  alt: { paper: '#0f1820', ink: '#e8edef', ink2: '#b3bec4', grey: '#7f8d96', grey2: '#3e4c56', hair: '#1f2b34',
    band: '#16222b', dim: '#26333d', fade: '#33414b', accent: '#f2a23c',
    light: 'rgba(150,185,210,.07)', vig: 'rgba(0,0,0,.42)', tex: '185,210,230', texA: .55 },
};
const PAL = PALETTES[/[?&]pal=alt\b/.test(location.search) ? 'alt' : 'main'];
for (const k in PAL) if (typeof PAL[k] === 'string') document.documentElement.style.setProperty('--' + k, PAL[k]);
</script>
<style>
  :root{
    --serif:"Songti SC","STSong","Noto Serif CJK SC",SimSun,Georgia,serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace;
    --didot:Didot,"Bodoni 72","Bodoni MT","Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  body{overflow:hidden}
  #paper{position:fixed;inset:0;background-color:var(--paper)}
  #paper::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(130deg,var(--light),transparent 45%),
      radial-gradient(ellipse 85% 75% at 50% 45%,transparent 60%,var(--vig) 100%)}
  #stage{position:fixed;inset:0}
  #sv{position:absolute;inset:0;display:block}
  #sv text{font-family:var(--sans)}
  .grid{stroke:var(--hair);stroke-width:1}
  .base,.tk{stroke:var(--ink);stroke-width:1}
  .tick{font:12px var(--mono);fill:var(--grey);font-variant-numeric:tabular-nums}
  .gl{fill:none;stroke:var(--grey2);stroke-width:1.1;stroke-linejoin:round}
  .al{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
  .halo{fill:none;stroke:var(--paper);stroke-width:7;stroke-linejoin:round}
  .lead{fill:none;stroke:var(--ink);stroke-width:1}
  .note{fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
  .note.b{font-weight:700}
  .acc{fill:var(--accent)}
  .ctitle{font-weight:700;fill:var(--ink)}
  .csub{fill:var(--grey)}
  .src{fill:var(--grey);font-size:12px}
  /* 报头 */
  #mast{position:fixed;left:var(--mx);right:var(--mx);top:0;height:var(--mastH);display:flex;align-items:center;gap:18px;
    border-bottom:1px solid var(--ink)}
  #mast::after{content:"";position:absolute;left:0;right:0;bottom:3px;border-bottom:2px solid var(--ink)}
  #mast .brand{font:900 22px/1 var(--serif);letter-spacing:.04em}
  #mast .en{font:600 11px/1 var(--sans);letter-spacing:.32em;color:var(--ink2)}
  #mast .mid{flex:1;text-align:center;font:12px/1 var(--mono);color:var(--grey);letter-spacing:.06em}
  #mast .folio{font:700 13px/1 var(--mono);border:1px solid var(--ink);padding:5px 7px}
  /* 导语栏 */
  #lede{position:fixed;left:var(--mx);top:calc(var(--mastH) + 30px);width:var(--colW)}
  .kick{font:700 12px/1 var(--sans);letter-spacing:.24em;color:var(--accent);display:flex;align-items:center;gap:8px}
  .kick i{width:9px;height:9px;background:var(--accent);display:inline-block}
  #lede h1{font:900 var(--h1)/1.06 var(--serif);letter-spacing:-.02em;margin-top:16px}
  #lede .dek{margin-top:18px;font-size:17px;line-height:1.6;color:var(--ink2)}
  #lede .by{margin-top:16px;padding-top:10px;border-top:1px solid var(--hair);font:12px/1.4 var(--sans);color:var(--grey);letter-spacing:.06em}
  #facts{display:flex;margin-top:26px;border-top:2px solid var(--ink);border-bottom:1px solid var(--hair)}
  #facts div{flex:1;padding:12px 0 12px 12px;border-left:1px solid var(--hair)}
  #facts div:first-child{border-left:0;padding-left:0}
  #facts dt{font:400 40px/1 var(--didot);font-variant-numeric:lining-nums}
  #facts dt small{font:12px var(--mono);margin-left:2px;color:var(--grey)}
  #facts div:first-child dt{color:var(--accent)}
  #facts dd{margin-top:6px;font-size:12px;color:var(--grey);letter-spacing:.08em}
  @media (max-height:820px){#facts{display:none}}
  #rule{position:fixed;top:calc(var(--mastH) + 24px);bottom:calc(var(--padB) + 18px);left:var(--ruleX);border-left:1px solid var(--hair)}
  /* 数字滚动 */
  .odo{position:fixed;display:flex;align-items:flex-start;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
  .odo .dg{display:inline-block;height:1em;line-height:1em;overflow:hidden;text-align:center;
    -webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
  .odo .dg>span{display:block;will-change:transform}
  .odo .pt{line-height:1em}
  #odoBar{font:400 var(--odo,46px)/1 var(--didot);color:var(--accent)}
  #odoBar .dg{width:.62em}
  #odoBig{font:400 var(--big)/1 var(--didot);color:var(--ink);letter-spacing:-.02em}
  #odoBig .dg{width:.62em}
  #bigTxt{position:fixed;pointer-events:none}
  #bigTxt b{display:block;font:900 var(--h2)/1.2 var(--serif)}
  #bigTxt span{display:block;margin-top:8px;font-size:var(--pf);line-height:1.55;color:var(--ink2)}
  /* 竖屏重排 */
  @media (orientation:portrait){
    #mast{gap:10px} #mast .brand{font-size:18px} #mast .en,#mast .mid{display:none}
    #mast .tag{flex:1;text-align:right;font:12px/1 var(--mono);color:var(--grey)}
    #lede{top:calc(var(--mastH) + 14px)} #lede h1 br{display:none} #lede h1{margin-top:8px}
    #lede .dek,#lede .by,#rule,#facts{display:none}
  }
  @media (orientation:landscape){ #mast .tag{display:none} }
</style>
</head>
<body>
<div id="paper" aria-hidden="true"></div>
<header id="mast">
  <div class="brand">数据特稿</div><div class="en">DATA DESK</div>
  <div class="mid">样张 No.16 ｜ 本版图表全部为示例数据，不代表任何真实统计</div>
  <div class="tag">示例数据</div><div class="folio">A16</div>
</header>
<div id="rule"></div>
<div id="lede">
  <div class="kick"><i></i>图解 · GRAPHIC</div>
  <h1>只用一种<br>颜色说话</h1>
  <p class="dek">一张纸、一种墨、一种强调色。<br>注释贴着数据写，不用图例。</p>
  <div class="by">文 · 样张编辑部　　图 · 示例数据，随机生成</div>
  <dl id="facts"><div><dt>1</dt><dd>种强调色</dd></div><div><dt>11</dt><dd>条灰线</dd></div><div><dt>0</dt><dd>个图例</dd></div><div><dt>1<small>px</small></dt><dd>坐标轴</dd></div></dl>
</div>
<main id="stage"><svg id="sv" aria-hidden="true"></svg></main>
<div id="odoBar" class="odo" aria-hidden="true"></div>
<div id="odoBig" class="odo" aria-hidden="true"></div>
<div id="bigTxt" aria-hidden="true"><b>条线保留颜色</b><span>其余全部退成灰，读者第一眼只看它。</span></div>

<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const lerp = (a, b, k) => a + (b - a) * k;

/* ━━ T1 纸纹：feTurbulence 生成一次做成背景图（纤维 + 斑驳），浏览器只栅格化一次 ━━ */
function paperTexture({ fiber = .05, mottle = .045, tint = PAL.tex, size = 640, seed = 7 } = {}) {
  const c = tint.split(',').map(v => (v / 255).toFixed(3));
  const m = a => `0 0 0 0 ${c[0]} 0 0 0 0 ${c[1]} 0 0 0 0 ${c[2]} 0 0 0 ${a} 0`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'>
<filter id='a' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='${seed}' stitchTiles='stitch'/><feColorMatrix values='${m(fiber * 4)}'/><feComponentTransfer><feFuncA type='discrete' tableValues='0 0 .25 .5 .7 1'/></feComponentTransfer></filter>
<filter id='b' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.03 .28' numOctaves='2' seed='${seed + 3}' stitchTiles='stitch'/><feColorMatrix values='${m(fiber * 2.2)}'/></filter>
<filter id='c' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.006' numOctaves='3' seed='${seed + 9}' stitchTiles='stitch'/><feColorMatrix values='${m(mottle * 3)}'/></filter>
<rect width='100%' height='100%' filter='url(#c)'/><rect width='100%' height='100%' filter='url(#b)' opacity='.22'/><rect width='100%' height='100%' filter='url(#a)' opacity='.35'/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
document.getElementById('paper').style.backgroundImage = paperTexture({ fiber: .05 * PAL.texA, mottle: .045 * PAL.texA });

/* ━━ 工具：建 SVG 元素、种子随机数 ━━ */
const NS = 'http://www.w3.org/2000/svg';
function E(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; }
function T(p, x, y, s, a = {}) { const e = E('text', Object.assign({ x, y }, a), p); e.textContent = s; return e; }
function rng(s) { return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* 示例数据：随机生成，只为演示版式 */
const R = rng(1616), NP = 48;
const SER = [];
for (let k = 0; k < 12; k++) {
  let v = 22 + R() * 46, m = 0; const a = [];
  for (let i = 0; i < NP; i++) { m = m * .8 + (R() - .5) * 4.6; v = clamp(v + m, 8, 82); a.push(v); }
  SER.push(a.map((_, i) => (a[Math.max(0, i - 1)] + a[i] * 2 + a[Math.min(NP - 1, i + 1)]) / 4));
}
SER[0] = Array.from({ length: NP }, (_, i) => 24 + i * .78 + 30 * Math.exp(-((i - 31) ** 2) / 14) + 3.2 * Math.sin(i * .9) + 2 * Math.sin(i * 2.3));
const HI = SER[0];
const PEAK = HI.indexOf(Math.max(...HI));
const BARS = [41.2, 55.8, 38.4, 62.1, 47.5, 33.9, 58.6, 86.4, 51.3, 44.7, 66.2, 39.8];
const FOC = 7, MEAN = BARS.reduce((a, b) => a + b) / BARS.length;

/* ━━ T5 数字滚动：每一位是一条竖排 0–9，按里程表进位；前导零收起宽度 ━━ */
function makeOdo(host, intDigits, decimals = 0) {
  host.innerHTML = ''; const cells = [], n = intDigits + decimals;
  for (let k = 0; k < n; k++) {
    if (k === intDigits && decimals) host.insertAdjacentHTML('beforeend', '<span class="pt">.</span>');
    const c = document.createElement('span'); c.className = 'dg';
    c.innerHTML = '<span>' + '0123456789'.split('').concat('0').join('<br>') + '</span>';
    host.appendChild(c); cells.push(c);
  }
  return v => {
    const u = Math.max(0, v * 10 ** decimals);
    cells.forEach((c, k) => {
      const place = n - 1 - k, P = 10 ** place, pos = Math.floor(u / P), rem = u - pos * P;
      const frac = place === 0 ? u - Math.floor(u) : Math.max(0, rem - (P - 1));
      c.firstChild.style.transform = `translateY(${-((pos % 10) + frac)}em)`;
      if (place > decimals) { const vis = clamp(u - (P - 1)); c.style.width = (.62 * vis) + 'em'; c.style.opacity = vis; }
    });
  };
}
const odoBar = makeOdo(document.getElementById('odoBar'), 2, 1);
const odoBig = makeOdo(document.getElementById('odoBig'), 2, 0);

/* ━━ 版面：横屏左栏 + 右图；竖屏上图下注（重排，不是缩小） ━━ */
const sv = document.getElementById('sv'), root = document.documentElement;
let L, G = {};
function layout(W, H) {
  const P = H > W, o = { W, H, P };
  if (!P) {
    o.mx = Math.round(clamp(W * .045, 24, 72)); o.mastH = 64; o.padB = 28;
    o.colW = Math.round(clamp(W * .3, 300, 470));
    o.cx = o.mx + o.colW + 70; o.cy = o.mastH + 30; o.cw = W - o.mx - o.cx; o.ch = H - o.padB - 22 - o.cy;
    o.h1 = Math.round(clamp(W * .052, 44, 84)); o.h2 = Math.round(clamp(W * .022, 24, 34)); o.pf = 17;
    o.fs = 14; o.fn = Math.round(clamp(W * .0115, 14, 18));
  } else {
    o.mx = 18; o.mastH = 46; o.padB = 24; o.colW = W - 36;
    o.h1 = Math.round(clamp(W * .082, 26, 40)); o.h2 = 21; o.pf = 16; o.fs = 13; o.fn = 16;
    o.cx = o.mx; o.cy = o.mastH + 14 + o.h1 * 1.1 + 22; o.cw = W - 2 * o.mx;
    o.ch = H - o.padB - 22 - o.cy;
  }
  o.ruleX = o.mx + o.colW + 35;
  return o;
}

/* ━━ T2 发丝坐标轴：1px 墨色基线、发丝网格、5px 短刻度，坐标落在半像素上 ━━ */
const hp = v => Math.round(v) + .5;
function axes(g, A, o) {
  for (const v of o.y) {
    const y = hp(A.py + A.ph * (1 - v / o.max));
    E('line', { x1: A.px, x2: A.px + A.pw, y1: y, y2: y, class: v ? 'grid' : 'base' }, g);
    if (v) T(g, A.px, y - 6, v + (v === o.max ? o.unit : ''), { class: 'tick' });
  }
  const yb = hp(A.py + A.ph);
  o.x.forEach(([f, s]) => {
    const x = hp(A.px + A.pw * f);
    E('line', { x1: x, x2: x, y1: yb, y2: yb + 5, class: 'tk' }, g);
    T(g, x, yb + 20, s, { class: 'tick', 'text-anchor': f === 0 ? 'start' : 'middle' });
  });
}
const lineD = (a, A, max = 100) => a.map((v, i) => (i ? 'L' : 'M') + (A.px + A.pw * i / (a.length - 1)).toFixed(1) + ' ' + (A.py + A.ph * (1 - v / max)).toFixed(1)).join('');
const atX = (a, f) => { const x = f * (a.length - 1), i = Math.min(a.length - 2, Math.floor(x)); return lerp(a[i], a[i + 1], x - i); };

/* ━━ T4 注释：锚点小圆 + 引线 + 一句话；文字带纸色描边，压得住底下的线 ━━ */
function annot(g, ax, ay, pts, lines, { fs = 14, anchor = 'end' } = {}) {
  const grp = E('g', {}, g);
  const d = 'M' + [[ax, ay], ...pts].map(p => p.join(' ')).join('L');
  const ld = E('path', { d, class: 'lead' }, grp);
  E('circle', { cx: ax, cy: ay, r: 4, fill: 'var(--paper)', stroke: 'var(--ink)', 'stroke-width': 1.2 }, grp);
  const [ex, ey] = pts[pts.length - 1], tx = ex + (anchor === 'end' ? -8 : 8);
  const txt = lines.map((s, k) => T(grp, tx, ey + 5 + k * fs * 1.35 - (lines.length - 1) * fs * .6, s, { class: 'note' + (k ? '' : ' b'), 'text-anchor': anchor, 'font-size': fs }));
  const len = pts.reduce((s, p, k) => { const q = k ? pts[k - 1] : [ax, ay]; return s + Math.hypot(p[0] - q[0], p[1] - q[1]); }, 0);
  ld.setAttribute('stroke-dasharray', len); grp.len = len;
  grp.show = k => { ld.setAttribute('stroke-dashoffset', len * (1 - ease.out(seg(k, 0, .55)))); grp.style.opacity = k > 0 ? 1 : 0;
    txt.forEach((t, i) => { const q = ease.out(seg(k, .35 + i * .12, .8 + i * .12)); t.style.opacity = q; t.setAttribute('transform', `translate(0 ${(1 - q) * 5})`); }); };
  return grp;
}

function chartHead(g, x, y, w, title, sub, P) {
  T(g, x, y + 15, title, { class: 'ctitle', 'font-size': P ? 15 : 20 });
  T(g, x, y + 38, sub, { class: 'csub', 'font-size': P ? 12 : 14 });
  const tg = E('g', { transform: `translate(${w + x - (P ? 64 : 72)} ${y})` }, g);
  E('rect', { x: .5, y: .5, width: P ? 63 : 71, height: 22, fill: 'none', stroke: 'var(--ink)' }, tg);
  T(tg, P ? 32 : 36, 15.5, '示例数据', { 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: 'var(--ink)' });
}

function build() {
  const W = innerWidth, H = innerHeight; L = layout(W, H);
  for (const k of ['mx', 'mastH', 'padB', 'colW', 'h1', 'h2', 'pf', 'ruleX']) root.style.setProperty('--' + k, L[k] + 'px');
  sv.setAttribute('viewBox', `0 0 ${W} ${H}`); sv.setAttribute('width', W); sv.setAttribute('height', H);
  sv.innerHTML = '';
  const defs = E('defs', {}, sv), P = L.P, fs = L.fn;
  const head = P ? 50 : 62, foot = P ? 44 : 50;
  const A = { px: L.cx + (P ? 2 : 4), py: L.cy + head + 10, pw: L.cw - (P ? 2 : 4) - (P ? 70 : 118), ph: L.ch - head - 10 - foot };
  const src = (g, s) => T(g, L.cx, L.cy + L.ch - 4, s, { class: 'src' });

  /* 图 1：走势 */
  const g1 = G.g1 = E('g', {}, sv);
  chartHead(g1, L.cx, L.cy, L.cw, '示例指数：12 条走势', '48 期 · 单位：点 · 只点亮其中一条', P);
  axes(g1, A, { y: [0, 25, 50, 75, 100], max: 100, unit: ' 点', x: [[0, '第 1 期'], [11 / 47, '12'], [23 / 47, '24'], [35 / 47, '36'], [1, '48']] });
  const bx0 = A.px + A.pw * (PEAK - 6) / (NP - 1), bx1 = A.px + A.pw * (PEAK + 5) / (NP - 1);
  G.band = E('g', {}, g1);
  E('rect', { x: bx0, y: A.py, width: bx1 - bx0, height: A.ph, fill: 'var(--band)', opacity: .7 }, G.band);
  T(G.band, bx0 + 6, A.py + A.ph - 8, '示例区间', { 'font-size': 12, fill: 'var(--grey)', 'letter-spacing': '.12em' });
  G.greys = SER.slice(1).map(a => E('path', { d: lineD(a, A), class: 'gl' }, g1));
  /* ━━ T3 线从左往右画出：clipPath 矩形按 x 揭开；头点和读数按同一个 x 插值 ━━ */
  const cp = E('clipPath', { id: 'rv' }, defs);
  G.rv = E('rect', { x: A.px - 6, y: A.py - 30, width: 0, height: A.ph + 60 }, cp);
  const d0 = lineD(HI, A);
  E('path', { d: d0, class: 'halo', 'clip-path': 'url(#rv)' }, g1);
  E('path', { d: d0, class: 'al', 'clip-path': 'url(#rv)' }, g1);
  G.cur = E('line', { y1: A.py + 2, y2: A.py + A.ph, stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-dasharray': '2 3' }, g1);
  G.chip = E('g', {}, g1); E('rect', { x: -34, y: -22, width: 68, height: 20, fill: 'var(--ink)' }, G.chip);
  G.chipT = T(G.chip, 0, -7.5, '', { 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--paper)', 'font-family': 'var(--mono)' });
  G.chip.setAttribute('font-family', 'Menlo,Consolas,monospace');
  G.head = E('circle', { r: 5, fill: 'var(--accent)', stroke: 'var(--paper)', 'stroke-width': 2 }, g1);
  G.headT = T(g1, 0, 0, '', { class: 'note b acc', 'font-size': fs, 'font-family': 'Menlo,Consolas,monospace' });
  G.A = A;
  const pxp = A.px + A.pw * PEAK / (NP - 1), pyp = A.py + A.ph * (1 - HI[PEAK] / 100);
  G.ann1 = annot(g1, pxp, pyp, [[pxp - (P ? 28 : 40), pyp - (P ? 10 : 18)], [pxp - (P ? 60 : 110), pyp - (P ? 10 : 18)]],
    P ? ['示例峰值 ' + HI[PEAK].toFixed(1), '写在线旁', '不进图例'] : ['示例峰值 ' + HI[PEAK].toFixed(1), '写在线旁，不进图例'], { fs });
  const ey = A.py + A.ph * (1 - HI[NP - 1] / 100);
  G.endL = E('g', { transform: `translate(${A.px + A.pw + 10} ${ey})` }, g1);
  T(G.endL, 0, -2, '示例 A', { class: 'note b acc', 'font-size': fs });
  T(G.endL, 0, fs + 2, HI[NP - 1].toFixed(1), { class: 'note acc', 'font-size': fs, 'font-family': 'Menlo,Consolas,monospace' });
  if (!P) T(G.endL, 0, fs * 2 + 6, '较首期 +' + (HI[NP - 1] - HI[0]).toFixed(1), { class: 'note', 'font-size': 12, fill: 'var(--grey)', 'font-family': 'Menlo,Consolas,monospace' });
  const gEnd = SER.slice(1).map(a => a[NP - 1]).sort((a, b) => a - b);
  let gy = A.py + A.ph * (1 - gEnd[5] / 100); gy = gy > ey ? Math.max(gy, ey + (P ? 52 : 70)) : Math.min(gy, ey - 40);
  G.grpL = E('g', { transform: `translate(${A.px + A.pw + 10} ${gy})` }, g1);
  E('path', { d: `M-6 -14v28`, stroke: 'var(--grey2)', fill: 'none' }, G.grpL);
  T(G.grpL, 2, -2, '其余 11 条', { 'font-size': fs - 1, fill: 'var(--grey)' }); T(G.grpL, 2, fs + 1, '全部灰', { 'font-size': fs - 1, fill: 'var(--grey)' });
  src(g1, P ? '来源：示例数据（随机生成），非真实统计' : '来源：示例数据（随机生成），不代表任何真实统计　·　制图：样张 16');

  /* 图 2：柱图 */
  const g2 = G.g2 = E('g', {}, sv);
  chartHead(g2, L.cx, L.cy, L.cw, '示例值：12 个样本', '单位：点 · 柱子从基线长出，只给一根上色', P);
  const B = Object.assign({}, A, { pw: L.cw - (P ? 4 : 8) - (P ? 8 : 60) });
  axes(g2, B, { y: [0, 25, 50, 75, 100], max: 100, unit: ' 点', x: [] });
  const bw = B.pw / 12;
  G.bars = BARS.map((v, j) => {
    const x = B.px + bw * j + bw * .19, w = bw * .62;
    const r = E('rect', { x, width: w, y: B.py + B.ph, height: 0, fill: PAL.ink2 }, g2);
    const t = T(g2, x + w / 2, 0, v.toFixed(1), { class: 'tick', 'text-anchor': 'middle', fill: 'var(--ink2)' });
    T(g2, x + w / 2, B.py + B.ph + 20, String(j + 1).padStart(2, '0'), { class: 'tick', 'text-anchor': 'middle' });
    return { r, t, v, x, w };
  });
  E('line', { x1: B.px, x2: B.px + B.pw, y1: hp(B.py + B.ph), y2: hp(B.py + B.ph), class: 'base' }, g2);
  const my = hp(B.py + B.ph * (1 - MEAN / 100));
  G.mean = E('line', { x1: B.px, x2: B.px + B.pw, y1: my, y2: my, stroke: 'var(--ink)', 'stroke-dasharray': '4 4', 'stroke-width': 1 }, g2);
  G.meanT = T(g2, P ? B.px + 2 : B.px + B.pw, my - 7, '示例均值 ' + MEAN.toFixed(1), { class: 'note', 'text-anchor': P ? 'start' : 'end', 'font-size': fs - 1 });
  const fb = G.bars[FOC], fy = B.py + B.ph * (1 - fb.v / 100);
  G.ann2 = annot(g2, fb.x + fb.w, fy + 30, [[fb.x + fb.w + (P ? 22 : 44), fy + 30], [fb.x + fb.w + (P ? 22 : 44), fy + (P ? 92 : 110)]],
    ['只给要读的', '那一根上色'], { fs, anchor: 'start' });
  G.B = B; G.fy = fy; G.odo = P ? 40 : Math.round(clamp(L.W * .042, 46, 64)); root.style.setProperty('--odo', G.odo + 'px');
  src(g2, P ? '来源：示例数据，仅演示版式' : '来源：示例数据，仅演示版式　·　均值为 12 个示例值的算术平均');

  /* 图 3：小多图对比 + 超大数字 */
  const g3 = G.g3 = E('g', {}, sv);
  const bigF = P ? Math.min(150, L.ch * .36) : Math.min(L.ch * .5, L.cw * .3);
  root.style.setProperty('--big', bigF + 'px');
  let panels;
  if (!P) {
    const lx = L.cx + L.cw * .44;
    panels = [[lx, L.cy + 4, L.W - L.mx - lx, (L.ch - 60) / 2], [lx, L.cy + 4 + (L.ch - 60) / 2 + 26, L.W - L.mx - lx, (L.ch - 60) / 2]];
    G.bigX = L.cx; G.bigY = L.cy + L.ch * .07;
  } else {
    const ph = L.ch - bigF - 64, pw = (L.cw - 14) / 2;
    panels = [[L.cx, L.cy + bigF + 30, pw, ph], [L.cx + pw + 14, L.cy + bigF + 30, pw, ph]];
    G.bigX = L.cx; G.bigY = L.cy + 4;
  }
  /* ━━ T7 小多图：同一组线画两份，改后那份一条条退成灰 ━━ */
  G.mini = panels.map(([x, y, w, h], k) => {
    const g = E('g', {}, g3);
    T(g, x, y + 13, k ? '改后' : '改前', { 'font-size': 13, 'font-weight': 700, fill: k ? 'var(--accent)' : 'var(--ink)' });
    T(g, x + 34, y + 13, k ? '只点亮一条' : '十二条一样黑', { 'font-size': 13, fill: 'var(--grey)' });
    const M = { px: x, py: y + 28, pw: w - 4, ph: h - 40 };
    [0, 50, 100].forEach(v => { const yy = hp(M.py + M.ph * (1 - v / 100)); E('line', { x1: M.px, x2: M.px + M.pw, y1: yy, y2: yy, class: v ? 'grid' : 'base' }, g); });
    const ls = SER.map((a, i) => E('path', { d: lineD(a, M), class: 'gl', style: 'stroke:var(--ink);stroke-width:1.3' }, g)).reverse();
    return { g, ls, M };
  });
  src(g3, '来源：示例数据　·　两图同一组 12 条线，只改颜色');
  G.bigTxt = document.getElementById('bigTxt');
  if (!P) Object.assign(G.bigTxt.style, { left: L.cx + 'px', top: (G.bigY + bigF * 1.02) + 'px', width: (L.cw * .4) + 'px' });
  else Object.assign(G.bigTxt.style, { left: (L.cx + bigF * .62 * 1.15 + 12) + 'px', top: (G.bigY + bigF * .28) + 'px', width: (L.cw - bigF * .75 - 12) + 'px' });
  Object.assign(document.getElementById('odoBig').style, { left: G.bigX + 'px', top: G.bigY + 'px' });
}

/* ━━ T6 柱子从基线长出 + 聚焦：其余退成浅灰、读数淡出；强调色只给一根 ━━ */
function mixHex(a, b, k) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') + ')'; }
const odoBarEl = document.getElementById('odoBar'), odoBigEl = document.getElementById('odoBig');
function only(n) { ['g1', 'g2', 'g3'].forEach((k, i) => { G[k].style.display = i === n ? '' : 'none'; });
  odoBarEl.style.display = n === 1 ? '' : 'none'; odoBigEl.style.display = G.bigTxt.style.display = n === 2 ? '' : 'none'; }
const fadeIn = (g, t) => { const q = ease.out(seg(t, 0, .35)); g.style.opacity = q; g.setAttribute('transform', `translate(0 ${(1 - q) * 6})`); };

const SHOTS = [
  // 走势 · 只点亮一条线：其余十一条退成灰，注释贴着线写。
  { dur: 6,
    enter() { only(0); },
    draw(t) {
      const A = G.A, k = .5 + .5 * ease.inOut(seg(t, .15, 3.7)), x = A.px + A.pw * k, v = atX(HI, k), y = A.py + A.ph * (1 - v / 100);
      G.rv.setAttribute('width', A.pw * k + 6);
      const dim = ease.inOut(seg(t, .4, 2.6));
      G.greys.forEach(e => { e.style.opacity = lerp(1, .55, dim); });
      const on = 1 - seg(t, 3.75, 4.2);
      G.cur.setAttribute('x1', hp(x)); G.cur.setAttribute('x2', hp(x)); G.cur.style.opacity = on;
      G.chip.setAttribute('transform', `translate(${clamp(x, A.px + 34, A.px + A.pw - 34)} ${A.py + 24})`); G.chip.style.opacity = on;
      G.chipT.textContent = '第 ' + String(Math.round(k * (NP - 1)) + 1).padStart(2, '0') + ' 期';
      G.head.setAttribute('cx', x); G.head.setAttribute('cy', y);
      G.headT.setAttribute('x', x + 10); G.headT.setAttribute('y', y - 10); G.headT.textContent = v.toFixed(1); G.headT.style.opacity = 1 - seg(t, 3.6, 3.8);
      const pk = PEAK / (NP - 1); let tp = 0; while (tp < 4 && .5 + .5 * ease.inOut(seg(tp, .15, 3.7)) < pk) tp += .02;
      G.ann1.show(seg(t, tp + .1, tp + 1.3));
      G.band.style.opacity = ease.out(seg(t, tp - .5, tp + .3));
      const e = ease.out(seg(t, 3.85, 4.4));
      G.endL.style.opacity = e; G.grpL.style.opacity = ease.out(seg(t, 4, 4.6));
      G.endL.firstChild.setAttribute('x', (1 - e) * -6);
    } },
  // 柱图 · 柱子从基线长出来：聚焦一根，其余淡出，数字滚到位。
  { dur: 6.3,
    enter() { only(1); },
    draw(t) {
      fadeIn(G.g2, t);
      const B = G.B, f = ease.inOut(seg(t, 2.5, 3.1));
      G.bars.forEach((b, j) => {
        const g = ease.out(seg(t, .3 + j * .06, 1.2 + j * .06)), h = B.ph * b.v / 100 * g;
        b.r.setAttribute('y', B.py + B.ph - h); b.r.setAttribute('height', h);
        b.r.setAttribute('fill', j === FOC ? mixHex(PAL.ink2, PAL.accent, f) : mixHex(PAL.ink2, PAL.dim, f));
        b.t.setAttribute('y', B.py + B.ph - h - 7); b.t.style.opacity = seg(t, 1 + j * .06, 1.4 + j * .06) * (j === FOC ? 1 - f : 1 - f * .85);
      });
      const m = ease.inOut(seg(t, 1.6, 2.3));
      G.mean.setAttribute('x2', B.px + B.pw * m); G.meanT.style.opacity = seg(t, 2.1, 2.5) * (1 - f * .5);
      const fb = G.bars[FOC], r = ease.out(seg(t, 2.8, 4.4));
      odoBar(fb.v * r);
      const sh = ease.out(seg(t, 2.7, 3.1));
      Object.assign(odoBarEl.style, { left: (fb.x + fb.w / 2 - G.odo * 1.05) + 'px', top: (G.fy - G.odo * 1.35 + (1 - sh) * 10) + 'px', opacity: sh });
      G.ann2.show(seg(t, 4.1, 5.3));
    } },
  // 结论 · 十二条，只留一条有颜色：超大数字压住画面，一行小字说明。
  { dur: 6.5,
    enter() { only(2); },
    draw(t) {
      fadeIn(G.g3, t);
      const [, after] = G.mini; let n = 12;
      after.ls.forEach((e, i) => {
        if (i === 11) { const a = ease.inOut(seg(t, 3.9, 4.4)); e.style.stroke = mixHex(PAL.ink, PAL.accent, a); e.style.strokeWidth = 1.3 + a * 1.2; return; }
        const s = .9 + i * .27, q = ease.out(seg(t, s, s + .25));
        e.style.stroke = mixHex(PAL.ink, PAL.fade, q); e.style.strokeWidth = 1.3 - q * .3; n -= ease.inOut(seg(t, s, s + .22));
      });
      odoBig(n);
      odoBigEl.style.color = mixHex(PAL.ink, PAL.accent, ease.inOut(seg(t, 3.9, 4.4)));
      odoBigEl.style.opacity = G.bigTxt.style.opacity = ease.out(seg(t, 0, .35));
    } },
];

build();
const S = makePlayer(SHOTS, {
  onResize(S) { if (L && (L.W !== innerWidth || L.H !== innerHeight)) { build(); SHOTS[S.i].enter(); } },
});
</script>
