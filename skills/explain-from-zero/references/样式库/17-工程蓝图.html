<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工程蓝图样张</title>
<!--
风格：工程蓝图 BLUEPRINT
一句话：一张晒出来的图纸——单色纸上同色系的线，每根线都有身份（轮廓、中心线、尺寸、剖面线），图框记下这是第几张、哪一版。
擅长表现：一个东西由哪几件组成、怎么装到一起、改了哪里——先描轮廓再补尺寸，沿一根轴拆开再合上，修订笔圈出改动。
招牌细节：
  材质  晒图纸：径向曝光不匀 + feTurbulence 大斑驳 + 细颗粒 + 水渍圈 + 三道折痕 + 四边褪色。
  光    没有打光；线带 1px 化学晕（drop-shadow：浅线外发光、深线洇墨），纸面中间和四边差两三档。
  主体  线有五种身份：轮廓 1.6px、隐藏线短虚、中心线长短点划、尺寸线带实心箭头、剖面 45° 排线（相邻零件反向）。
  主体  薄件剖面涂实（垫圈），标准件不剖（螺栓、螺母）；剖切符号 B—B、零件序号圆圈、圆规构造弧。
  字    等宽大写标注 + 黑体中文；图名用「只描边 + 斜排线填充」的空心字，动画时逐笔描出。
  动效  先描轮廓（pathLength=1 + dashoffset）→ 排线扫入 → 尺寸补上；零件沿一根轴爆炸展开（先回缩再弹出），合拢时轻撞。
  动效  修订云线逐段画出 + 修订三角弹出；局部放大圆先用圆规画圈再出内容。
  角落  图框分区号 1–8 / A–F、右下标题栏（图号、比例、张次 SHEET 01/03、日期、修订）、右上修订表。
色彩结构（换题保留）：晒图是单色语言——一种纸色（曝光不匀，中间和四边差两三档）+ 同色系的线（轮廓最实；
  尺寸、中心线、排线、网格降一档）+ 一支修订笔（只给云线、修订三角、标题栏 REV 和修订表那一行）。纸和线同色系、
  一深一浅、线不加第二种颜色，修订色和线的色相拉得最远——这几条是语言本身。能换的是哪一种晒图（蓝底白线、
  白底蓝线或褐线的重氮白图……）和修订笔的颜色；深底浅线还是浅底深线，由「这张图在什么现场被翻开」定。
  所有颜色在文件顶部 PALETTES 里（含纸纹斑驳色），技法代码只读变量。
本例配色（从本例主体「滑轮组件」和它的现场「车间墙上一张老式蓝晒图」推出来，换题就换）：
  --paperM #174581（中心 #1c5391 → 四边 #0e2f5a）/ --line #eef7ff / --line2 #a9d8ff / --grid #bee1ff / --rev #ff5d4d
换题示例（?pal=alt）：假设主角是「一副黄铜合页」、现场是「午后木工房桌上的一张重氮白图」→ 换成米黄纸、赭褐线
  （浅底深线），纸边泛黄、斑点变深、线不发光改洇墨；修订笔改钴蓝，因为红在褐线里分不开。
  --paperM #ece2cb（中心 #f2ead8 → 四边 #d5c4a2）/ --line #3a2414 / --line2 #7b5a3c / --grid #8a6a4a / --rev #2457c5
字：标注 "SF Mono",Menlo,Consolas,monospace 大写、字距 .08em；中文 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif；
    图名 Futura,"Avenir Next","DIN Alternate","Arial Black",sans-serif 粗体，只描边 + 排线填充。
动效：干脆、机械：ease-out 描线，爆炸用「回缩 4% → back 过冲」；每张图 6–7 秒；切张时新图从零描出（第一张除外，第一帧就是完整图）。
做粗了 → 做精：
  全部线一样粗一样亮 → 轮廓 / 尺寸 / 中心 / 隐藏 / 剖面五种线宽和线型。
  纸色平涂 → 曝光不匀 + 斑驳 + 折痕 + 褪色边，网格分主次两级。
  零件一起淡入 → 先描轮廓再补排线和尺寸；爆炸有回缩、错峰和过冲。
  尺寸是一根线加数字 → 尺寸界线留 1.5mm 间隙、超出 2mm、实心细长箭头、数字随零件移动实时变。
  修订用方框 → 修订云线（一串向外凸的弧）+ 三角修订号 + 标题栏 REV 跟着变。
手机竖屏：装配轴改成竖向（视图映射整体转 90°，字保持水平）；正视图在上、剖视在下；
          标题栏保留图名 / 张次 / 修订。标注 12px 起。
技法目录：
  T1 晒图纸：径向曝光 + 斑驳 + 颗粒 + 水渍 + 折痕（一次生成的背景）
  T2 两级网格 + 图框分区号
  T3 视图映射：毫米坐标 → 屏幕，竖屏转 90°
  T4 线型库：轮廓 / 隐藏 / 中心 / 尺寸 / 剖面排线（SVG pattern）
  T5 尺寸标注：界线间隙、实心箭头、数字水平
  T6 描线动画：pathLength=1 + dashoffset；排线用裁剪矩形扫入
  T7 圆规构造弧 + 角度读数
  T8 沿轴爆炸 / 合拢：回缩 → 过冲，零件序号跟随
  T9 修订云线 + 修订三角 + 局部放大圆
-->
<script>
/* ━━ 配色：全片颜色只在这里。默认 = 本例；网址带 ?pal=alt = 换题示例。技法代码只读 PAL / CSS 变量 ━━ */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  main: { paperC: '#1c5391', paperM: '#174581', paperO: '#11386a', paperE: '#0e2f5a',
    line: '#eef7ff', line2: '#a9d8ff', grid: '#bee1ff', rev: '#ff5d4d', hatch: '#cfe9ff', solid: '#d9efff',
    halo: '#164380', panel: '#10396a', edge: '#8cc8ff', stain: '#aad7ff', crease: '#000f28', creaseHi: '#bee1ff',
    glow: 'rgba(215,238,255,.55)',
    tex: { m: '.62 .82 1', mOp: .38, d: '0 .05 .15', dOp: .5, g: '.85 .93 1', gOp: .5 } },
  alt: { paperC: '#f2ead8', paperM: '#ece2cb', paperO: '#e3d6bb', paperE: '#d5c4a2',
    line: '#3a2414', line2: '#7b5a3c', grid: '#8a6a4a', rev: '#2457c5', hatch: '#5c3f28', solid: '#4a2f1c',
    halo: '#ece3cd', panel: '#efe6d1', edge: '#a07a40', stain: '#b0905c', crease: '#6b4a2a', creaseHi: '#fffaf0',
    glow: 'rgba(58,36,20,.3)',
    tex: { m: '.62 .48 .22', mOp: .2, d: '.32 .22 .1', dOp: .22, g: '.22 .14 .07', gOp: .45 } },
};
const PAL = PALETTES[/[?&]pal=alt\b/.test(location.search) ? 'alt' : 'main'];
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(',');
const A = (h, a) => `rgba(${rgbOf(h)},${a})`;
for (const k in PAL) if (typeof PAL[k] === 'string') {
  document.documentElement.style.setProperty('--' + k, PAL[k]);
  if (PAL[k][0] === '#') document.documentElement.style.setProperty('--' + k + '-rgb', rgbOf(PAL[k]));
}
</script>
<style>

    --mono:"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --disp:Futura,"Avenir Next","DIN Alternate","Arial Black",sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--paperE);color:var(--line);font-family:var(--sans)}
  body{overflow:hidden}
  /* ━━ T1 晒图纸 ━━ */
  #paper{position:fixed;inset:0;
    background:radial-gradient(ellipse 70% 65% at 46% 42%,var(--paperC) 0%,var(--paperM) 48%,var(--paperO) 82%,var(--paperE) 100%)}
  #paper .tex{position:absolute;inset:0;background-size:100% 100%}

      radial-gradient(circle at 78% 22%,transparent 9%,rgba(var(--stain-rgb),.07) 9.6%,transparent 10.4%),

      linear-gradient(90deg,transparent calc(33.3% - 1px),rgba(var(--creaseHi-rgb),.10) calc(33.3% - 1px),rgba(var(--creaseHi-rgb),.10) 33.3%,rgba(var(--crease-rgb),.18) 33.3%,rgba(var(--crease-rgb),.18) calc(33.3% + 1px),transparent calc(33.3% + 1px)),
      linear-gradient(90deg,transparent calc(66.6% - 1px),rgba(var(--creaseHi-rgb),.08) calc(66.6% - 1px),rgba(var(--creaseHi-rgb),.08) 66.6%,rgba(var(--crease-rgb),.16) 66.6%,rgba(var(--crease-rgb),.16) calc(66.6% + 1px),transparent calc(66.6% + 1px)),
      linear-gradient(0deg,transparent calc(50% - 1px),rgba(var(--creaseHi-rgb),.09) calc(50% - 1px),rgba(var(--creaseHi-rgb),.09) 50%,rgba(var(--crease-rgb),.18) 50%,rgba(var(--crease-rgb),.18) calc(50% + 1px),transparent calc(50% + 1px))}

  #rev{position:fixed;top:var(--b2);right:var(--b2);width:330px;border:1.5px solid var(--line);font:11px/1 var(--mono);color:var(--line2);background:rgba(var(--panel-rgb),.55)}
  #rev div{display:grid;grid-template-columns:44px 1fr 86px;border-top:1px solid rgba(var(--line-rgb),.55)}
  #rev div:first-child{border-top:0;color:var(--line);letter-spacing:.12em}
  #rev span{padding:8px;border-left:1px solid rgba(var(--line-rgb),.55)} #rev span:first-child{border-left:0;text-align:center}
  #rev .b{color:var(--rev);transition:opacity .3s}
  
  #tb{position:fixed;right:var(--b2);bottom:var(--b2);width:var(--tbW);display:grid;border:2px solid var(--line);
    background:rgba(var(--panel-rgb),.9);font-family:var(--mono);
    grid-template-columns:1.7fr 1fr 1fr 1fr;grid-template-rows:50px 50px 60px;
    grid-template-areas:"name name dwg scale" "name name sheet rev" ". . . date"}

<div id="paper" aria-hidden="true"><div class="tex"></div></div>

<main id="stage"><svg id="sv" aria-hidden="true"></svg></main>
<div id="rev" aria-hidden="true">
  <div><span>REV</span><span>说明 DESCRIPTION</span><span>DATE</span></div>
  <div><span>A</span><span>初版 INITIAL ISSUE</span><span>2026.10.26</span></div>
  <div class="b" id="revB"><span>B</span><span>加注局部 C · 2:1</span><span>2026.10.26</span></div>
</div>

</div>
<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const lerp = (a, b, k) => a + (b - a) * k;

/* ━━ T1 晒图纸纹理：按窗口大小生成一张 SVG（斑驳 + 颗粒），只栅格化一次 ━━ */
function blueprintTexture(W, H, T = PAL.tex, seed = 17) {
  const cm = (rgb, a) => { const [r, g, b] = rgb.split(' '); return `0 0 0 0 ${r}  0 0 0 0 ${g}  0 0 0 0 ${b}  0 0 0 ${a}`; };
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'>
<filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.0035' numOctaves='4' seed='${seed}'/>
<feColorMatrix values='${cm(T.m, '1.25 -.5')}'/></filter>
<filter id='d' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='${seed + 5}'/>
<feColorMatrix values='${cm(T.d, '-1.6 .78')}'/></filter>
<filter id='g' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='${seed + 9}'/>
<feColorMatrix values='${cm(T.g, '2.2 -1.25')}'/></filter>
<rect width='100%' height='100%' filter='url(#m)' opacity='${T.mOp}'/><rect width='100%' height='100%' filter='url(#d)' opacity='${T.dOp}'/><rect width='100%' height='100%' filter='url(#g)' opacity='${T.gOp}'/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

/* ━━ 工具 ━━ */
const NS = 'http://www.w3.org/2000/svg';
function E(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; }
function T(p, x, y, s, a = {}) { const e = E('text', Object.assign({ x: x.toFixed(1), y: y.toFixed(1) }, a), p); e.textContent = s; return e; }

/* ━━ T3 视图映射：毫米 → 屏幕；rot=竖屏时轴线转成竖向，字保持水平 ━━ */
function view(ox, oy, s, rot = false) {
  return { ox, oy, s, rot,
    P(x, y) { return rot ? [this.ox - y * this.s, this.oy + x * this.s] : [this.ox + x * this.s, this.oy - y * this.s]; } };
}
const pth = (V, pts, close = true) => 'M' + pts.map(p => V.P(p[0], p[1]).map(n => n.toFixed(1)).join(' ')).join('L') + (close ? 'Z' : '');

    const bg = E('g', {}, g2), [tx, ty] = V2.P(...pt.tag), [bx, by] = V2.P(pt.tag[0], bh + (k % 2) * (P ? 16 : 14));
    E('circle', { cx: tx, cy: ty, r: 2.2, fill: 'var(--line)' }, bg);
    E('line', { x1: tx, y1: ty, x2: bx + (P ? -11 : 0), y2: by + (P ? 0 : 11), class: 'dim' }, bg);
    E('circle', { cx: bx, cy: by, r: 11, fill: A(PAL.panel, .9), stroke: PAL.line, 'stroke-width': 1.2 }, bg);
    T(bg, bx, by + 4.5, String(pt.n), { class: 'dt', 'text-anchor': 'middle', 'font-weight': 700 });
    return bg;
  });
  G.lenDim = E('g', {}, g2);
  const dimY = P ? -112 : -124;
  G.dimYmm = dimY;
  G.dl = E('line', { class: 'dim', 'marker-start': 'url(#ar)', 'marker-end': 'url(#ar)' }, G.lenDim);
  G.e1 = E('line', { class: 'dim' }, G.lenDim); G.e2 = E('line', { class: 'dim' }, G.lenDim);
  G.dlT = T(G.lenDim, 0, 0, '', { class: 'dt', 'text-anchor': 'middle', 'font-weight': 700 });
  G.cnt = T(sv, ...(P ? [L.W - L.b2 - 12, L.top + 30] : [L.W - L.b2 - 24, L.top + 100]), '', { class: 'dt', 'text-anchor': 'end' });
  G.axisLong = L1(g2, V2, [-260, 0], [230, 0], 'ctr');
  /* 第 3 张：修订云线 + 局部放大 */
  G.g3 = E('g', {}, g2);
  G.cloud = drawable(E('path', { class: 'revl' }, G.g3));
  G.tri = E('g', {}, G.g3);
  E('path', { d: 'M0 -11L10 7H-10Z', fill: 'none', stroke: PAL.rev, 'stroke-width': 1.6 }, G.tri);
  T(G.tri, 0, 4.5, 'B', { 'text-anchor': 'middle', fill: PAL.rev, 'font-size': 11, 'font-weight': 700 });
  G.cC = drawable(E('circle', { class: 'th', fill: 'none' }, G.g3));
  G.cCt = T(G.g3, 0, 0, 'C', { class: 'dt', 'font-weight': 700 });
  G.det = E('g', {}, sv);
  const [dx, dy] = L.Dc, Rd = L.Rd;
  E('clipPath', { id: 'dc' }, sv.querySelector('defs')).appendChild(E('circle', { cx: dx, cy: dy, r: Rd - 1 }));
  G.dCirc = drawable(E('circle', { cx: dx, cy: dy, r: Rd, class: 'ol' }, G.det));
  G.dIn = E('g', { 'clip-path': 'url(#dc)' }, G.det);
  /* 局部视图：同一套零件坐标，以槽口 (0, 92) 为中心、放大到圆里 */
  const Vd = view(dx, dy, Rd / 17, P), base = Vd.P; Vd.P = function (x, y) { return base.call(this, x, y - 92); };
  E('path', { d: pth(Vd, RIM), fill: 'url(#hA)' }, G.dIn); L1(G.dIn, Vd, [0, 108], [0, 76], 'ctr'); G.dOut = drawable(E('path', { d: pth(Vd, RIM), class: 'ol' }, G.dIn));
  for (const x0 of [-29, 23]) { E('path', { d: pth(Vd, plate(x0)[0]), fill: 'url(#hB)' }, G.dIn); E('path', { d: pth(Vd, plate(x0)[0]), class: 'ol' }, G.dIn); }
  G.dDims = E('g', {}, G.det);
  dimLin(G.dDims, Vd, [-10, 100], [10, 100], 6, '20');
  dimLin(G.dDims, Vd, [3, 88], [3, 100], 12.5, '12', { side: -1 });
  const lt = P ? [dx - Rd, dy + Rd + 22] : [dx, dy + Rd + 28];
  G.dLab = T(G.det, lt[0], lt[1], '局部 C  DETAIL C  2:1', { class: 'lb', 'text-anchor': P ? 'start' : 'middle' });
  G.dLead = E('path', { class: 'th', fill: 'none' }, G.det);
}

/* ━━ T8 沿轴爆炸：先回缩 4%，再 back 过冲到位；k 为 0–1 的总进度 ━━ */
function explodeAmt(k, i) {
  const st = Math.abs(PARTS[i].ex) / 190 * .12, q = seg(k, st, st + .7);
  return q < .12 ? -.04 * Math.sin(q / .12 * Math.PI / 2) : ease.back(seg(q, .12, 1)) - .04 * (1 - seg(q, .12, .4));
}
function placeParts(amts, shift = 0) {
  const V = G.V2; let lo = 1e9, hi = -1e9;
  G.asm.parts.forEach(({ pt, g }, i) => {
    const off = pt.ex * amts[i] + shift, [dx, dy] = [V.P(off, 0)[0] - V.P(0, 0)[0], V.P(off, 0)[1] - V.P(0, 0)[1]];
    g.setAttribute('transform', `translate(${dx.toFixed(1)} ${dy.toFixed(1)})`);
    G.balloons[i].setAttribute('transform', `translate(${dx.toFixed(1)} ${dy.toFixed(1)})`);
    if (i === 0) lo = -42 + off; if (i === 6) hi = 46 + off;
  });
  return [lo, hi];
}
function lenDim([lo, hi], vis) {
  const V = G.V2, y = G.dimYmm, [x1, y1] = V.P(lo, y), [x2, y2] = V.P(hi, y), [a1, b1] = V.P(lo, -19), [a2, b2] = V.P(hi, -19), [c1, d1] = V.P(lo, y - 3), [c2, d2] = V.P(hi, y - 3);
  Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => G.dl.setAttribute(k, v));
  Object.entries({ x1: a1, y1: b1, x2: c1, y2: d1 }).forEach(([k, v]) => G.e1.setAttribute(k, v));
  Object.entries({ x1: a2, y1: b2, x2: c2, y2: d2 }).forEach(([k, v]) => G.e2.setAttribute(k, v));
  const [mx, my] = V.P((lo + hi) / 2, y);
  G.dlT.setAttribute('x', mx + (L.P ? -6 : 0)); G.dlT.setAttribute('y', my + (L.P ? 0 : -6));
  G.dlT.setAttribute('text-anchor', 'middle');
  if (L.P) G.dlT.setAttribute('transform', `rotate(-90 ${mx - 6} ${my})`);
  G.dlT.textContent = 'L = ' + (hi - lo).toFixed(1);
  G.lenDim.style.opacity = vis;
}
function outlineDraw(asm, t, t0) {
  asm.parts.forEach(({ outs, fills }, i) => {
    const s = t0 + Math.abs(i - 3) * .12;
    outs.forEach((o, k) => setDraw(o, ease.out(seg(t, s + k * .05, s + .7 + k * .05))));
    fills.forEach(f => { f.style.opacity = ease.inOut(seg(t, s + .7, s + 1.1)); });
  });
}

/* ━━ 镜头推拉：图组按中心缩放，网格背景同步缩放（框和标题栏不动） ━━ */
const gridEl = document.getElementById('grid');
function gridZoom(z, [cx, cy]) {
  const ox = (cx - L.b2) * (1 - z) - 1, oy = (cy - L.b2) * (1 - z) - 1, a = 50 * z, b = 10 * z;
  gridEl.style.backgroundSize = `${a}px ${a}px,${a}px ${a}px,${b}px ${b}px,${b}px ${b}px`;
  gridEl.style.backgroundPosition = `${ox}px ${oy}px`;
}
function camera(z, [cx, cy]) {
  G.g2.setAttribute('transform', `translate(${cx} ${cy}) scale(${z.toFixed(4)}) translate(${-cx} ${-cy})`); gridZoom(z, [cx, cy]);
}

/* 图名描字：每个字形轮廓从起点描出，再填排线 */
function drawTitle(t) { const k = ease.out(seg(t, 0, 1)); G.ttl.style.strokeDasharray = 240; G.ttl.style.strokeDashoffset = 240 * (1 - k); G.ttl.style.fillOpacity = seg(t, .7, 1.2); G.ttl2.style.opacity = seg(t, .5, .9); }
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
const SHOTS = [
  // 视图 VIEWS · 中心线用点划，尺寸带箭头：线画在晒图纸上，每根线一种身份。
  { sheet: '01', dur: 6,
    enter() { show(G.g1, 1); show(G.g2, 0); show(G.det, 0); gridZoom(1, L.c2); G.ttl.textContent = 'PULLEY ASSY'; G.ttl.setAttribute('font-size', L.ttlF);
      G.ttl2.textContent = '滑轮组件 · 装配图 · SHEET 01'; G.ttlG.style.opacity = 1; G.cnt.textContent = ''; G.ttl.style.strokeDasharray = 'none'; G.ttl.style.fillOpacity = 1; },
    draw(t) {
      const k = ease.inOut(seg(t, .4, 3.8)), a = k * Math.PI * 2, [cx, cy, rr] = G.cA, tx = cx + Math.sin(a) * rr, ty = cy - Math.cos(a) * rr;
      setDraw(G.arc, k); G.arc.style.opacity = 1 - seg(t, 4.6, 5.4);
      const on = (t > .3 && t < 4.4) ? 1 : 0;
      G.arm.setAttribute('x2', tx); G.arm.setAttribute('y2', ty); G.tip.setAttribute('cx', tx); G.tip.setAttribute('cy', ty);
      [G.arm, G.piv, G.tip, G.ang].forEach(e => e.style.opacity = on);
      G.ang.setAttribute('x', tx + 10); G.ang.setAttribute('y', ty - 8); G.ang.textContent = 'R52  θ ' + String(Math.round(k * 360)).padStart(3, '0') + '°';
      G.holes.forEach((h, i) => { const pass = seg(k, i / 6 - .01, i / 6 + .03); h.style.opacity = .3 + .7 * pass; });
    } },
  // 爆炸图 EXPLODED · 先画轮廓，再补尺寸：零件沿一根轴拉开，读数跟着变。
  { sheet: '02', dur: 7,
    enter() { show(G.g1, 0); show(G.g2, 1); show(G.g3, 0); show(G.det, 0); G.ttl.textContent = 'EXPLODED VIEW'; G.ttl.setAttribute('font-size', Math.round(L.ttlF * .55));
      G.ttl2.textContent = '爆炸图 · 7 件 · SHEET 02'; G.ttlG.style.opacity = 1; },
    draw(t) {
      drawTitle(t);
      G.V2.ox = L.c2[0]; G.V2.oy = L.c2[1];
      const z = lerp(1.42, 1, ease.inOut(seg(t, 1.7, 3.2)));
      camera(z, L.c2);
      outlineDraw(G.asm, t, .1);
      G.asm.axis.style.opacity = 0; G.axisLong.style.opacity = ease.out(seg(t, .2, .8));
      G.asm.holeC.forEach(e => e.style.opacity = seg(t, 1.2, 1.6));
      const k = seg(t, 2.9, 5.6), amts = PARTS.map((_, i) => explodeAmt(k, i));
      lenDim(placeParts(amts), ease.out(seg(t, 2.6, 3.1)));
      G.balloons.forEach((b, i) => { b.style.opacity = seg(t, 5.3 + i * .09, 5.4 + i * .09); });
      const n = Math.round(clamp((t - 5.3) / .09 + 1, 0, 7) * (t > 5.3 ? 1 : 0));
      G.cnt.textContent = 'PARTS  ' + String(n).padStart(2, '0') + ' / 07';
    } },
  // 修订 REVISION · 修订云线圈出改动：合拢之后，把要改的地方放大两倍。
  { sheet: '03', dur: 6.5,
    enter() { show(G.g1, 0); show(G.g2, 1); show(G.g3, 1); show(G.det, 1); G.ttl.textContent = 'DETAIL · REV B'; G.ttl.setAttribute('font-size', Math.round(L.ttlF * .55));
      G.ttl2.textContent = '修订 · 局部放大 · SHEET 03'; G.ttlG.style.opacity = 1; },
    draw(t) {
      drawTitle(t); outlineDraw(G.asm, 99, 0); G.asm.holeC.forEach(e => e.style.opacity = 1); G.axisLong.style.opacity = 1;
      const close = ease.out(seg(t, 0, .9)), amts = PARTS.map((_, i) => { const q = seg(t, .05 * Math.abs(i - 3), .05 * Math.abs(i - 3) + .8); return (1 - ease.back(q)) * 1; });
      const pan = ease.inOut(seg(t, .2, 1.4));
      G.V2.ox = lerp(L.c2[0], L.c3[0], pan); G.V2.oy = lerp(L.c2[1], L.c3[1], pan);
      const sh = [G.V2.P(0, 0)[0] - L.c2[0], G.V2.P(0, 0)[1] - L.c2[1]];
      G.g2.setAttribute('transform', `translate(${sh[0].toFixed(1)} ${sh[1].toFixed(1)})`); gridZoom(1, L.c2);
      G.V2.ox = L.c2[0]; G.V2.oy = L.c2[1];
      lenDim(placeParts(amts), 1);
      G.balloons.forEach(b => b.style.opacity = 1 - close);
      G.cnt.textContent = '';
      /* 云线、三角、局部圆 —— 位置随视图走 */
      const V = G.V2, [gx, gy] = V.P(0, 94), rx = (L.P ? 18 : 34) * V.s, ry = (L.P ? 34 : 18) * V.s;
      G.cloud.setAttribute('d', revCloud(gx, gy, rx, ry, 14)); setDraw(G.cloud, ease.inOut(seg(t, 1.3, 2.5)));
      const tq = ease.back(seg(t, 2.4, 2.8)); G.tri.setAttribute('transform', `translate(${gx + rx * .8} ${gy - ry - 8}) scale(${tq})`);
      G.cC.setAttribute('cx', gx); G.cC.setAttribute('cy', gy); G.cC.setAttribute('r', 15 * V.s); setDraw(G.cC, ease.out(seg(t, 2.6, 3.1)));
      G.cCt.setAttribute('x', gx - 15 * V.s - 14); G.cCt.setAttribute('y', gy - 10); G.cCt.style.opacity = seg(t, 2.9, 3.1);
      setDraw(G.dCirc, ease.inOut(seg(t, 2.9, 3.7)));
      const di = ease.out(seg(t, 3.5, 4.3)); G.dIn.style.opacity = di; setDraw(G.dOut, di);
      G.dDims.style.opacity = seg(t, 4.1, 4.5); G.dLab.style.opacity = seg(t, 3.9, 4.3);
      const [ax, ay] = [gx + sh[0] + 15 * V.s * .7, gy + sh[1] - 15 * V.s * .7], [dx, dy] = L.Dc, Rd = L.Rd;
      const ang = Math.atan2(ay - dy, ax - dx);
      G.dLead.setAttribute('d', `M${ax} ${ay}L${dx + Math.cos(ang) * Rd} ${dy + Math.sin(ang) * Rd}`);
      G.dLead.style.opacity = seg(t, 3.0, 3.4);
      const rv = seg(t, 4.3, 4.6);
      document.getElementById('revB').style.opacity = rv;
      const rvv = document.getElementById('revv'); rvv.textContent = rv > .5 ? 'B' : 'A'; rvv.style.color = rv > .5 ? 'var(--rev)' : '';
    } },
];

build();
const Sx = makePlayer(SHOTS, {
  onShot(i, s) {
    document.getElementById('sheet').textContent = s.sheet + ' / 03';
    document.getElementById('scl').textContent = i ? '1 : 4' : '1 : 2';
    if (i < 2) { document.getElementById('revB').style.opacity = 0; const r = document.getElementById('revv'); r.textContent = 'A'; r.style.color = ''; }
  },
  onResize(S) { if (L && (L.W !== innerWidth || L.H !== innerHeight)) { build(); SHOTS[S.i].enter(); } },
});
</script>
