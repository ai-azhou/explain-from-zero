<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自然纪录片样张</title>
<!--
风格：自然纪录片 NATURAL HISTORY
一句话：光只从画面里的光源来（太阳、月亮、星光），前中远三层被雾隔开，镜头慢到几乎察觉不到在动。
擅长表现：光怎么移动、远近怎么分层、一个现场怎样从暗到亮——尺度、距离、慢慢发生的变化；也能给严肃题目一个安静的开场。
招牌细节：
  材质  片元着色器画天空、山脊、海面；35mm 颗粒（全分辨率噪点贴图，24fps 抖动）；暗角；桌面 2.20:1 宽银幕黑边。
  光    逆光：太阳压在远山脊上，山脊一圈轮廓光（取光源色）；体积光（每个像素向太阳采样 20 次，被山和树挡住的地方变暗）。
  光    夜里只有月亮：海面亮带 = 波浪法线反射月亮方向的高光；星光闪烁；近处礁石一道边光（取月光色）。
  主体  四层山脊（远 ×0.08 / ×0.2 / 中 ×0.45 / 前 ×1.0 视差）+ 山谷雾 + 一棵程序生成的逆光树（光从枝叶缝里漏出来）。
  字    英文小标字距 .3em。
  动效  镜头每秒推 0.5%、平移极慢；太阳升起时光束变长、雾变薄；章节之间渐黑；标注读数随视差实时跳。
  角落  黑边里放：样张号、画幅 2.20:1 · 24 FPS。
色彩结构（换题保留）：颜色只从画面里的光源推——一个光源色（太阳 / 月亮 / 天光）管光源附近的天、轮廓光、光束、
  海面亮带；远离光源的天和雾取环境色（和光源色一冷一暖拉开）；景物按远近从「接近天色」退到「接近黑」（大气透视，
  四到五级明度）；树和前景剪影几乎是黑；后期把暗部推向环境色。字只用一种近白 + 一个强调色（读数），强调色取光源色淡一档。黑边、暗角、暗底是电影画面语言本身，不随题换。全部颜色在顶部 PALETTES：
  ui 给字，gl 按名字传进着色器（uniform 数组，着色器里叫 C_名字），退路画法也读同一份。
本例配色（从本例主体「山谷里的一棵树、一片海」和它的现场「日出逆光 + 月夜」推出来，换题就换）：
  日出 skyTop [.015,.03,.09] / skyHor [.40,.30,.40] / sunBand [1,.5,.22] / sil0 [.17,.16,.30] / rim [1,.56,.26]
  月夜 nTop→nHor [.012,.022,.06]→[.08,.12,.22] / moonGlow [.45,.56,.8] / water [.004,.009,.022]；--accent #e8c48a
换题示例（?pal=alt）：假设主角是「雪原上的一棵树、一片冬天的海」、现场是「冬日下午低而白的太阳 + 冰雾；极夜里的
  绿色天光」→ 光源色从暖金换成白，环境色换成冷钴蓝和冰雾青，远山被冰雾刷成蓝灰；夜里天色整片换成极夜的青绿天光，月光和海面亮带跟着偏青；
  强调色取冰薄荷。
  冬日 skyTop [.012,.045,.13] / skyHor [.50,.60,.72] / sunBand [.9,.8,.6] / sil0 [.26,.34,.48] / rim [1,.92,.75]
  极夜 nTop→nHor [.003,.016,.022]→[.04,.125,.11] / band [.014,.1,.06] / moonGlow [.22,.36,.38]；--accent #9fe3c6
字：标题 "Songti SC","STSong","Noto Serif CJK SC",SimSun,Georgia,serif 细体，字距拉开；
    正文 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif 细体；读数 "SF Mono",Menlo,Consolas,monospace。
动效：全部用 inOut 慢曲线；一镜 6–7 秒；同一场景内镜头连续，换场景渐黑。
做粗了 → 做精：
  渐变背景 + 几个三角形山 → 分形山脊、按距离混入天色（大气透视）、山谷雾随噪声漂。
  画一个发光的圆当太阳 → 太阳在画面里，山脊轮廓光、体积光束、光晕压过山边（溢光）。
  镜头不动或匀速平移 → 每层按视差系数移动，推拉每秒不到 1%，起止都缓。
  颗粒用低分辨率着色器噪点被放大 → 全分辨率噪点贴图叠加，每 1/24 秒换位置。
手机竖屏：去掉宽银幕黑边，画面铺满；构图收窄（太阳和树移到中线附近）；
          着色器分辨率减半、光束采样减到 12 次，掉帧时自动再降。
退路：拿不到 WebGL → Canvas 2D 画同一构图的静态近似（渐变天、山脊多边形、光晕、树、海面亮带），字照常。
技法目录：
  T1 宽银幕黑边 + 画面区计算
  T2 程序生成的逆光树（Canvas 递归分枝 → 纹理）
  T3 片元着色器：分形山脊 + 视差相机 + 大气透视 + 山谷雾
  T4 体积光：向光源步进采样遮挡
  T5 夜海：波浪法线反射月光 + 星光 + 礁石边光
  T6 平涂 / 完整对比：同一个着色器按分割线切换
  T7 后期：色调映射、调色、暗角；全分辨率胶片颗粒叠加
  T8 视差标注：JS 镜像山脊函数，锚点贴在山脊上
  T10 退路：Canvas 2D 静态近似；自动降分辨率
-->
<script>
/* ━━ 配色：全片颜色只在这里。默认 = 本例；网址带 ?pal=alt = 换题示例。
   ui 给画面上的字（CSS 变量），gl 给着色器（按 GL_KEYS 顺序传成 uniform 数组，着色器里叫 C_名字） ━━ */
/* ━━ 示范配色：必须换 ━━
   下面两组颜色只属于这份样张自己的主体，不是这种风格的颜色。搬技法进你的成品时，
   这组颜色、报头、角标文字、示例文案一律换成从你的主角、现场的光、题目的情绪推出来的；
   颜色只改这一处，技法代码按角色名取色。按文件头「色彩结构」那一段保留结构。 */
const PALETTES = {
  main: {
    ui: { ink: 'rgba(255,250,240,.94)', dim: 'rgba(255,250,240,.62)', accent: '#e8c48a', bird: '#140f18' },
    gl: { skyHor: [.40,.30,.40], skyMid: [.11,.14,.30], skyTop: [.015,.03,.09], sunBand: [1,.5,.22], sunGlow: [1,.6,.3], sunHalo: [1,.8,.55],
      hazeFar: [.26,.24,.40], hazeSun: [1,.62,.38], cloud: [.38,.3,.42], cloudLit: [1,.66,.45], sunCore: [1,.95,.85],
      sil0: [.17,.16,.30], sil1: [.08,.08,.17], sil2: [.03,.03,.07], sil3: [.006,.006,.012], rim: [1,.56,.26], tree: [.02,.018,.03],
      mist: [.30,.28,.42], mistSun: [1,.72,.5], ray: [1,.68,.40], bloom: [1,.8,.55], bloomCore: [1,.9,.75],
      nHor: [.08,.12,.22], nTop: [.012,.022,.06], moonGlow: [.45,.56,.8], moonHalo: [.7,.78,.95], star: [.85,.9,1], band: [.11,.13,.2],
      nCloud: [.07,.09,.15], nCloudLit: [.6,.66,.82], moon: [.96,.97,1], headland: [.052,.072,.13], water: [.004,.009,.022],
      glint: [.85,.9,1], seaHaze: [.07,.1,.17], shore: [.004,.006,.011], shoreRim: [.4,.5,.72], grade: [.86,1,1.14],
      flatMoon: [.92,.92,.92], flatSea: [.05,.08,.15], flatLand: [.04,.05,.09], flatShore: [.02,.025,.04] } },
  alt: {
    ui: { ink: 'rgba(244,250,255,.95)', dim: 'rgba(226,240,248,.64)', accent: '#9fe3c6', bird: '#0b1220' },
    gl: { skyHor: [.50,.60,.72], skyMid: [.13,.27,.47], skyTop: [.012,.045,.13], sunBand: [.9,.8,.6], sunGlow: [.85,.82,.74], sunHalo: [1,.96,.86],
      hazeFar: [.36,.46,.6], hazeSun: [.96,.92,.82], cloud: [.32,.4,.54], cloudLit: [1,.94,.82], sunCore: [1,.99,.95],
      sil0: [.26,.34,.48], sil1: [.13,.19,.31], sil2: [.05,.08,.15], sil3: [.008,.012,.022], rim: [1,.92,.75], tree: [.01,.014,.022],
      mist: [.5,.6,.74], mistSun: [.98,.95,.88], ray: [.95,.93,.85], bloom: [1,.96,.88], bloomCore: [1,.99,.94],
      nHor: [.04,.125,.11], nTop: [.003,.016,.022], moonGlow: [.22,.36,.38], moonHalo: [.66,.86,.84], star: [.85,1,.95], band: [.014,.1,.06],
      nCloud: [.012,.02,.026], nCloudLit: [.36,.4,.43], moon: [.92,1,.96], headland: [.018,.045,.055], water: [.002,.009,.011],
      glint: [.75,1,.9], seaHaze: [.035,.1,.09], shore: [.003,.007,.008], shoreRim: [.3,.75,.6], grade: [.93,1.03,1.02],
      flatMoon: [.9,.92,.9], flatSea: [.04,.09,.1], flatLand: [.03,.06,.07], flatShore: [.015,.03,.03] } },
};
const PAL = PALETTES[/[?&]pal=alt\b/.test(location.search) ? 'alt' : 'main'];
const GL_KEYS = Object.keys(PALETTES.main.gl);
for (const k in PAL.ui) document.documentElement.style.setProperty('--' + k, PAL.ui[k]);
</script>
<style>
  :root{
    --serif:"Songti SC","STSong","Noto Serif CJK SC",SimSun,Georgia,serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#000;color:var(--ink);font-family:var(--sans)}
  body{overflow:hidden}
  #stage{position:fixed;left:0;right:0;top:var(--iy);height:var(--ih);overflow:hidden;background:#05070d}

  #end b{text-shadow:0 2px 24px rgba(0,0,0,.6)}

  .lbl text{font-family:var(--sans)}
  @media (orientation:portrait){
    .bar#top{background:linear-gradient(rgba(0,0,0,.55),transparent);height:64px;align-items:flex-start;padding-top:16px;letter-spacing:.2em;font-size:12px}
    #top .hide-p{display:none}
    #shade{height:55%;background:linear-gradient(transparent,rgba(0,0,0,.7))}

    #end{top:13%;left:50%;gap:22px} #end span{font-size:12px;letter-spacing:.14em}
    #split span{top:78px}

</style>

<body>
<main id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <svg id="birds" aria-hidden="true"></svg>
  <div id="grain" aria-hidden="true"></div>
  <div id="shade" aria-hidden="true"></div>
  <svg id="ov" aria-hidden="true"></svg>
  <div id="split" aria-hidden="true"><span class="l">平涂 FLAT</span><span class="r">光 · 雾 · 颗粒</span></div>

</main>
<header class="bar" id="top"><span>样张 18 <span class="hide-p">｜ 自然纪录片 NATURAL HISTORY</span></span><span class="r"><span class="hide-p mono">　2.20 : 1 · 24 FPS</span></span></header>
<div id="title" aria-hidden="true"><div class="k"><i></i>第一章　CHAPTER ONE</div><h1>晨光</h1><div class="e">FIRST LIGHT OVER THE VALLEY</div></div>

<script>
/* ━━ 样张自己的播放代码：只为把这份样张播起来，不是成品该用的结构，不要照抄。成品页面上要有哪些东西见 形式.md「页面上要有的东西」，长什么样、怎么排按你的风格自己做 ━━ */
function makePlayer(SHOTS, hooks = {}) {
  const S = { i: 0, t: 0, playing: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    w: innerWidth, h: innerHeight, portrait: innerHeight > innerWidth };
  function enter(i) {
    S.i = (i + SHOTS.length) % SHOTS.length; S.t = 0;
    const s = SHOTS[S.i];
    s.enter && s.enter(S);
    hooks.onShot && hooks.onShot(S.i, s, S);
    if (S.reduce) s.draw(s.dur, 1, S);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt;
      if (S.t >= SHOTS[S.i].dur) enter(S.i + 1);
    }
    const s = SHOTS[S.i];
    if (!S.reduce) s.draw(Math.min(S.t, s.dur), Math.min(1, S.t / s.dur), S);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { S.playing = !document.hidden; last = performance.now(); });
  addEventListener('resize', () => {
    S.w = innerWidth; S.h = innerHeight; S.portrait = S.h > S.w;
    hooks.onResize && hooks.onResize(S);
    if (S.reduce) SHOTS[S.i].draw(SHOTS[S.i].dur, 1, S);
  });
  hooks.onResize && hooks.onResize(S);
  enter(0);
  requestAnimationFrame(frame);
  return S;
}

/* ━━ 缓动：动作要有预备、过冲、回落 ━━ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6 * x) * Math.cos(12 * x),
  step: (x, n) => Math.floor(x * n) / n,
};
const lerp = (a, b, k) => a + (b - a) * k;
const sine = x => .5 - .5 * Math.cos(Math.PI * clamp(x));   // 纪录片的慢起慢停
function rng(s) { return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ━━ T1 宽银幕：桌面 2.20:1 留黑边，竖屏铺满 ━━ */
const root = document.documentElement, $ = id => document.getElementById(id);
let F = {};
function frameLayout() {
  const W = innerWidth, H = innerHeight, P = H > W;
  const ih = P ? H : Math.min(H, Math.round(W / 2.2)), iy = P ? 0 : Math.round((H - ih) / 2);
  F = { W, H, P, ih, iy, mx: P ? 18 : Math.round(clamp(W * .04, 24, 64)) };
  const v = { iy: iy, ih: ih, mx: F.mx,
    h1: P ? 56 : Math.round(clamp(W * .062, 54, 96)), endF: P ? 50 : Math.round(clamp(W * .05, 48, 80)) };
  for (const k in v) root.style.setProperty('--' + k, v[k] + 'px');
}

/* ━━ T8 山脊函数：和着色器里一模一样，标注锚点才能贴在山上 ━━ */
const fr = x => x - Math.floor(x);
function h11(p) { p = fr(p * .1031); p *= p + 33.33; p *= p + p; return fr(p); }
function vn(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return h11(i) * (1 - u) + h11(i + 1) * u; }
function ridge(x, oct) { let s = 0, a = .55, w = 1; for (let k = 0; k < oct; k++) { let n = 1 - Math.abs(vn(x) * 2 - 1); n *= n; s += a * n * w; w = clamp(n * 1.6, .35, 1); x = x * 2.07 + 11.3; a *= .5; } return s; }
function hillN(x, oct) { let s = 0, a = .5; for (let k = 0; k < oct; k++) { s += a * vn(x); x = x * 2.1 + 5.7; a *= .5; } return s; }
const BASE = [-.03, -.11, -.19, -.31], AMP = [.17, .12, .10, .09], FREQ = [1.25, 2.1, 2.7, 1.0], SEED = [3.1, 21.7, 47.3, 8.9], PAR = [.08, .2, .45, 1];
const layerH = (i, x, oct = 5) => BASE[i] + AMP[i] * (i < 3 ? ridge(x * FREQ[i] + SEED[i], oct) : hillN(x * FREQ[i] + SEED[i], oct));
const toL = (p, f, cam) => { const z = 1 + (cam[2] - 1) * f; return [p[0] / z + cam[0] * f, p[1] / z + cam[1] * f]; };
const fromL = (q, f, cam) => { const z = 1 + (cam[2] - 1) * f; return [(q[0] - cam[0] * f) * z, (q[1] - cam[1] * f) * z]; };

/* ━━ T2 逆光树：递归分枝 + 叶团，画在离屏 Canvas 上当纹理 ━━ */
function makeTree(size = 512, seed = 18) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), R = rng(seed); x.fillStyle = x.strokeStyle = '#000'; x.lineCap = 'round';
  function leaves(cx, cy, n) { for (let k = 0; k < n; k++) { const r = size * (.006 + R() * .012); x.beginPath();
    x.ellipse(cx + (R() - .5) * size * .07, cy + (R() - .5) * size * .045, r, r * .7, R() * 3, 0, 7); x.fill(); } }
  function br(px, py, ang, len, w, d) {
    const ex = px + Math.cos(ang) * len, ey = py - Math.sin(ang) * len;
    x.lineWidth = w; x.beginPath(); x.moveTo(px, py);

function ridgeAt(px, cam) { let m = -1; for (let i = 0; i < 3; i++) { const q = toL([px, 0], PAR[i], cam); m = Math.max(m, fromL([q[0], layerH(i, q[0])], PAR[i], cam)[1]); } return m; }
const sunAt = off => { const c = C(); return [c.sx, ridgeAt(c.sx, [0, 0, 1.03]) + off]; };

/* ━━ T8 视差标注：锚点在层坐标里固定，跟着各自的视差走；读数 = 本层已移动的像素 ━━ */
const ov = $('ov'), NSV = 'http://www.w3.org/2000/svg';
let LB = [];
function buildLabels() {
  ov.innerHTML = '';
  const cam0 = [0, 0, 1.03], defs = F.P ? [[3, -.16, .14, '前景', 'FOREGROUND'], [2, .05, .19, '中景', 'MIDDLE'], [0, -.12, .29, '远景', 'DISTANCE']]
    : [[3, -.5, .17, '前景', 'FOREGROUND'], [2, -.14, .2, '中景', 'MIDDLE'], [0, -.38, .3, '远景', 'DISTANCE']];
  LB = defs.map(([i, sx, rise, zh, en]) => {
    let best = sx, bv = -1;
    for (let k = -6; k <= 6; k++) { const px = sx + k * .012, q = toL([px, 0], PAR[i], cam0), h = layerH(i, q[0]);
      let cover = -1; for (let j = i + 1; j < 4; j++) { const qj = toL([px, 0], PAR[j], cam0); cover = Math.max(cover, fromL([qj[0], layerH(j, qj[0])], PAR[j], cam0)[1]); }
      const v = fromL([q[0], h], PAR[i], cam0)[1] - cover; if (v > bv) { bv = v; best = px; } }
    const qx = toL([best, 0], PAR[i], cam0)[0], g = document.createElementNS(NSV, 'g'); g.setAttribute('class', 'lbl'); ov.appendChild(g);
    g.innerHTML = `<line stroke="rgba(255,255,255,.7)" stroke-width="1"/><circle r="4.5" fill="none" stroke="#fff" stroke-width="1.2"/><circle r="1.6" fill="#fff"/>
      <text class="en" font-size="${F.P ? 12 : 11}" letter-spacing="3.3" fill="${PAL.ui.dim}">${en}</text><text class="zh" font-size="${F.P ? 16 : 17}" font-weight="300" letter-spacing="3" fill="${PAL.ui.ink}">${zh}  ×${PAR[i].toFixed(2)}</text>
      <text class="rd" font-size="${F.P ? 13 : 13}" fill="${PAL.ui.accent}" font-family="Menlo,Consolas,monospace"></text>`;
    return { i, qx, rise, g, x0: null };
  });
}
function placeLabels(cam, vis, camStart) {
  LB.forEach((L, k) => {
    const f = PAR[L.i], q = [L.qx, layerH(L.i, L.qx) - .012], [px, py] = fromL(q, f, cam), sx = F.W / 2 + px * F.ih, sy = F.ih / 2 - py * F.ih;
    const p0 = fromL(q, f, camStart), moved = (px - p0[0]) * F.ih, ty = sy - L.rise * F.ih, a = clamp(vis * 3 - k * .5);
    const [ln, c1, c2_, en, zh, rd] = L.g.children;
    ln.setAttribute('x1', sx); ln.setAttribute('y1', sy - 6); ln.setAttribute('x2', sx); ln.setAttribute('y2', lerp(sy - 6, ty + 8, ease.out(clamp(vis * 3 - k * .5))));
    [c1, c2_].forEach(c => { c.setAttribute('cx', sx); c.setAttribute('cy', sy); });
    en.setAttribute('x', sx + 10); en.setAttribute('y', ty - 30); zh.setAttribute('x', sx + 10); zh.setAttribute('y', ty - 8);
    rd.setAttribute('x', sx + 10); rd.setAttribute('y', ty + 12); rd.textContent = '← ' + Math.abs(moved).toFixed(0).padStart(3, '0') + ' px';
    L.g.style.opacity = a;
  });
}

/* 远处一小群鸟：剪影，翅膀按各自相位扇动，极慢地横穿 */
const birdsEl = $('birds'), BIRDS = Array.from({ length: 6 }, (_, k) => ({ dx: k * .034 + (k % 2) * .012, y: .2 + ((k * 37) % 7) * .009, s: .75 + (k % 3) * .17, ph: k * 1.7 }));
birdsEl.innerHTML = BIRDS.map(() => '<path fill="none" stroke="${PAL.ui.bird}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>').join('');
function drawBirds(time, vis) {
  birdsEl.style.opacity = vis; if (!vis) return;
  const x0 = F.P ? .2 : .32, u = F.ih / 650;
  [...birdsEl.children].forEach((el, k) => {
    const b = BIRDS[k], px = x0 + b.dx - time * .016, py = b.y + Math.sin(time * .6 + k) * .005;
    const sx = F.W / 2 + px * F.ih, sy = F.ih / 2 - py * F.ih, w = 7 * b.s * u, f = Math.sin(time * 6.5 + b.ph) * 4.5 * b.s * u;
    el.setAttribute('d', `M${sx - w} ${sy - f}Q${sx - w * .45} ${sy - 2 * u - f * .3} ${sx} ${sy}Q${sx + w * .45} ${sy - 2 * u - f * .3} ${sx + w} ${sy - f}`);
  });
}
const TREE = makeTree();
const state = { sun: [0, 0], tree: [0, 0], cam: [0, 0, 1], time: 0, scene: 0, flat: -1, fade: 1, fog: 1, ray: .5, hor: 0 };
let clock = 0, lastNow = performance.now();
function tick(S) { const now = performance.now(); if (S.playing && !S.reduce) clock += Math.min(.1, (now - lastNow) / 1000); lastNow = now; return clock; }
const show = (el, v) => { el.style.opacity = v; el.style.visibility = v > 0 ? 'visible' : 'hidden'; };

const SHOTS = [
  // 第一章 · 晨 · 光从画面里的太阳来：逆光压在山脊上，山边亮起一圈。
  { dur: 6,
    draw(t, p, S) {
      const c = C(), k = sine(t / 6);
      Object.assign(state, { scene: 0, flat: -1, fog: 1, ray: lerp(.45, .6, k), hor: c.hor, fade: 1,
        sun: sunAt(lerp(-.012, .018, k)), tree: c.tree, cam: [lerp(-.012, 0, k), 0, lerp(1, 1.03, k)], time: tick(S) });
      render(state); grainStep(state.time, 0); drawBirds(state.time, 1);
      show($('title'), S.reduce ? 1 : 1 - seg(t, 5.4, 6)); $('title').querySelector('h1').style.letterSpacing = (F.P ? .36 : .5) + .06 * k + 'em';
      show(ov, 0); show($('split'), 0); show($('end'), 0);
    } },
  // 第二章 · 层 · 前中远三层，各走各的速度：近处移得多，远处几乎不动。
  { dur: 7,
    draw(t, p, S) {
      const c = C(), k = sine(t / 7), camS = [0, 0, 1.03], cam = [c.pan * k, 0, lerp(1.03, 1.065, k)];
      Object.assign(state, { scene: 0, flat: -1, fog: lerp(1, .55, k), ray: lerp(.6, 1.25, k), hor: c.hor, fade: S.reduce ? 1 : 1 - seg(t, 6.3, 7),
        sun: sunAt(lerp(.018, .085, k)), tree: c.tree, cam, time: tick(S) });
      render(state); grainStep(state.time, 0); drawBirds(state.time, state.fade);
      show($('title'), 0); show($('split'), 0); show($('end'), 0);
      show(ov, S.reduce ? 1 : seg(t, .6, 1.2) * (1 - seg(t, 6, 6.5))); placeLabels(cam, S.reduce ? 1 : seg(t, .6, 2.2), camS);
    } },
  // 第三章 · 夜 · 加上光、雾和颗粒：左边平涂，右边是整套做法。
  { dur: 6.5,
    draw(t, p, S) {
      const c = C(), k = sine(t / 6.5);
      const fl = S.reduce ? 0 : t < 1.9 ? lerp(1, .5, sine(seg(t, .5, 1.9))) : lerp(.5, 0, sine(seg(t, 3.1, 4.1)));
      Object.assign(state, { scene: 1, flat: fl, fog: 1, ray: 0, hor: c.hor, fade: S.reduce ? 1 : Math.min(seg(t, 0, .6), 1 - seg(t, 6, 6.5)),
        sun: c.moon, tree: c.tree, cam: [0, 0, lerp(1, 1.025, k)], time: tick(S) });
      render(state); grainStep(state.time, fl); drawBirds(0, 0);
      show($('title'), 0); show(ov, 0);
      const sp = $('split'); sp.style.left = (fl * 100) + '%'; show(sp, fl > .01 && fl < .99 ? 1 : 0);
      show($('end'), S.reduce ? 1 : seg(t, 4.2, 5) * (1 - seg(t, 6, 6.4)));
    } },
];

function layoutAll() { frameLayout(); sizeCanvas(); fitFallback(); buildLabels(); }
frameLayout();
if (!initGL()) useFallback();
const S = makePlayer(SHOTS, {
  onResize() { layoutAll(); },
});
</script>
</body>
</html>
